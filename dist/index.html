,16],fruitHumidityPct:[85,95],faeLevel:`low`,lightLevel:`low`,daysToPin:[10,18],flushIntervalDays:[14,21],numFlushes:[2,3],yieldPctWet:{supplemented:[15,22],highNutrient:[18,25]},dryTempC:[50,57],dryTimeHours:[8,12]},lionsMane:{stars:5,recommendedSubstrates:[`masters`,`sawdust`,`cvg`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[21,24],fruitTempC:[15,21],fruitHumidityPct:[85,95],faeLevel:`high`,lightLevel:`low`,daysToPin:[7,14],flushIntervalDays:[10,18],numFlushes:[2,4],yieldPctWet:{supplemented:[18,25],highNutrient:[15,25]},dryTempC:[50,57],dryTimeHours:[8,14]},shiitake:{stars:4,recommendedSubstrates:[`sawdust`,`masters`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[21,24],fruitTempC:[10,18],fruitHumidityPct:[80,90],faeLevel:`medium`,lightLevel:`low`,daysToPin:[14,28],flushIntervalDays:[21,35],numFlushes:[2,4],yieldPctWet:{highNutrient:[10,20]},dryTempC:[35,45],dryTimeHours:[8,16]},reishi:{stars:3,recommendedSubstrates:[`sawdust`,`masters`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[24,29],fruitTempC:[24,29],fruitHumidityPct:[85,95],faeLevel:`low`,lightLevel:`medium`,daysToPin:[10,20],flushIntervalDays:[30,60],numFlushes:[1,2],yieldPctWet:{highNutrient:[8,15]},dryTempC:[50,60],dryTimeHours:[12,24]},wineCap:{stars:3,recommendedSubstrates:[`straw`,`cardboard`],recommendedGrains:[`rye`,`wheatberries`,`sorghum`],colonizeTempC:[21,27],fruitTempC:[10,24],fruitHumidityPct:[80,95],faeLevel:`high`,lightLevel:`low`,daysToPin:[14,30],flushIntervalDays:[14,30],numFlushes:[2,4],yieldPctWet:{lowNutrient:[10,20]},dryTempC:[45,55],dryTimeHours:[6,10]},buttonAgaricus:{stars:3,recommendedSubstrates:[`manure`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[24,27],fruitTempC:[15,18],fruitHumidityPct:[85,92],faeLevel:`medium`,lightLevel:`none`,daysToPin:[18,25],flushIntervalDays:[10,14],numFlushes:[3,5],yieldPctWet:{manure:[10,18]},dryTempC:[40,50],dryTimeHours:[6,10]},turkeyTail:{stars:4,recommendedSubstrates:[`sawdust`,`masters`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[21,27],fruitTempC:[18,24],fruitHumidityPct:[85,95],faeLevel:`medium`,lightLevel:`medium`,daysToPin:[10,18],flushIntervalDays:[21,35],numFlushes:[1,2],yieldPctWet:{highNutrient:[8,15]},dryTempC:[45,55],dryTimeHours:[8,14]},chestnut:{stars:3,recommendedSubstrates:[`masters`,`sawdust`,`cvg`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[21,24],fruitTempC:[15,21],fruitHumidityPct:[85,95],faeLevel:`medium`,lightLevel:`low`,daysToPin:[10,16],flushIntervalDays:[14,21],numFlushes:[2,3],yieldPctWet:{supplemented:[15,22],highNutrient:[12,20]},dryTempC:[45,55],dryTimeHours:[6,10]},enoki:{stars:2,recommendedSubstrates:[`masters`,`sawdust`,`cvg`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[21,24],fruitTempC:[8,13],fruitHumidityPct:[90,95],faeLevel:`low`,lightLevel:`none`,daysToPin:[10,16],flushIntervalDays:[14,21],numFlushes:[1,2],yieldPctWet:{supplemented:[12,20],highNutrient:[10,18]},dryTempC:[40,50],dryTimeHours:[6,10]},cordyceps:{stars:2,recommendedSubstrates:[`cvg`,`masters`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[20,24],fruitTempC:[16,20],fruitHumidityPct:[80,90],faeLevel:`medium`,lightLevel:`medium`,daysToPin:[14,21],flushIntervalDays:[45,60],numFlushes:[1,1],yieldPctWet:{supplemented:[10,18]},dryTempC:[40,50],dryTimeHours:[8,12]},maitake:{stars:2,recommendedSubstrates:[`sawdust`,`masters`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[21,24],fruitTempC:[15,18],fruitHumidityPct:[90,95],faeLevel:`high`,lightLevel:`low`,daysToPin:[14,25],flushIntervalDays:[30,45],numFlushes:[1,2],yieldPctWet:{highNutrient:[8,15]},dryTempC:[45,55],dryTimeHours:[8,14]},morel:{stars:1,recommendedSubstrates:[`straw`,`cardboard`],recommendedGrains:[`rye`,`wheatberries`],colonizeTempC:[15,21],fruitTempC:[7,15],fruitHumidityPct:[85,95],faeLevel:`high`,lightLevel:`low`,daysToPin:[21,45],flushIntervalDays:[14,30],numFlushes:[1,2],yieldPctWet:{lowNutrient:[3,8]},dryTempC:[35,45],dryTimeHours:[8,14]}},_={en:{ui:{pageTitle:`🍄 Mushroom Cultivation Calculators`,pageSubtitle:`Metric recipe calculators for home mushroom cultivation.`,langLabel:`Language`,unitLabel:`Units`,themeLabel:`Theme`,themeAuto:`Auto`,themeLight:`Light`,themeDark:`Dark`,copyBtn:`Copy as text`,copiedBtn:`Copied!`,tabSubstrate:`Substrate Calculator`,tabLc:`Liquid Culture Calculator`,tabAgar:`Agar Plates`,substrateLabel:`Target substrate`,spawnLabel:`Grain spawn amount (mL)`,spawnTip:`Tip: 1 L of colonized grain spawn weighs roughly 700–800 g.`,calcBtn:`Calculate recipe`,subIngredientsHeader:`Ingredients`,ingCol:`Ingredient`,volCol:`Volume`,wtCol:`Weight`,subTotalLabel:`Total substrate`,substrateFootnote:`Weights are approximate — actual density varies by moisture content and material brand. Adjust water gradually and check hydration by feel (squeeze test: a few drops of water, no dripping stream).`,stepsHeader:`Preparation steps`,lcLabel:`Liquid culture recipe`,jarVolLabel:`Liquid per jar (mL)`,jarCountLabel:`Number of jars`,jarNote:`Fill jars to about 70–80% of their total volume with liquid, leaving headspace for gas exchange and syringe access.`,lcIngredientsHeader:`Ingredients (total for all jars)`,lcTotalLabel:`Total liquid`,lcFootnote:`Concentrations are approximate nutrient % (w/v) commonly used for mushroom liquid culture. Adjust to taste/experience — too concentrated can slow mycelium growth.`,jarsWord:`jars`,agarLabel:`Agar recipe`,plateVolLabel:`Media per plate (mL)`,plateCountLabel:`Number of plates`,agarNote:`A standard 90 mm petri dish takes about 20–25 mL of media. A 10% extra batch volume is included automatically to cover pouring loss.`,agarIngredientsHeader:`Ingredients (total, incl. 10% pour loss)`,agarTotalLabel:`Total media`,agarFootnote:`Agar concentration is ~2% (20 g/L), the standard firmness for mushroom culture work. Nutrient concentrations are approximate — adjust to taste/experience.`,platesWord:`plates`,tabGrain:`Grain Spawn`,grainLabel:`Grain type`,grainJarVolLabel:`Hydrated grain per jar (mL)`,grainNote:`Fill jars to about 60–65% of their volume with hydrated grain, leaving headspace for shaking and gas exchange.`,grainIngredientsHeader:`Ingredients (total for all jars)`,grainTotalLabel:`Total hydrated grain`,grainFootnote:`Weights are approximate — dry grain density and water uptake vary by variety and batch. Drain thoroughly; jars that are too wet are the most common cause of sour/bacterial contamination.`,tabSpecies:`Species Guide`,speciesLabel:`Species`,colonizeHeader:`Colonization`,fruitingHeader:`Fruiting`,colonizeTempLabel:`Temperature`,fruitTempLabel:`Temperature`,fruitHumidityLabel:`Humidity`,faeLabel:`Fresh air exchange`,lightLabel:`Light`,daysToPinLabel:`Days to pinning`,flushIntervalLabel:`Days between flushes`,numFlushesLabel:`Typical flushes`,recommendedSubstratesLabel:`Good substrates`,recommendedGrainsLabel:`Good grain spawn`,faeLow:`Low`,faeMedium:`Medium`,faeHigh:`High`,lightNone:`Not required`,lightLow:`Low, indirect`,lightMedium:`Moderate, indirect`,daysUnit:`days`,tabYield:`Yield Estimator`,yieldSpeciesLabel:`Species`,yieldSubstrateLabel:`Substrate used`,yieldWeightLabel:`Prepared (wet) substrate weight`,yieldResultLabel:`Estimated total fresh yield`,yieldPerFlushLabel:`Roughly per flush`,yieldDisclaimer:`Rough planning estimate only, based on typical reported ranges for home growers. Actual yield depends heavily on genetics, technique, contamination, and environment — treat this as a ballpark, not a promise.`,tabDrying:`Drying Helper`,dryingSpeciesLabel:`Species`,dryingThicknessLabel:`Slice thickness`,dryingThicknessThin:`Thin (≤ 5 mm)`,dryingThicknessMedium:`Medium (5–10 mm)`,dryingThicknessThick:`Thick / whole small caps (> 10 mm)`,dryingTempResultLabel:`Dehydrator temperature`,dryingTimeResultLabel:`Typical drying time`,dryingFootnote:`Times vary a lot with airflow, humidity, and how tightly caps are packed. Dry until pieces snap cleanly rather than bend — that matters more than the clock.`,tabConditions:`Fruiting Check`,conditionsSpeciesLabel:`Species`,conditionsTempLabel:`Current room temperature (°C)`,conditionsHumidityLabel:`Current humidity (% RH)`,conditionsFaeLabel:`Your fresh air exchange`,conditionsLightLabel:`Your light exposure`,conditionsFaeLowOpt:`1× a day or less (tent mostly closed)`,conditionsFaeMediumOpt:`2–4× a day fanning, or small FAE holes`,conditionsFaeHighOpt:`Continuous fan, large holes, or open shelf`,conditionsLightNoneOpt:`Dark / no light`,conditionsLightLowOpt:`Low indirect light, a few hours a day`,conditionsLightMediumOpt:`Bright indirect light most of the day`,conditionsTempResultLabel:`Temperature`,conditionsHumidityResultLabel:`Humidity`,conditionsFaeResultLabel:`Fresh air exchange`,conditionsLightResultLabel:`Light`,conditionsTargetPrefix:`Target`,conditionsStatusOk:`Good`,conditionsStatusTooCold:`Too cold`,conditionsStatusTooWarm:`Too warm`,conditionsStatusTooDry:`Too dry`,conditionsStatusTooHumid:`Too humid`,conditionsStatusLowFae:`Increase airflow`,conditionsStatusLowLight:`Add some light`,conditionsOverallGood:`Conditions look good — you should get clean, healthy pins.`,conditionsOverallIssues:`One or more conditions need adjusting before pinning will go well.`,conditionsDisclaimer:`A rough guide based on typical reported ranges for home growers, not a lab measurement. Small deviations for short periods are normal — react to trends, not single readings.`,conditionsOptimalTitle:`Optimal settings for`,conditionsOptimalTempPill:`Temp`,conditionsOptimalHumidityPill:`Humidity`,conditionsFaeLevelLow:`Low`,conditionsFaeLevelMedium:`Medium`,conditionsFaeLevelHigh:`High`,conditionsLightLevelNone:`None`,conditionsLightLevelLow:`Low`,conditionsLightLevelMedium:`Medium`,tabRecipes:`Recipes`,recipesSpeciesLabel:`Species`,recipeDifficultyEasy:`Easy`,recipeDifficultyMedium:`Intermediate`,recipeDifficultyAdvanced:`Advanced`,recipeTimeUnit:`min`,recipeServingsLabel:`Servings`,recipeIngredientsHeader:`Ingredients`,recipeStepsHeader:`Steps`,recipeNutritionHeader:`Nutrition (per serving, approx.)`,recipeKcalLabel:`Calories`,recipeKcalUnit:`kcal`,recipeProteinLabel:`Protein`,recipeCarbsLabel:`Carbs`,recipeFatLabel:`Fat`,recipeFiberLabel:`Fiber`,recipeBenefitsHeader:`Why it's good for you`,recipesFootnote:`Cook mushrooms thoroughly — several species (morels especially) are unsafe raw or undercooked. These are general starting points; adjust seasoning and cooking time to taste. Nutrition values are rough estimates, not a lab analysis, and the benefit notes are general nutritional information, not medical advice.`},substrates:{cvg:{name:`CVG — Coco Coir / Vermiculite / Gypsum`,description:`General-purpose bulk substrate for gourmet mushrooms (oyster, lion's mane, etc). Ratio ≈ 1 part spawn : 2 parts substrate by volume.`,ratingNote:`Excellent — the reliable gold standard: consistent colonization, strong yields, low contamination risk.`,ingredients:[`Coco coir brick (dry, compressed)`,`Water (to hydrate coir)`,`Vermiculite`,`Gypsum (calcium sulfate)`],steps:[`Break up the dry coco coir brick ({i0w}) into a large tub.`,`Pour in {i1v} of near-boiling water, cover, and let it sit 20–30 min until fully absorbed and cool to room temperature.`,`Fluff the hydrated coir with gloved hands to break up clumps.`,`Add {i2v} vermiculite and {i3w} gypsum. Mix thoroughly.`,`Check moisture with a squeeze test — a few drops should release, no steady stream. Add small amounts of water if too dry.`,`Break your grain spawn ({V}) apart and layer/mix it evenly through the substrate (roughly 1:2 spawn-to-substrate by volume).`,`Pack loosely into a grow bag/tub with filter patch or air holes, and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Coco coir/vermiculite mixes are low-nutrient, so they resist contamination reasonably well, but still work with clean hands/gloves and sanitized tools.`},masters:{name:`Master's Mix — Soy Hull + Hardwood Pellets`,description:`High-nutrient, high-yield substrate for gourmet mushrooms. Ratio ≈ 1 part spawn : 1 part substrate by volume.`,ratingNote:`Excellent — typically the highest yields of any common recipe, but demands full sterilization and clean technique.`,ingredients:[`Soy hull pellets (dry)`,`Hardwood pellets (dry)`,`Water (for soaking, excess drained)`],steps:[`Combine {i0w} soy hull pellets and {i1w} hardwood pellets in a bucket.`,`Cover with {i2v} of water and soak for 1–2 hours — pellets will swell and break apart into a sawdust-like texture.`,`Drain thoroughly in a colander/mesh bag until no water drips out (field capacity). This is your final hydrated substrate, about {V}.`,`Sterilize the hydrated substrate in bags/jars at 15 psi for 90 minutes (this mix is nutrient-rich and needs full sterilization, not just pasteurization).`,`Let cool completely, then break apart your grain spawn ({V}) and mix in thoroughly at roughly a 1:1 ratio in a still-air box or flow hood.`,`Seal and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Master's Mix is nutrient-dense, so it is more contamination-prone — full pressure sterilization and clean-air technique are strongly recommended.`},straw:{name:`Pasteurized Straw`,description:`Classic low-cost bulk substrate, typically for oyster mushrooms. Ratio ≈ 1 part spawn : 4 parts straw by volume.`,ratingNote:`Very good — fast colonization and cheap, but yields run lower than nutrient-supplemented mixes like CVG or Master's Mix.`,ingredients:[`Chopped wheat/barley straw (dry)`,`Water (for hot-water pasteurization bath)`],steps:[`Chop or shred the straw into 5–10 cm pieces — about {i0v} loosely packed ({i0w} dry).`,`Submerge the straw in a mesh bag in hot water at 60–70°C for 60–90 minutes to pasteurize (use roughly {i1v} water, enough to fully submerge).`,`Remove and drain/spin until excess water stops running out — straw should be moist but not dripping.`,`Let cool to room temperature, then break apart your grain spawn ({V}) and layer it between handfuls of straw in a grow bag (spawn-straw-spawn-straw...).`,`Poke or cut small air holes/slits in the bag, and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Straw only needs pasteurization (not full sterilization) since it's a low-nutrient substrate — hot water or steam pasteurization is sufficient with clean handling afterward.`},manure:{name:`Composted Manure Substrate`,description:`Rich substrate for button/portobello-type mushrooms. Ratio ≈ 1 part spawn : 6 parts composted substrate by volume.`,ratingNote:`Very good for manure-loving species (button, portobello); a poor fit for wood-loving species like oyster or shiitake.`,ingredients:[`Composted horse manure (moist, ready)`,`Gypsum`,`Water (to fine-tune moisture)`],steps:[`Start with well-composted, aged horse manure (no fresh/hot manure) — about {i0v} ({i0w}).`,`Mix in {i1w} gypsum to improve structure and reduce stickiness.`,`Adjust moisture with up to {i2v} water until the compost holds together when squeezed but doesn't drip.`,`Pasteurize the compost at 60–65°C for 1–2 hours (tray pasteurization or steam) to kill competitors while preserving beneficial microbes.`,`Let cool to room temperature, then break apart your grain spawn ({V}) and mix thoroughly into the compost at roughly a 1:6 ratio.`,`Fill trays or tubs, cover with a casing layer once colonized, and incubate at 21–24°C in the dark.`],hygiene:`Composted manure carries a natural microbial community — pasteurize (not sterilize) to keep the beneficial competitors alive while knocking back pathogens.`},coffee:{name:`Spent Coffee Grounds`,description:`Beginner-friendly recycled substrate for oyster mushrooms — the brewing process already pasteurizes the grounds. Ratio ≈ 1 part spawn : 2 parts grounds by volume.`,ratingNote:`Good, very low-effort and low-contamination beginner option, but modest yields — best used fresh and mixed with straw or coir for bulk.`,ingredients:[`Used (spent) coffee grounds, cooled`],steps:[`Collect {i0w} of freshly used coffee grounds (still warm from brewing counts as pasteurized) and let them cool to room temperature in a clean, covered container.`,`Break up any clumps — grounds should be crumbly, not compacted.`,`In a still-air box or clean area, break apart your grain spawn ({V}) and mix it thoroughly into the grounds at roughly a 1:2 ratio.`,`Pack loosely into a grow bag/tub with filter patch or air holes — don't compact, coffee grounds need airflow.`,`Incubate in the dark at 21–24°C until fully colonized. Use within a day or two of brewing for the lowest contamination risk.`],hygiene:`The heat of brewing (near 90°C+) plus coffee's natural acidity give this substrate solid built-in contamination resistance — just keep containers and hands clean and use grounds while still fresh.`},cardboard:{name:`Cardboard Substrate`,description:`Cheap, simple beginner substrate from shredded corrugated cardboard — good for practice runs and small oyster mushroom projects. Ratio ≈ 1 part spawn : 3 parts soaked cardboard by volume.`,ratingNote:`Fair — very cheap and easy to source, but low nutrient density means smaller, slower flushes than dedicated substrates. Good for learning, not for serious yields.`,ingredients:[`Shredded plain corrugated cardboard (dry, no ink/tape)`,`Water (for soaking/pasteurizing)`],steps:[`Remove all tape, labels, and glossy printed sections, then tear or shred {i0w} plain corrugated cardboard into strips.`,`Submerge in {i1v} hot water (60–70°C) for 60–90 minutes to pasteurize and soften.`,`Drain and gently squeeze out excess water until moist but not dripping.`,`Let cool to room temperature, then break apart your grain spawn ({V}) and layer it between strips of cardboard in a grow bag.`,`Poke small air holes in the bag, and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Only use plain brown cardboard — printed ink and glossy coatings can inhibit growth or introduce contaminants. Pasteurization (not full sterilization) is sufficient for this low-nutrient substrate.`},sawdust:{name:`Sawdust Fruiting Block (Hardwood + Bran)`,description:`Traditional substrate for wood-loving species like shiitake, reishi, and lion's mane — hardwood sawdust supplemented with wheat bran. Ratio ≈ 1 part spawn : 4 parts substrate by volume.`,ratingNote:`Excellent for wood-loving species — slower colonization than grain-friendly recipes, but dense blocks give a long, productive fruiting life.`,ingredients:[`Hardwood sawdust (dry, non-resinous)`,`Wheat bran`,`Water (to hydrate)`],steps:[`Combine {i0w} hardwood sawdust (oak, maple, beech — avoid resinous softwoods) with {i1w} wheat bran in a large tub.`,`Gradually mix in {i2v} water until you reach field capacity (squeeze test: a few drops release, no steady stream).`,`Pack tightly into heat-tolerant bags or jars — sawdust blocks are dense, so pressure sterilize at 15 psi (121°C) for 2–2.5 hours (longer than looser substrates).`,`Let cool completely, then break apart your grain spawn ({V}) and mix in thoroughly at roughly a 1:4 ratio in a still-air box or flow hood.`,`Seal and incubate in the dark at 21–24°C until fully colonized — this substrate is denser and typically takes longer (3–5+ weeks) than grain-based substrates.`],hygiene:`The bran addition makes this substrate nutrient-rich and contamination-prone — full pressure sterilization with extended time is essential due to the density of packed sawdust.`}},lc:{lme:{name:`Light Malt Extract (LME) Syrup — 4%`,description:`The most common LC recipe. Gentle, reliable nutrient source for mycelium growth.`,ratingNote:`Excellent — the most widely used and reliable LC recipe, with consistent, vigorous growth.`,ingredients:[`Light malt extract (LME)`,`Distilled/RO water (to final volume)`],steps:[`Dissolve {i0w} light malt extract into about half of your water while gently heating and stirring until fully dissolved.`,`Top up with the remaining water to reach a total of {V}.`,`Distribute into jars, filling each to about 70–80% capacity. Fit lids with self-healing injection ports and micron filter for gas exchange.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes. Let cool fully to room temperature before handling.`,`In a still-air box or flow hood, inject spore solution or liquid culture (1–2 mL per jar) through the injection port with a sterile syringe.`,`Incubate at 21–27°C, swirling gently every day or two. Mycelium growth appears as fluffy white clouds within 3–10 days.`],hygiene:`Discard any jar that turns cloudy/discolored unevenly, smells sour or rotten, or shows colored (green/black/pink) spots — signs of contamination.`},honey:{name:`Honey Water — 4%`,description:`Simple pantry-ingredient alternative to malt extract, similar nutrient concentration.`,ratingNote:`Very good — easy pantry option with solid growth, though slightly more contamination-prone than LME.`,ingredients:[`Raw honey`,`Distilled/RO water (to final volume)`],steps:[`Warm about half your water and stir in {i0w} raw honey until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until you see fluffy white mycelium growth (3–10 days).`],hygiene:`Honey water can be slightly more contamination-prone than LME — always use raw (not heavily processed) honey and sterilize thoroughly.`},cornsyrup:{name:`Light Corn Syrup — 3%`,description:`Cheap, widely available alternative with a slightly lower nutrient concentration.`,ratingNote:`Very good — cheap, effective, and comparable in performance to honey water.`,ingredients:[`Light corn syrup`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} light corn syrup into warm water until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Discard any jar showing uneven cloudiness, odd colors, or bad smell — signs of bacterial or mold contamination.`},dextrose:{name:`Dextrose Syrup — 4%`,description:`Pure simple-sugar LC using dextrose (glucose) powder — very consistent, no boiling required to dissolve.`,ratingNote:`Very good — highly consistent since it's a pure sugar, though mycelium can grow slightly thinner than on malt-based recipes.`,ingredients:[`Dextrose (glucose) powder`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} dextrose powder into warm water until fully dissolved (dissolves easily, no heavy heating needed).`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Dextrose solution is very clean-tasting to mycelium but also to contaminants — sterilize thoroughly and inoculate with clean technique.`},potatodextrose:{name:`Potato Dextrose Liquid — 20% potato / 2% dextrose`,description:`Closer to PDA nutrient profile; a good option if you already work with potato-based media.`,ratingNote:`Very good — matches PDA's nutrient profile closely, giving vigorous growth, though more prep work than sugar syrups.`,ingredients:[`Peeled potato (diced)`,`Dextrose (glucose)`,`Water (for boiling + topping to volume)`],steps:[`Peel and dice {i0w} potato, then boil in most of the water for 20–30 minutes until soft.`,`Strain out the potato solids, keeping only the infusion liquid. Dissolve in {i1w} dextrose while still warm.`,`Top up with water to reach {V} total volume.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood, then incubate at 21–27°C until fluffy white growth appears (3–10 days).`],hygiene:`Potato-based liquids are nutrient-rich and more contamination-prone — sterilize thoroughly and keep injection technique very clean.`},brownsugar:{name:`Brown Sugar Syrup — 4%`,description:`Budget pantry-ingredient LC using brown sugar — a step down from LME in refinement but very cheap and effective.`,ratingNote:`Good budget option — works reliably, though growth is typically a bit less vigorous than malt-based recipes.`,ingredients:[`Brown sugar`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} brown sugar into warm water until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Brown sugar's molasses content can slightly darken the syrup and make contamination harder to spot early — inspect closely and sterilize thoroughly.`},maple:{name:`Maple Syrup — 4%`,description:`Improvised LC using pure maple syrup — its natural mineral content can give a small vigor boost over plain sugar syrups.`,ratingNote:`Good pantry alternative — trace minerals may help vigor, but pure maple syrup is a pricier option.`,ingredients:[`Pure maple syrup (not pancake syrup)`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} pure maple syrup into warm water until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Use pure maple syrup only — imitation "pancake syrup" is mostly corn syrup with additives that offer no benefit. Sterilize thoroughly as with any sugar-based media.`},wort:{name:`Homemade Malted Barley Wort`,description:`Fully improvised LC made by steeping crushed malted barley grain (like a mini beer mash) instead of using store-bought malt extract.`,ratingNote:`Excellent — essentially homemade malt extract, near-identical performance to LME once you've got the mashing technique down.`,ingredients:[`Crushed malted barley grain`,`Water (for steeping + topping to volume)`],steps:[`Heat most of the water to 65–68°C (use a thermometer — this range converts starch to sugar without denaturing the enzymes).`,`Stir in {i0w} crushed malted barley grain and hold at 65–68°C for 60 minutes, stirring occasionally (this is a mini "mash").`,`Strain out the spent grain husks through a mesh bag or cheesecloth, keeping only the sweet liquid (wort). Top up with water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood, then incubate at 21–27°C until fluffy white growth appears (3–10 days).`],hygiene:`Hold the mash temperature carefully — too hot and you lose the enzyme conversion, too cool and bacteria can gain a foothold before sterilization.`}},agar:{mea:{name:`Malt Extract Agar (MEA)`,description:`The most popular homemade agar for mushroom culture work — gentle nutrient level, easy to pour and read.`,ratingNote:`Excellent — the gold standard for home culture work, reliable and easy to read.`,ingredients:[`Light malt extract (LME)`,`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Combine {i0w} light malt extract and {i1w} agar-agar powder with the water ({V} total) in a heat-safe flask or jar.`,`Stir, then heat/boil for 1–2 minutes while stirring until the agar fully dissolves (liquid turns clear, no gritty powder left).`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid) — do not let it fully set in the container.`,`In a still-air box or flow hood, pour a thin layer (about 20–25 mL per standard 90 mm dish) into sterile petri dishes, swirling gently to cover the base.`,`Leave lids slightly ajar until the agar sets and cools, then close and store upside-down in the fridge until use.`],hygiene:`Wipe down your work surface with isopropyl alcohol before pouring, and pour quickly once dishes are opened to minimize airborne contamination exposure.`},pda:{name:`Potato Dextrose Agar (PDA)`,description:`Classic mycology standard, made from a real potato infusion — great for observing mycelium characteristics.`,ratingNote:`Excellent — the mycology-standard formula, great vigor and ideal for observing growth characteristics.`,ingredients:[`Peeled potato (diced)`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for boiling + topping to volume)`],steps:[`Peel and dice {i0w} potato, then boil in most of the water for 20–30 minutes until soft.`,`Strain out the solids, keeping only the potato infusion liquid. Top up with water back to {V} total.`,`While still hot, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`PDA is nutrient-rich, making it more prone to bacterial contamination — sterilize thoroughly and pour with very clean technique.`},mya:{name:`Malt Yeast Agar (MYA)`,description:`MEA boosted with a small amount of nutritional/brewer's yeast for slightly faster, more vigorous mycelium growth.`,ratingNote:`Excellent — the added yeast gives noticeably faster, more vigorous growth than plain MEA.`,ingredients:[`Light malt extract (LME)`,`Nutritional/brewer's yeast`,`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Combine {i0w} light malt extract, {i1w} nutritional yeast, and {i2w} agar-agar powder with the water ({V} total).`,`Stir, then heat/boil for 1–2 minutes while stirring until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`The added yeast makes this a richer medium — keep pours quick and your work area freshly sanitized to avoid contamination.`},honeyagar:{name:`Honey Agar`,description:`Pantry-ingredient agar using raw honey instead of malt extract — a simple option if LME isn't on hand.`,ratingNote:`Good backup option when LME isn't on hand, though the gel softens faster over storage time.`,ingredients:[`Raw honey`,`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Dissolve {i1w} agar-agar powder into the water ({V} total) and bring to a boil for 1–2 minutes, stirring, until fully dissolved.`,`Remove from heat and stir in {i0w} raw honey until dissolved.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Honey can slightly soften agar over time — use plates within a few weeks and store cold. Sterilize thoroughly as with any sugar-based media.`},ricewater:{name:`Rice Water Agar (RWA)`,description:`Cheap, widely-used improvised agar made from starchy rice cooking water — a common no-malt-extract substitute.`,ratingNote:`Good budget improvised option — solid growth for isolation work, though less vigorous than MEA/PDA.`,ingredients:[`Uncooked white rice`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for boiling + topping to volume)`],steps:[`Simmer {i0w} uncooked rice in most of the water for 15–20 minutes until the water turns cloudy and starchy — do not let the rice fully break apart.`,`Strain out the rice, keeping only the starchy rice water. Top back up with water to reach {V} total.`,`While still hot, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Rice starch supports contaminants as readily as mycelium — sterilize thoroughly and don't skip the pressure-cook step even though the ingredients look "just food".`},coconutwater:{name:`Coconut Water Agar (CWA)`,description:`Improvised agar using unsweetened coconut water as the base liquid — naturally contains sugars and minerals.`,ratingNote:`Good improvised option — naturally near-sterile liquid with decent minerals, but less refined growth than MEA.`,ingredients:[`Unsweetened coconut water`,`Dextrose (glucose)`,`Agar-agar powder`],steps:[`Pour {i0v} unsweetened coconut water (plain, no added sugar/flavoring) into a heat-safe flask or jar.`,`Stir in {i1w} dextrose and {i2w} agar-agar powder, then bring to a gentle boil for 1–2 minutes, stirring, until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Use pure, unsweetened, preferably pasteurized coconut water — flavored or sugar-added versions contaminate more easily and can inhibit mycelium.`},plainwater:{name:`Plain Water Agar (PWA)`,description:`Bare-bones improvised agar with no added nutrients — useful for spore germination checks and isolating clean tissue away from faster-growing contaminants.`,ratingNote:`Fair overall performance — slow, thin growth by design, but valuable specifically for clean isolation and germination work.`,ingredients:[`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} agar-agar powder into {V} water in a heat-safe flask or jar.`,`Bring to a gentle boil for 1–2 minutes, stirring constantly, until the agar fully dissolves (liquid turns clear).`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`With no added nutrients, fast-growing contaminants have less of an advantage — handy for isolating clean mycelium, but growth will be slower and thinner than on MEA/PDA.`},banana:{name:`Banana Agar (BA)`,description:`Improvised agar made from blended ripe banana — a popular fruit-based option with good natural sugars.`,ratingNote:`Good improvised option — ripe bananas provide solid sugars, but batches can be a bit cloudier/less clear than MEA.`,ingredients:[`Ripe banana (blended)`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for blending + topping to volume)`],steps:[`Blend {i0w} peeled ripe banana with about a third of the water until smooth.`,`Strain through cheesecloth or a fine mesh bag to remove pulp fibers, keeping the liquid. Top up with remaining water to reach {V} total.`,`Stir in {i1w} dextrose and {i2w} agar-agar powder, then bring to a gentle boil for 1–2 minutes, stirring, until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Use fully ripe (but not moldy) bananas and strain thoroughly — leftover pulp fibers can trap air bubbles and make contamination harder to spot early.`},carrot:{name:`Carrot Agar (CA)`,description:`Improvised agar using a boiled carrot infusion in place of potato — a common beginner substitute for PDA.`,ratingNote:`Good improvised option — mild, beginner-friendly nutrient profile, commonly used for isolation work.`,ingredients:[`Carrot (chopped)`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for boiling + topping to volume)`],steps:[`Chop {i0w} carrot and boil in most of the water for 20–30 minutes until soft.`,`Strain out the solids, keeping only the carrot infusion liquid. Top up with water back to {V} total.`,`While still hot, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Carrot infusions are mild in nutrients — sterilize thoroughly as usual, but expect slightly slower colonization than richer media like PDA.`},beerwort:{name:`Beer Wort Agar (Homemade Malt)`,description:`Fully improvised agar made by steeping crushed malted barley grain into a homemade wort, then gelling with agar — no store-bought malt extract needed.`,ratingNote:`Excellent — essentially homemade MEA once you dial in the mash technique, with very similar performance.`,ingredients:[`Crushed malted barley grain`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for steeping + topping to volume)`],steps:[`Heat most of the water to 65–68°C, then stir in {i0w} crushed malted barley grain. Hold at 65–68°C for 45–60 minutes, stirring occasionally.`,`Strain out the spent grain husks through a mesh bag or cheesecloth, keeping only the sweet wort liquid. Top up with water to reach {V} total.`,`While still warm, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Hold the mash temperature carefully for proper starch-to-sugar conversion, and sterilize thoroughly afterward — same care as with the liquid culture version of this recipe.`}},grain:{rye:{name:`Rye Berries`,description:`The classic, most widely used spawn grain — small, uniform, and reliable for almost every gourmet species.`,ratingNote:`Excellent — the gold-standard spawn grain: consistent colonization and broad compatibility with almost any species.`,ingredients:[`Dry rye berries`,`Water (for soak + simmer)`,`Gypsum (calcium sulfate)`],steps:[`Measure out {i0v} ({i0w}) of dry rye berries and rinse thoroughly in a colander until the water runs clear.`,`Soak in {i1v} of water for 12–24 hours at room temperature, then simmer gently for 10–15 minutes until the husks just begin to split — avoid a rolling boil, which splits grains open and invites contamination.`,`Drain thoroughly in a colander for 15–20 minutes and let surface moisture evaporate, then mix in {i2w} gypsum to reduce clumping.`,`Load into jars with self-healing injection-port lids, filling each to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, then cool completely before inoculating with spores or liquid culture through the injection port in a still-air box or flow hood.`,`Shake well to distribute the inoculation point through the jar, then incubate in the dark at 21–24°C until fully colonized (roughly 1–3 weeks).`],hygiene:`Rye is nutrient-dense and among the more contamination-prone spawn grains — drain it well (wet jars are the #1 cause of bacterial "sour spawn") and sterilize the full 90 minutes.`},wheatberries:{name:`Wheat Berries`,description:`A close alternative to rye with a similar size and starch content — use whichever is cheaper or easier to source locally.`,ratingNote:`Excellent — performs almost identically to rye, a great substitute when rye isn't available.`,ingredients:[`Dry wheat berries`,`Water (for soak + simmer)`,`Gypsum (calcium sulfate)`],steps:[`Measure out {i0v} ({i0w}) of dry wheat berries and rinse thoroughly until the water runs clear.`,`Soak in {i1v} of water for 12–24 hours, then simmer gently for 10–15 minutes until the husks just begin to split.`,`Drain well for 15–20 minutes and let the surface dry slightly, then mix in {i2w} gypsum to reduce clumping.`,`Load into jars with self-healing injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes and cool completely before inoculating in a still-air box or flow hood.`,`Shake to distribute inoculation, then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Like rye, wheat berries are nutrient-rich and prone to sour spawn if left too wet — drain thoroughly and don't skip any of the sterilization time.`},oats:{name:`Whole Oat Groats`,description:`Softer-husked grain that colonizes a little faster than rye, though the husk is more fragile once fully hydrated.`,ratingNote:`Very good — fast colonization, but handle gently after hydration since the husk breaks down more easily.`,ingredients:[`Whole oat groats`,`Water (for soak + simmer)`,`Gypsum (calcium sulfate)`],steps:[`Measure out {i0v} ({i0w}) of whole oat groats and rinse well until the water runs mostly clear.`,`Soak in {i1v} of water for 8–12 hours (oats hydrate faster than rye), then simmer gently for 5–10 minutes until just tender — watch closely, oats overcook quickly.`,`Drain thoroughly and handle gently — the softened husk tears easily. Mix in {i2w} gypsum once mostly dry-surfaced.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake gently to distribute, then incubate in the dark at 21–24°C until fully colonized — oats often colonize a few days faster than rye.`],hygiene:`Oats hydrate and overcook faster than rye — err on the shorter side of simmer time, since mushy grain drains poorly and contaminates more easily.`},popcorn:{name:`Popcorn (Whole Kernel)`,description:`Cheap, widely available bulk spawn grain — plain unflavored popping corn kernels, not the microwave bag kind.`,ratingNote:`Good — inexpensive and easy to find, though slightly less consistent colonization than rye.`,ingredients:[`Dry popcorn kernels`,`Water (for soak + simmer)`],steps:[`Measure out {i0v} ({i0w}) of dry popcorn kernels (plain, unflavored) and rinse well.`,`Soak in {i1v} of water for 24 hours, then simmer gently for 15–20 minutes until kernels swell and the skin just starts to split — do not let them pop.`,`Drain thoroughly in a colander for 15–20 minutes until no water pools at the bottom.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake to distribute, then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Popcorn's tough outer skin holds up well to handling, but make sure kernels are fully hydrated through to the center before jarring — a hard, dry core will not colonize.`},millet:{name:`Millet`,description:`Small round grain popular for its high spawn-to-substrate surface area — many small grains spread colonization quickly through bulk substrate.`,ratingNote:`Good — excellent surface area for spawning bulk substrate, but easy to overcook into mush if simmered too long.`,ingredients:[`Dry millet`,`Water (for soak + simmer)`],steps:[`Measure out {i0v} ({i0w}) of dry millet and rinse well in a fine sieve.`,`Soak in {i1v} of water for 8–12 hours, then simmer gently for 5–8 minutes only — millet is small and cooks fast, so watch closely to avoid mush.`,`Drain thoroughly and spread briefly to air-dry the surface before jarring.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake well — millet's many small grains spread inoculation points quickly — then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Millet's small size means it overcooks in minutes, not tens of minutes — mushy, broken grain drains poorly and is much more contamination-prone.`},sorghum:{name:`Sorghum (Milo)`,description:`Cheap bulk grain, often sold as wild bird seed — a solid budget option similar in size to millet.`,ratingNote:`Good — very budget-friendly and widely available, with solid colonization once properly hydrated.`,ingredients:[`Dry sorghum (milo)`,`Water (for soak + simmer)`],steps:[`Measure out {i0v} ({i0w}) of dry sorghum (milo) and rinse well, picking out any chaff or debris if using bulk bird seed.`,`Soak in {i1v} of water for 12–24 hours, then simmer gently for 10–15 minutes until kernels swell and the skin just starts to split.`,`Drain thoroughly in a colander for 15–20 minutes.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake to distribute, then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`If sourcing sorghum as bulk "wild bird seed," check the bag for other grain types mixed in and pick them out — a consistent single grain colonizes more evenly.`}},species:{oyster:{name:`Oyster Mushroom (Pleurotus ostreatus)`,description:`The classic beginner species — fast, forgiving, and productive on almost any low-cost substrate.`,ratingNote:`Excellent — the most forgiving and reliable species for a first grow, tolerant of imperfect conditions.`},pinkOyster:{name:`Pink Oyster (Pleurotus djamor)`,description:`A fast, warmth-loving oyster relative with striking pink color — pins quickly but has a short shelf life once picked.`,ratingNote:`Very good — very fast growth and dramatic color, but fruits degrade within a day or two so plan to eat or process quickly.`},kingOyster:{name:`King Oyster (Pleurotus eryngii)`,description:`Thick, meaty stems and a milder flavor than other oysters — prized for texture but slower and more particular about cool fruiting temperatures.`,ratingNote:`Very good — excellent texture and shelf life, though it needs a cooler fruiting period and lower fresh air exchange than most oysters.`},lionsMane:{name:`Lion's Mane (Hericium erinaceus)`,description:`Distinctive shaggy white fruit with no true cap or gills — popular for its seafood-like texture and culinary/nutraceutical interest.`,ratingNote:`Excellent — reliable and rewarding, though it wants strong fresh air exchange or fruits grow spiny and stunted instead of forming full "teeth".`},shiitake:{name:`Shiitake (Lentinula edodes)`,description:`Slow-colonizing wood-loving species that typically needs a cold-water soak to trigger pinning after the block is fully colonized.`,ratingNote:`Very good — outstanding flavor and shelf life, but the slowest species here to colonize and fruit, needing real patience.`},reishi:{name:`Reishi (Ganoderma lucidum)`,description:`A hardy, warmth-loving polypore grown for its woody, medicinal fruit body rather than eaten fresh — usually dried and extracted.`,ratingNote:`Good — very forgiving and contamination-resistant, but slow, with a single long fruiting cycle rather than quick repeat flushes.`},wineCap:{name:`Wine Cap (Stropharia rugosoannulata)`,description:`A vigorous, cold-tolerant species best known for outdoor beds on straw or wood chips — a good low-tech option once established outdoors.`,ratingNote:`Good — thrives outdoors with little intervention, but indoor/tub cultivation is less predictable than the other species here.`},buttonAgaricus:{name:`Button / Portobello (Agaricus bisporus)`,description:`The supermarket mushroom — needs composted manure substrate topped with a casing layer of soil-like material to pin, unlike the wood-lovers above.`,ratingNote:`Good — very rewarding once you have compost and casing technique down, but the most technically involved species to start from scratch at home.`},turkeyTail:{name:`Turkey Tail (Trametes versicolor)`,description:`A thin, colorful wood-decay polypore grown for its medicinal extract value rather than as a table mushroom — needs light to develop its banded, fan-shaped caps.`,ratingNote:`Very good — hardy and contamination-resistant on hardwood substrate, but slow and grown for one substantial flush rather than eaten fresh.`},chestnut:{name:`Chestnut Mushroom (Pholiota adiposa)`,description:`A clustering, nutty-flavored wood-lover with a firm texture that holds up well in cooking — less common than oyster or shiitake but similarly straightforward to grow.`,ratingNote:`Good — reliable clustering flushes on supplemented sawdust, though colonization is a bit slower than the oyster family.`},enoki:{name:`Enoki (Flammulina velutipes)`,description:`Grown cold, dark, and starved of fresh air to produce the long, pale, thin-stemmed clusters familiar from the supermarket — very different technique from most gourmet species.`,ratingNote:`Fair — biologically easy to colonize, but getting the classic long-stem look requires a cold fruiting chamber and a collar to force upward growth, which trips up beginners.`},cordyceps:{name:`Cordyceps militaris`,description:`An orange, club-shaped species fruited directly from a colonized grain or rice jar rather than a bulk substrate tub — prized for its supplement/nutraceutical use.`,ratingNote:`Fair — straightforward to colonize but needs a defined light cycle and cooler fruiting temperatures to trigger good color and fruit body density.`},maitake:{name:`Maitake / Hen of the Woods (Grifola frondosa)`,description:`A prized, richly flavored polypore that forms a single dense rosette of overlapping caps rather than distinct mushrooms — notoriously particular about fruiting conditions.`,ratingNote:`Fair — very rewarding when it works, but pinning is inconsistent and often benefits from a soil/casing contact layer that other species here don't need.`},morel:{name:`Morel (Morchella spp.)`,description:`A prized wild-style species with a honeycombed cap, normally grown outdoors in nutrient-bag beds rather than indoor tubs — among the hardest mushrooms to fruit reliably at home.`,ratingNote:`Poor for beginners — even experienced growers see inconsistent, low pinning rates; treat any harvest as a bonus rather than a guarantee.`}},culinaryRecipes:{oyster:{sauteed:{name:`Garlic Butter Sautéed Oysters`,description:`The simplest way to showcase oyster mushrooms — high heat, butter, garlic.`,ingredients:[`250 g oyster mushrooms, torn into strips`,`2 tbsp butter`,`2 cloves garlic, minced`,`Salt and black pepper`,`Fresh parsley, chopped (optional)`],steps:[`Tear mushrooms along the grain into bite-sized strips.`,`Heat a dry pan over medium-high heat and cook the mushrooms without butter first, to drive off moisture, about 3–4 minutes.`,`Add butter and garlic and sauté for another 3–4 minutes until golden at the edges.`,`Season with salt and pepper, top with parsley, and serve immediately.`],benefits:[`Low in calories and naturally low in fat before the butter is added`,`Good source of B vitamins and potassium`,`Contains dietary fiber, including beta-glucans`]},soup:{name:`Creamy Oyster Mushroom Soup`,description:`A comforting blended soup that turns a big oyster flush into a warming meal.`,ingredients:[`400 g oyster mushrooms, roughly chopped`,`1 onion, diced`,`2 cloves garlic, minced`,`500 ml vegetable or chicken stock`,`150 ml cream`,`2 tbsp butter`,`Salt and pepper`],steps:[`Melt butter in a pot and sauté onion and garlic until soft, about 5 minutes.`,`Add mushrooms and cook until they release their liquid and start to brown, 8–10 minutes.`,`Pour in stock, bring to a simmer, and cook for 10 minutes.`,`Blend until smooth (or leave chunky), stir in cream, and season to taste.`,`Reheat gently without boiling and serve hot.`],benefits:[`Warming, high-volume meal that is naturally cholesterol-free`,`Good source of B vitamins from the mushrooms`,`Onion and garlic add allium compounds`]}},pinkOyster:{crispy:{name:`Crispy Pan-Fried Pink Oyster Strips`,description:`High heat crisps the thin petals of pink oyster into a smoky, bacon-like snack.`,ingredients:[`250 g pink oyster mushrooms, torn into strips`,`1 tbsp oil`,`1 tsp smoked paprika`,`1 tsp soy sauce`,`Pinch of salt`],steps:[`Tear mushrooms into thin strips along their natural ridges.`,`Toss with oil, smoked paprika, and soy sauce.`,`Fry in a hot pan in a single layer, without crowding, until crisp and browned on both sides, 6–8 minutes total.`,`Drain briefly on paper towel, salt lightly, and serve hot.`],benefits:[`Naturally low in fat before frying`,`Good source of potassium and B vitamins`,`A plant-based, lower-fat alternative to bacon in a meal`]},tacos:{name:`Pink Oyster Mushroom Tacos`,description:`The pink color fades on cooking, but the meaty pulled texture makes great taco filling.`,ingredients:[`300 g pink oyster mushrooms, shredded by hand`,`1 tbsp oil`,`1 tsp cumin`,`1 tsp chili powder`,`Juice of 1 lime`,`Small tortillas`,`Toppings: diced onion, cilantro, salsa`],steps:[`Shred mushrooms by hand into rough pulled-pork-sized pieces.`,`Sear in hot oil until well browned, about 8 minutes, stirring occasionally.`,`Add cumin and chili powder, cook 1 minute more, then toss with lime juice.`,`Warm the tortillas, fill with the mushroom mixture, and add toppings.`],benefits:[`High-fiber meal thanks to the mushrooms and toppings`,`Good plant-based protein contribution from the mushrooms`,`Lime adds vitamin C`]}},kingOyster:{scallops:{name:`Pan-Seared King Oyster "Scallops"`,description:`Thick king oyster stems slice into rounds that sear just like scallops.`,ingredients:[`2 large king oyster stems`,`1 tbsp butter`,`1 tbsp oil`,`1 clove garlic`,`Salt and pepper`,`Lemon wedge`],steps:[`Slice stems into 2 cm thick rounds; score a shallow crosshatch on each cut face.`,`Pat dry and season with salt and pepper.`,`Sear in hot oil for 3–4 minutes per side until deeply golden.`,`Add butter and garlic in the last minute and baste.`,`Finish with a squeeze of lemon and serve.`],benefits:[`Firm texture provides satiety with relatively few calories`,`Contains potassium and B vitamins`,`Naturally low in sugar`]},skewers:{name:`Grilled King Oyster Skewers`,description:`A soy-ginger glaze caramelizes nicely on the firm, meaty stems over direct heat.`,ingredients:[`3 king oyster mushrooms, cut into thick chunks`,`2 tbsp soy sauce`,`1 tbsp honey`,`1 tsp grated ginger`,`1 tsp sesame oil`,`Skewers`],steps:[`Whisk soy sauce, honey, ginger, and sesame oil into a glaze.`,`Cut mushrooms into thick chunks and toss in half the glaze; let sit 10 minutes.`,`Thread onto skewers and grill or pan-sear over medium-high heat, turning often, 8–10 minutes.`,`Brush with the remaining glaze during the last 2 minutes and serve.`],benefits:[`Grilling instead of frying keeps added fat modest`,`Ginger and garlic contribute antioxidant plant compounds`,`Good source of B vitamins from the mushrooms`]}},lionsMane:{sauteed:{name:`Butter-Seared Lion's Mane Steaks`,description:`Thick slabs sear up with a seafood-like texture — the classic first lion's mane dish.`,ingredients:[`1 lion's mane, sliced into 2 cm thick "steaks"`,`2 tbsp butter`,`1 clove garlic, smashed`,`Salt and pepper`,`Lemon wedge`],steps:[`Slice the whole cluster into thick steaks.`,`Press between paper towels to remove excess moisture.`,`Sear in butter over medium-high heat, 3–4 minutes per side, until golden and crisp-edged.`,`Add garlic in the last minute, season, and finish with lemon.`],benefits:[`Low in carbohydrates`,`Contains B vitamins and minerals like potassium`,`Naturally cholesterol-free`]},crabcakes:{name:`Lion's Mane "Crab" Cakes`,description:`Shredded and pan-fried, lion's mane's texture stands in well for crab in a pan-fried cake.`,ingredients:[`300 g lion's mane, shredded by hand`,`1 egg`,`40 g breadcrumbs`,`1 tbsp mayonnaise`,`1 tsp Old Bay or paprika`,`Oil for frying`],steps:[`Sauté shredded lion's mane in a dry pan until moisture is released and cooked off, then let cool.`,`Mix with egg, breadcrumbs, mayonnaise, and seasoning until it holds together.`,`Shape into patties and chill 15 minutes.`,`Pan-fry in oil over medium heat, 3–4 minutes per side, until golden.`],benefits:[`Good plant-based protein contribution from the egg and mushroom`,`Lower in saturated fat than traditional crab cakes`,`Contains B vitamins from the mushrooms`]}},shiitake:{stirfry:{name:`Garlic Soy Shiitake Stir-Fry`,description:`Fresh shiitake caps stir-fried hot and fast with a simple garlic-soy glaze.`,ingredients:[`250 g shiitake caps, sliced`,`1 tbsp oil`,`2 cloves garlic, sliced`,`1 tbsp soy sauce`,`1 tsp sesame oil`,`Spring onion, sliced`],steps:[`Slice caps and stir-fry in hot oil until browned, about 5 minutes.`,`Add garlic and cook 30 seconds until fragrant.`,`Stir in soy sauce and sesame oil, and toss to coat.`,`Top with spring onion and serve.`],benefits:[`Good source of B vitamins, especially riboflavin and niacin`,`Contains dietary fiber and beta-glucans`,`Naturally low in fat`]},dashi:{name:`Shiitake Dashi Broth & Simmered Caps`,description:`Dried or fresh shiitake makes a deeply savory broth, with the softened caps served alongside.`,ingredients:[`8 dried shiitake (or 200 g fresh), soaked if dried`,`1 L water`,`1 piece kombu (optional)`,`2 tbsp soy sauce`,`1 tbsp mirin`],steps:[`Soak dried shiitake in the water for at least 30 minutes (skip if using fresh).`,`Simmer mushrooms and kombu gently for 20 minutes; remove kombu before it boils.`,`Remove caps, slice, and set aside.`,`Season the broth with soy sauce and mirin, return the sliced caps, and simmer 5 more minutes.`],benefits:[`Very low in fat and calories`,`Umami-rich broth needs less added salt for flavor`,`Shiitake contribute B vitamins and minerals`]}},reishi:{tea:{name:`Reishi Decoction Tea`,description:`Reishi is too woody to eat, so it's simmered low and slow to draw out its bitter compounds into a tea.`,ingredients:[`5–10 g dried reishi slices`,`500 ml water`,`Honey or lemon to taste (optional)`],steps:[`Add reishi slices to water in a small pot.`,`Bring to a boil, then reduce to a low simmer, covered, for 60–90 minutes.`,`Strain out the slices (they can be simmered a second time for a lighter batch).`,`Sweeten to taste and serve hot.`],benefits:[`Essentially calorie-free unless sweetened`,`Caffeine-free hot drink`,`A traditional wellness beverage — not a substitute for medical treatment`]},tincture:{name:`Basic Dual-Extraction Reishi Tincture`,description:`A longer hobbyist project combining an alcohol soak with a water decoction to pull more compounds from the woody fruit body.`,ingredients:[`30 g dried reishi, chopped small`,`200 ml vodka or other neutral spirit`,`200 ml water`],steps:[`Combine reishi and vodka in a sealed jar; store in a dark place, shaking daily, for 2–4 weeks.`,`Strain and reserve the alcohol extract; keep the soaked reishi pieces.`,`Simmer the soaked reishi in the water for 60–90 minutes to make a decoction, then strain and reduce slightly.`,`Combine the alcohol extract and reduced decoction, and bottle. Store in a cool, dark place.`],benefits:[`Low in calories per typical dose`,`A traditional hobbyist preparation, not a medical treatment`,`Best enjoyed in small, measured amounts`]}},wineCap:{sauteed:{name:`Butter-Garlic Sautéed Wine Caps`,description:`A straightforward sauté that suits wine cap's firm, nutty flesh.`,ingredients:[`250 g wine cap mushrooms, sliced`,`2 tbsp butter`,`2 cloves garlic, minced`,`Splash of white wine or stock (optional)`,`Salt and pepper`],steps:[`Slice mushrooms and sauté in butter over medium-high heat until browned, 6–8 minutes.`,`Add garlic and cook 1 minute more.`,`Deglaze with a splash of wine or stock if using, and let it bubble off.`,`Season and serve.`],benefits:[`Firm texture with modest calories`,`Contains B vitamins and potassium`,`Naturally low in sugar`]},risotto:{name:`Wine Cap Mushroom Risotto`,description:`The dense texture of wine cap holds up well through the long, slow stirring risotto needs.`,ingredients:[`250 g wine cap mushrooms, sliced`,`200 g risotto rice`,`1 onion, diced`,`750 ml warm stock`,`100 ml white wine`,`40 g parmesan`,`2 tbsp butter`],steps:[`Sauté mushrooms in half the butter until browned; set aside.`,`In the same pot, sauté onion in the remaining butter until soft, then add rice and toast 1 minute.`,`Add wine and stir until absorbed, then add warm stock a ladle at a time, stirring, until the rice is creamy and just tender, about 20 minutes.`,`Stir in the mushrooms and parmesan, and serve immediately.`],benefits:[`Rice provides sustained energy from complex carbohydrates`,`Mushrooms add B vitamins and fiber to the dish`,`A filling, meat-free main course`]}},buttonAgaricus:{grilled:{name:`Garlic-Stuffed Grilled Button Caps`,description:`A simple grilled starter that works with either button or larger portobello-stage caps.`,ingredients:[`8 button mushroom caps, stems removed`,`2 tbsp butter, softened`,`1 clove garlic, minced`,`Fresh parsley, chopped`,`Salt and pepper`],steps:[`Mix softened butter with garlic and parsley.`,`Fill each cap with a small dab of the butter mixture.`,`Grill or bake at 200 °C until tender and the butter has melted in, about 12–15 minutes.`,`Season and serve warm.`],benefits:[`Low in calories and carbohydrates`,`Contains selenium and B vitamins`,`A simple starter that stays low-sodium if salt is used sparingly`]},soup:{name:`Classic Cream of Mushroom Soup`,description:`The familiar deli-style soup, made from scratch with fresh button mushrooms.`,ingredients:[`400 g button mushrooms, sliced`,`1 onion, diced`,`2 tbsp butter`,`2 tbsp flour`,`600 ml stock`,`150 ml cream`,`Salt and pepper`],steps:[`Sauté onion in butter until soft, then add mushrooms and cook until browned, 8 minutes.`,`Stir in flour and cook 1 minute to remove the raw taste.`,`Gradually whisk in stock, bring to a simmer, and cook 10 minutes.`,`Stir in cream, season, and blend partially or fully for the desired texture.`],benefits:[`Classic comfort food that also carries the mushrooms' B vitamins`,`Good source of potassium`,`Can be made lighter by reducing the amount of cream`]}},turkeyTail:{tea:{name:`Turkey Tail Decoction Tea`,description:`Turkey tail is thin but tough and leathery, so it's simmered rather than eaten as a dish.`,ingredients:[`5–8 g dried turkey tail, broken into pieces`,`500 ml water`,`Honey or lemon to taste (optional)`],steps:[`Add turkey tail pieces to water in a small pot.`,`Bring to a boil, then simmer covered for 45–60 minutes.`,`Strain, sweeten to taste, and serve hot.`],benefits:[`Essentially calorie-free unless sweetened`,`Caffeine-free hot drink`,`A traditional preparation, not a medical treatment`]},broth:{name:`Turkey Tail Mushroom Broth`,description:`A long, mostly hands-off simmer turns turkey tail and aromatics into a savory sipping broth or soup base.`,ingredients:[`20 g dried turkey tail`,`2 L water`,`1 onion, halved`,`2 carrots, chopped`,`2 cloves garlic`,`Salt to taste`],steps:[`Combine all ingredients in a large pot.`,`Bring to a boil, then reduce to a gentle simmer, partly covered, for 2.5–3 hours.`,`Strain out the solids.`,`Season with salt and use as a broth or soup base.`],benefits:[`Low in fat and calories per serving`,`Vegetables add fiber and vitamin A`,`A traditional, mostly hands-off preparation`]}},chestnut:{sauteed:{name:`Soy-Butter Sautéed Chestnut Mushrooms`,description:`Chestnut mushroom's firm, nutty clusters hold their shape well in a quick sauté.`,ingredients:[`250 g chestnut mushrooms, trimmed and separated`,`2 tbsp butter`,`1 tbsp soy sauce`,`1 clove garlic, minced`,`Black pepper`],steps:[`Trim the base and separate the cluster into smaller pieces.`,`Sauté in butter over medium-high heat until browned, 6–8 minutes.`,`Add garlic and soy sauce, and toss for 1 more minute.`,`Finish with black pepper and serve.`],benefits:[`Firm mushroom clusters are low in fat before cooking`,`Contain B vitamins and potassium`,`Naturally low in sugar`]},noodles:{name:`Chestnut Mushroom Noodle Stir-Fry`,description:`A quick weeknight noodle dish built around the mushroom's clustered texture.`,ingredients:[`250 g chestnut mushrooms, separated`,`200 g noodles, cooked`,`1 tbsp oil`,`2 tbsp soy sauce`,`1 tsp sesame oil`,`Spring onion and sesame seeds to garnish`],steps:[`Cook noodles according to package instructions and set aside.`,`Stir-fry mushrooms in hot oil until browned, about 6 minutes.`,`Add cooked noodles, soy sauce, and sesame oil, and toss until combined and heated through.`,`Garnish with spring onion and sesame seeds.`],benefits:[`Provides sustained energy from the noodles' carbohydrates`,`Mushrooms contribute B vitamins and fiber`,`A quick, filling one-bowl meal`]}},enoki:{soup:{name:`Enoki Miso Soup`,description:`Delicate enoki bundles are a natural, quick addition to a light miso broth.`,ingredients:[`150 g enoki mushrooms, base trimmed`,`600 ml dashi or stock`,`2 tbsp miso paste`,`1 spring onion, sliced`,`Tofu cubes (optional)`],steps:[`Trim the woody base from the enoki cluster and separate into smaller bunches.`,`Bring dashi or stock to a gentle simmer.`,`Dissolve miso paste into a ladle of the hot broth, then stir it back into the pot (don't boil after adding miso).`,`Add enoki and tofu, warm through for 1–2 minutes, and top with spring onion.`],benefits:[`Light, low-calorie soup`,`Miso adds fermented soy protein`,`Enoki contribute fiber and B vitamins`]},baconWrap:{name:`Bacon-Wrapped Enoki Bundles`,description:`A popular pan-fried appetizer — enoki's long strands crisp up nicely inside a bacon wrap.`,ingredients:[`150 g enoki mushrooms, base trimmed`,`6 strips bacon`,`2 tbsp soy sauce`,`1 tbsp honey`,`1 tsp toasted sesame seeds`],steps:[`Trim the enoki base and divide into small bundles about the width of a bacon strip.`,`Wrap each bundle tightly with a strip of bacon.`,`Pan-fry seam-side down over medium heat until the bacon is crisp, turning to cook all sides, about 8 minutes.`,`Add soy sauce and honey to the pan in the last minute to glaze, and sprinkle with sesame seeds.`],benefits:[`A protein-rich appetizer from the bacon and mushrooms`,`Enoki add fiber to help balance the richness of the bacon`,`Best enjoyed as an occasional treat given the bacon content`]}},cordyceps:{tea:{name:`Cordyceps Ginger Tea`,description:`A quick steeped tea that suits cordyceps' delicate, thin fruit bodies.`,ingredients:[`3–5 g dried cordyceps`,`2–3 slices fresh ginger`,`400 ml water`,`Honey to taste (optional)`],steps:[`Add cordyceps and ginger to water in a small pot.`,`Bring to a boil, then simmer gently for 10–15 minutes.`,`Strain, sweeten to taste, and serve hot.`],benefits:[`Essentially calorie-free unless sweetened`,`Ginger adds warming, digestive-friendly flavor`,`A traditional wellness beverage, not a medical treatment`]},soup:{name:`Cordyceps Mushroom Soup`,description:`A mild savory soup styled after traditional cordyceps-and-meat or vegetable broths.`,ingredients:[`10 g dried cordyceps (or a handful fresh)`,`1 L chicken or vegetable stock`,`100 g sliced chicken or tofu`,`2 slices ginger`,`Salt to taste`],steps:[`Rinse cordyceps briefly if using dried.`,`Bring stock to a simmer with the ginger and cordyceps, and cook 15 minutes.`,`Add chicken or tofu, and simmer until cooked through, about 10 minutes more.`,`Season with salt and serve hot.`],benefits:[`High-protein soup from the chicken or tofu`,`Low in fat if made with lean chicken or tofu`,`Ginger adds warming flavor`]}},maitake:{roasted:{name:`Roasted Maitake "Steaks"`,description:`Roasting whole clusters in the oven crisps the frilly edges while keeping the base tender.`,ingredients:[`1 maitake cluster, left mostly whole or torn into large pieces`,`2 tbsp oil`,`1 clove garlic, minced`,`Salt and pepper`,`Fresh thyme (optional)`],steps:[`Preheat oven to 220 °C.`,`Tear the cluster into a few large pieces and toss with oil, garlic, salt, and pepper.`,`Roast on a tray, cut-side down, for 15–20 minutes until crisp at the edges.`,`Finish with fresh thyme if using, and serve.`],benefits:[`Low in calories and carbohydrates`,`Good source of B vitamins and potassium`,`Naturally cholesterol-free`]},tempura:{name:`Maitake Tempura`,description:`The frilly, layered clusters have lots of surface area, which crisps beautifully when battered and fried.`,ingredients:[`200 g maitake, torn into clusters`,`80 g flour`,`1 egg`,`120 ml cold water`,`Oil for frying`,`Salt or dipping sauce`],steps:[`Heat oil to about 180 °C in a deep pan.`,`Whisk flour, egg, and cold water into a light, slightly lumpy batter.`,`Dip mushroom clusters in the batter and fry in batches until light golden, 2–3 minutes.`,`Drain on paper towel and serve immediately with salt or dipping sauce.`],benefits:[`A rare treat — battered and fried, so higher in fat than most mushroom dishes here`,`Maitake still contributes B vitamins and fiber`,`Best enjoyed occasionally rather than as an everyday dish`]}},morel:{sauteed:{name:`Classic Butter-Sautéed Morels`,description:`A simple preparation that lets morels' honeycombed texture shine — always cook morels thoroughly, never eat them raw or undercooked.`,ingredients:[`200 g fresh morels, halved lengthwise and rinsed well`,`2 tbsp butter`,`1 small shallot, minced`,`Salt and pepper`,`Fresh chives (optional)`],steps:[`Halve morels lengthwise and rinse thoroughly to remove any grit from the honeycombed cap.`,`Sauté shallot in butter over medium heat until soft.`,`Add morels and cook, stirring often, for 8–10 minutes until fully tender — morels must be cooked through, not just browned on the surface.`,`Season with salt and pepper, and finish with chives.`],benefits:[`Low in calories relative to its rich flavor`,`Good source of B vitamins and iron`,`Naturally low in sugar`]},creamsauce:{name:`Morels in Cream Sauce`,description:`A classic spring preparation — a rich cream sauce with thoroughly cooked morels, served over toast.`,ingredients:[`250 g fresh morels, halved and rinsed well`,`2 tbsp butter`,`1 shallot, minced`,`100 ml white wine`,`150 ml cream`,`Salt and pepper`,`Toast, to serve`],steps:[`Rinse morels thoroughly and halve lengthwise.`,`Sauté shallot in butter until soft, then add morels and cook for 8–10 minutes until fully tender.`,`Add wine and simmer until reduced by half.`,`Stir in cream, simmer 3–4 minutes to thicken slightly, season, and serve over toast.`],benefits:[`A richer preparation — higher in fat from the cream and butter`,`Morels contribute B vitamins and iron`,`Best enjoyed as an occasional seasonal treat`]}}}},sk:{ui:{pageTitle:`🍄 Kalkulačky pre pestovanie húb`,pageSubtitle:`Metrické kalkulačky receptov pre domáce pestovanie húb.`,langLabel:`Jazyk`,unitLabel:`Jednotky`,themeLabel:`Vzhľad`,themeAuto:`Automaticky`,themeLight:`Svetlý`,themeDark:`Tmavý`,copyBtn:`Kopírovať ako text`,copiedBtn:`Skopírované!`,tabSubstrate:`Kalkulačka substrátu`,tabLc:`Kalkulačka tekutej kultúry`,tabAgar:`Agarové platne`,substrateLabel:`Cieľový substrát`,spawnLabel:`Množstvo zrnného osiva (ml)`,spawnTip:`Tip: 1 l osídleného zrnného osiva váži približne 700 – 800 g.`,calcBtn:`Vypočítať recept`,subIngredientsHeader:`Ingrediencie`,ingCol:`Ingrediencia`,volCol:`Objem`,wtCol:`Hmotnosť`,subTotalLabel:`Celkový substrát`,substrateFootnote:`Hmotnosti sú orientačné — skutočná hustota závisí od vlhkosti a značky materiálu. Vodu pridávajte postupne a vlhkosť kontrolujte hmatom (skúška stlačením: uvoľní sa pár kvapiek, žiadny súvislý prúd).`,stepsHeader:`Postup prípravy`,lcLabel:`Recept tekutej kultúry`,jarVolLabel:`Tekutina na pohár (ml)`,jarCountLabel:`Počet pohárov`,jarNote:`Poháre naplňte do cca 70 – 80 % objemu tekutinou, aby ostal priestor pre výmenu vzduchu a prístup striekačky.`,lcIngredientsHeader:`Ingrediencie (spolu pre všetky poháre)`,lcTotalLabel:`Celková tekutina`,lcFootnote:`Koncentrácie sú orientačné hodnoty živín % (w/v) bežne používané pre tekutú kultúru húb. Prispôsobte podľa skúseností — príliš koncentrovaný roztok môže spomaliť rast mycélia.`,jarsWord:`nádob`,agarLabel:`Agarový recept`,plateVolLabel:`Médium na platňu (ml)`,plateCountLabel:`Počet platní`,agarNote:`Štandardná Petriho miska s priemerom 90 mm potrebuje približne 20 – 25 ml média. Automaticky je pripočítaných 10 % navyše na straty pri liatí.`,agarIngredientsHeader:`Ingrediencie (spolu, vrát. 10 % straty pri liatí)`,agarTotalLabel:`Celkové médium`,agarFootnote:`Koncentrácia agaru je ~2 % (20 g/l), štandardná tuhosť pre prácu s kultúrami húb. Koncentrácie živín sú orientačné — prispôsobte podľa skúseností.`,platesWord:`platní`,tabGrain:`Zrnné osivo`,grainLabel:`Druh obilia`,grainJarVolLabel:`Hydratované zrno na pohár (ml)`,grainNote:`Poháre naplňte hydratovaným zrnom asi do 60 – 65 % objemu, aby ostal priestor na pretrepanie a výmenu vzduchu.`,grainIngredientsHeader:`Ingrediencie (spolu pre všetky poháre)`,grainTotalLabel:`Celkové hydratované zrno`,grainFootnote:`Hmotnosti sú orientačné — hustota suchého zrna a nasiakavosť sa líšia podľa odrody a šarže. Zrno dôkladne scedťe; príliš mokré poháre sú najčastejšou príčinou kyslej/bakteriálnej kontaminácie.`,tabSpecies:`Sprievodca druhmi`,speciesLabel:`Druh`,colonizeHeader:`Kolonizácia`,fruitingHeader:`Plodenie`,colonizeTempLabel:`Teplota`,fruitTempLabel:`Teplota`,fruitHumidityLabel:`Vlhkosť`,faeLabel:`Výmena vzduchu (FAE)`,lightLabel:`Svetlo`,daysToPinLabel:`Dní do tvorby zárodkov`,flushIntervalLabel:`Dní medzi vlnami úrody`,numFlushesLabel:`Bežný počet vĺn`,recommendedSubstratesLabel:`Vhodné substráty`,recommendedGrainsLabel:`Vhodné zrnné osivo`,faeLow:`Nízka`,faeMedium:`Stredná`,faeHigh:`Vysoká`,lightNone:`Nie je potrebné`,lightLow:`Nízke, nepriame`,lightMedium:`Stredné, nepriame`,daysUnit:`dní`,tabYield:`Odhad výnosu`,yieldSpeciesLabel:`Druh`,yieldSubstrateLabel:`Použitý substrát`,yieldWeightLabel:`Hmotnosť pripraveného (mokrého) substrátu`,yieldResultLabel:`Odhadovaný celkový čerstvý výnos`,yieldPerFlushLabel:`Približne na jednu vlnu`,yieldDisclaimer:`Iba orientačný odhad na plánovanie, založený na typických hodnotách domácich pestovateľov. Skutočný výnos výrazne závisí od genetiky, techniky, kontaminácie a prostredia — berte to ako hrubý odhad, nie sľub.`,tabDrying:`Pomocník so sušením`,dryingSpeciesLabel:`Druh`,dryingThicknessLabel:`Hrúbka plátkov`,dryingThicknessThin:`Tenké (≤ 5 mm)`,dryingThicknessMedium:`Stredné (5 – 10 mm)`,dryingThicknessThick:`Hrubé / celé malé klobúky (> 10 mm)`,dryingTempResultLabel:`Teplota sušičky`,dryingTimeResultLabel:`Typický čas sušenia`,dryingFootnote:`Časy sa výrazne líšia podľa prúdenia vzduchu, vlhkosti a hustoty naukladania klobúkov. Sušte, kým sa kúsky čisto nezlomia namiesto ohnutia — to je dôležitejšie než hodiny na hodinkách.`,tabConditions:`Kontrola plodenia`,conditionsSpeciesLabel:`Druh`,conditionsTempLabel:`Aktuálna teplota v miestnosti (°C)`,conditionsHumidityLabel:`Aktuálna vlhkosť (% RH)`,conditionsFaeLabel:`Vaša výmena vzduchu`,conditionsLightLabel:`Vaše osvetlenie`,conditionsFaeLowOpt:`1× denne alebo menej (stan väčšinou zatvorený)`,conditionsFaeMediumOpt:`2 – 4× denne vetranie, alebo malé otvory FAE`,conditionsFaeHighOpt:`Nepretržitý ventilátor, veľké otvory alebo otvorená polica`,conditionsLightNoneOpt:`Tma / žiadne svetlo`,conditionsLightLowOpt:`Slabé nepriame svetlo, pár hodín denne`,conditionsLightMediumOpt:`Jasné nepriame svetlo väčšinu dňa`,conditionsTempResultLabel:`Teplota`,conditionsHumidityResultLabel:`Vlhkosť`,conditionsFaeResultLabel:`Výmena vzduchu`,conditionsLightResultLabel:`Svetlo`,conditionsTargetPrefix:`Cieľ`,conditionsStatusOk:`V poriadku`,conditionsStatusTooCold:`Príliš chladno`,conditionsStatusTooWarm:`Príliš teplo`,conditionsStatusTooDry:`Príliš sucho`,conditionsStatusTooHumid:`Príliš vlhko`,conditionsStatusLowFae:`Zvýšte prúdenie vzduchu`,conditionsStatusLowLight:`Pridajte trochu svetla`,conditionsOverallGood:`Podmienky vyzerajú dobre — mali by ste dostať čisté, zdravé zárodky.`,conditionsOverallIssues:`Jedna alebo viac podmienok potrebuje úpravu, aby tvorba zárodkov prebehla dobre.`,conditionsDisclaimer:`Orientačný návod založený na typických hodnotách domácich pestovateľov, nie laboratórne meranie. Malé odchýlky na krátky čas sú normálne — reagujte na trend, nie na jedno meranie.`,conditionsOptimalTitle:`Optimálne nastavenia pre`,conditionsOptimalTempPill:`Teplota`,conditionsOptimalHumidityPill:`Vlhkosť`,conditionsFaeLevelLow:`Nízka`,conditionsFaeLevelMedium:`Stredná`,conditionsFaeLevelHigh:`Vysoká`,conditionsLightLevelNone:`Žiadne`,conditionsLightLevelLow:`Nízke`,conditionsLightLevelMedium:`Stredné`,tabRecipes:`Recepty`,recipesSpeciesLabel:`Druh`,recipeDifficultyEasy:`Ľahké`,recipeDifficultyMedium:`Stredne náročné`,recipeDifficultyAdvanced:`Náročné`,recipeTimeUnit:`min`,recipeServingsLabel:`Porcie`,recipeIngredientsHeader:`Suroviny`,recipeStepsHeader:`Postup`,recipeNutritionHeader:`Nutričné hodnoty (na porciu, približne)`,recipeKcalLabel:`Energia`,recipeKcalUnit:`kcal`,recipeProteinLabel:`Bielkoviny`,recipeCarbsLabel:`Sacharidy`,recipeFatLabel:`Tuky`,recipeFiberLabel:`Vláknina`,recipeBenefitsHeader:`Prečo je to pre vás dobré`,recipesFootnote:`Huby dôkladne tepelne upravte — viaceré druhy (najmä smrže) sú surové alebo nedovarené nebezpečné. Ide o všeobecné východiskové recepty — koreninu a čas prispôsobte podľa chuti. Nutričné hodnoty sú hrubé odhady, nie laboratórna analýza, a poznámky o prínosoch sú všeobecné výživové informácie, nie lekárske odporúčanie.`},substrates:{cvg:{name:`C
