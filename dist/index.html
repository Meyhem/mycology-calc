etric recipe calculators for home mushroom cultivation.`,langLabel:`Language`,unitLabel:`Units`,themeLabel:`Theme`,themeAuto:`Auto`,themeLight:`Light`,themeDark:`Dark`,copyBtn:`Copy as text`,copiedBtn:`Copied!`,tabSubstrate:`Substrate Calculator`,tabLc:`Liquid Culture Calculator`,tabAgar:`Agar Plates`,substrateLabel:`Target substrate`,spawnLabel:`Grain spawn amount (mL)`,spawnTip:`Tip: 1 L of colonized grain spawn weighs roughly 700–800 g.`,calcBtn:`Calculate recipe`,subIngredientsHeader:`Ingredients`,ingCol:`Ingredient`,volCol:`Volume`,wtCol:`Weight`,subTotalLabel:`Total substrate`,substrateFootnote:`Weights are approximate — actual density varies by moisture content and material brand. Adjust water gradually and check hydration by feel (squeeze test: a few drops of water, no dripping stream).`,stepsHeader:`Preparation steps`,lcLabel:`Liquid culture recipe`,jarVolLabel:`Liquid per jar (mL)`,jarCountLabel:`Number of jars`,jarNote:`Fill jars to about 70–80% of their total volume with liquid, leaving headspace for gas exchange and syringe access.`,lcIngredientsHeader:`Ingredients (total for all jars)`,lcTotalLabel:`Total liquid`,lcFootnote:`Concentrations are approximate nutrient % (w/v) commonly used for mushroom liquid culture. Adjust to taste/experience — too concentrated can slow mycelium growth.`,jarsWord:`jars`,agarLabel:`Agar recipe`,plateVolLabel:`Media per plate (mL)`,plateCountLabel:`Number of plates`,agarNote:`A standard 90 mm petri dish takes about 20–25 mL of media. A 10% extra batch volume is included automatically to cover pouring loss.`,agarIngredientsHeader:`Ingredients (total, incl. 10% pour loss)`,agarTotalLabel:`Total media`,agarFootnote:`Agar concentration is ~2% (20 g/L), the standard firmness for mushroom culture work. Nutrient concentrations are approximate — adjust to taste/experience.`,platesWord:`plates`,tabGrain:`Grain Spawn`,grainLabel:`Grain type`,grainJarVolLabel:`Hydrated grain per jar (mL)`,grainNote:`Fill jars to about 60–65% of their volume with hydrated grain, leaving headspace for shaking and gas exchange.`,grainIngredientsHeader:`Ingredients (total for all jars)`,grainTotalLabel:`Total hydrated grain`,grainFootnote:`Weights are approximate — dry grain density and water uptake vary by variety and batch. Drain thoroughly; jars that are too wet are the most common cause of sour/bacterial contamination.`,tabSpecies:`Species Guide`,speciesLabel:`Species`,colonizeHeader:`Colonization`,fruitingHeader:`Fruiting`,colonizeTempLabel:`Temperature`,fruitTempLabel:`Temperature`,fruitHumidityLabel:`Humidity`,faeLabel:`Fresh air exchange`,lightLabel:`Light`,daysToPinLabel:`Days to pinning`,flushIntervalLabel:`Days between flushes`,numFlushesLabel:`Typical flushes`,recommendedSubstratesLabel:`Good substrates`,recommendedGrainsLabel:`Good grain spawn`,faeLow:`Low`,faeMedium:`Medium`,faeHigh:`High`,lightNone:`Not required`,lightLow:`Low, indirect`,lightMedium:`Moderate, indirect`,daysUnit:`days`,tabYield:`Yield Estimator`,yieldSpeciesLabel:`Species`,yieldSubstrateLabel:`Substrate used`,yieldWeightLabel:`Prepared (wet) substrate weight`,yieldResultLabel:`Estimated total fresh yield`,yieldPerFlushLabel:`Roughly per flush`,yieldDisclaimer:`Rough planning estimate only, based on typical reported ranges for home growers. Actual yield depends heavily on genetics, technique, contamination, and environment — treat this as a ballpark, not a promise.`,tabDrying:`Drying Helper`,dryingSpeciesLabel:`Species`,dryingThicknessLabel:`Slice thickness`,dryingThicknessThin:`Thin (≤ 5 mm)`,dryingThicknessMedium:`Medium (5–10 mm)`,dryingThicknessThick:`Thick / whole small caps (> 10 mm)`,dryingTempResultLabel:`Dehydrator temperature`,dryingTimeResultLabel:`Typical drying time`,dryingFootnote:`Times vary a lot with airflow, humidity, and how tightly caps are packed. Dry until pieces snap cleanly rather than bend — that matters more than the clock.`},substrates:{cvg:{name:`CVG — Coco Coir / Vermiculite / Gypsum`,description:`General-purpose bulk substrate for gourmet mushrooms (oyster, lion's mane, etc). Ratio ≈ 1 part spawn : 2 parts substrate by volume.`,ratingNote:`Excellent — the reliable gold standard: consistent colonization, strong yields, low contamination risk.`,ingredients:[`Coco coir brick (dry, compressed)`,`Water (to hydrate coir)`,`Vermiculite`,`Gypsum (calcium sulfate)`],steps:[`Break up the dry coco coir brick ({i0w}) into a large tub.`,`Pour in {i1v} of near-boiling water, cover, and let it sit 20–30 min until fully absorbed and cool to room temperature.`,`Fluff the hydrated coir with gloved hands to break up clumps.`,`Add {i2v} vermiculite and {i3w} gypsum. Mix thoroughly.`,`Check moisture with a squeeze test — a few drops should release, no steady stream. Add small amounts of water if too dry.`,`Break your grain spawn ({V}) apart and layer/mix it evenly through the substrate (roughly 1:2 spawn-to-substrate by volume).`,`Pack loosely into a grow bag/tub with filter patch or air holes, and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Coco coir/vermiculite mixes are low-nutrient, so they resist contamination reasonably well, but still work with clean hands/gloves and sanitized tools.`},masters:{name:`Master's Mix — Soy Hull + Hardwood Pellets`,description:`High-nutrient, high-yield substrate for gourmet mushrooms. Ratio ≈ 1 part spawn : 1 part substrate by volume.`,ratingNote:`Excellent — typically the highest yields of any common recipe, but demands full sterilization and clean technique.`,ingredients:[`Soy hull pellets (dry)`,`Hardwood pellets (dry)`,`Water (for soaking, excess drained)`],steps:[`Combine {i0w} soy hull pellets and {i1w} hardwood pellets in a bucket.`,`Cover with {i2v} of water and soak for 1–2 hours — pellets will swell and break apart into a sawdust-like texture.`,`Drain thoroughly in a colander/mesh bag until no water drips out (field capacity). This is your final hydrated substrate, about {V}.`,`Sterilize the hydrated substrate in bags/jars at 15 psi for 90 minutes (this mix is nutrient-rich and needs full sterilization, not just pasteurization).`,`Let cool completely, then break apart your grain spawn ({V}) and mix in thoroughly at roughly a 1:1 ratio in a still-air box or flow hood.`,`Seal and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Master's Mix is nutrient-dense, so it is more contamination-prone — full pressure sterilization and clean-air technique are strongly recommended.`},straw:{name:`Pasteurized Straw`,description:`Classic low-cost bulk substrate, typically for oyster mushrooms. Ratio ≈ 1 part spawn : 4 parts straw by volume.`,ratingNote:`Very good — fast colonization and cheap, but yields run lower than nutrient-supplemented mixes like CVG or Master's Mix.`,ingredients:[`Chopped wheat/barley straw (dry)`,`Water (for hot-water pasteurization bath)`],steps:[`Chop or shred the straw into 5–10 cm pieces — about {i0v} loosely packed ({i0w} dry).`,`Submerge the straw in a mesh bag in hot water at 60–70°C for 60–90 minutes to pasteurize (use roughly {i1v} water, enough to fully submerge).`,`Remove and drain/spin until excess water stops running out — straw should be moist but not dripping.`,`Let cool to room temperature, then break apart your grain spawn ({V}) and layer it between handfuls of straw in a grow bag (spawn-straw-spawn-straw...).`,`Poke or cut small air holes/slits in the bag, and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Straw only needs pasteurization (not full sterilization) since it's a low-nutrient substrate — hot water or steam pasteurization is sufficient with clean handling afterward.`},manure:{name:`Composted Manure Substrate`,description:`Rich substrate for button/portobello-type mushrooms. Ratio ≈ 1 part spawn : 6 parts composted substrate by volume.`,ratingNote:`Very good for manure-loving species (button, portobello); a poor fit for wood-loving species like oyster or shiitake.`,ingredients:[`Composted horse manure (moist, ready)`,`Gypsum`,`Water (to fine-tune moisture)`],steps:[`Start with well-composted, aged horse manure (no fresh/hot manure) — about {i0v} ({i0w}).`,`Mix in {i1w} gypsum to improve structure and reduce stickiness.`,`Adjust moisture with up to {i2v} water until the compost holds together when squeezed but doesn't drip.`,`Pasteurize the compost at 60–65°C for 1–2 hours (tray pasteurization or steam) to kill competitors while preserving beneficial microbes.`,`Let cool to room temperature, then break apart your grain spawn ({V}) and mix thoroughly into the compost at roughly a 1:6 ratio.`,`Fill trays or tubs, cover with a casing layer once colonized, and incubate at 21–24°C in the dark.`],hygiene:`Composted manure carries a natural microbial community — pasteurize (not sterilize) to keep the beneficial competitors alive while knocking back pathogens.`},coffee:{name:`Spent Coffee Grounds`,description:`Beginner-friendly recycled substrate for oyster mushrooms — the brewing process already pasteurizes the grounds. Ratio ≈ 1 part spawn : 2 parts grounds by volume.`,ratingNote:`Good, very low-effort and low-contamination beginner option, but modest yields — best used fresh and mixed with straw or coir for bulk.`,ingredients:[`Used (spent) coffee grounds, cooled`],steps:[`Collect {i0w} of freshly used coffee grounds (still warm from brewing counts as pasteurized) and let them cool to room temperature in a clean, covered container.`,`Break up any clumps — grounds should be crumbly, not compacted.`,`In a still-air box or clean area, break apart your grain spawn ({V}) and mix it thoroughly into the grounds at roughly a 1:2 ratio.`,`Pack loosely into a grow bag/tub with filter patch or air holes — don't compact, coffee grounds need airflow.`,`Incubate in the dark at 21–24°C until fully colonized. Use within a day or two of brewing for the lowest contamination risk.`],hygiene:`The heat of brewing (near 90°C+) plus coffee's natural acidity give this substrate solid built-in contamination resistance — just keep containers and hands clean and use grounds while still fresh.`},cardboard:{name:`Cardboard Substrate`,description:`Cheap, simple beginner substrate from shredded corrugated cardboard — good for practice runs and small oyster mushroom projects. Ratio ≈ 1 part spawn : 3 parts soaked cardboard by volume.`,ratingNote:`Fair — very cheap and easy to source, but low nutrient density means smaller, slower flushes than dedicated substrates. Good for learning, not for serious yields.`,ingredients:[`Shredded plain corrugated cardboard (dry, no ink/tape)`,`Water (for soaking/pasteurizing)`],steps:[`Remove all tape, labels, and glossy printed sections, then tear or shred {i0w} plain corrugated cardboard into strips.`,`Submerge in {i1v} hot water (60–70°C) for 60–90 minutes to pasteurize and soften.`,`Drain and gently squeeze out excess water until moist but not dripping.`,`Let cool to room temperature, then break apart your grain spawn ({V}) and layer it between strips of cardboard in a grow bag.`,`Poke small air holes in the bag, and incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Only use plain brown cardboard — printed ink and glossy coatings can inhibit growth or introduce contaminants. Pasteurization (not full sterilization) is sufficient for this low-nutrient substrate.`},sawdust:{name:`Sawdust Fruiting Block (Hardwood + Bran)`,description:`Traditional substrate for wood-loving species like shiitake, reishi, and lion's mane — hardwood sawdust supplemented with wheat bran. Ratio ≈ 1 part spawn : 4 parts substrate by volume.`,ratingNote:`Excellent for wood-loving species — slower colonization than grain-friendly recipes, but dense blocks give a long, productive fruiting life.`,ingredients:[`Hardwood sawdust (dry, non-resinous)`,`Wheat bran`,`Water (to hydrate)`],steps:[`Combine {i0w} hardwood sawdust (oak, maple, beech — avoid resinous softwoods) with {i1w} wheat bran in a large tub.`,`Gradually mix in {i2v} water until you reach field capacity (squeeze test: a few drops release, no steady stream).`,`Pack tightly into heat-tolerant bags or jars — sawdust blocks are dense, so pressure sterilize at 15 psi (121°C) for 2–2.5 hours (longer than looser substrates).`,`Let cool completely, then break apart your grain spawn ({V}) and mix in thoroughly at roughly a 1:4 ratio in a still-air box or flow hood.`,`Seal and incubate in the dark at 21–24°C until fully colonized — this substrate is denser and typically takes longer (3–5+ weeks) than grain-based substrates.`],hygiene:`The bran addition makes this substrate nutrient-rich and contamination-prone — full pressure sterilization with extended time is essential due to the density of packed sawdust.`}},lc:{lme:{name:`Light Malt Extract (LME) Syrup — 4%`,description:`The most common LC recipe. Gentle, reliable nutrient source for mycelium growth.`,ratingNote:`Excellent — the most widely used and reliable LC recipe, with consistent, vigorous growth.`,ingredients:[`Light malt extract (LME)`,`Distilled/RO water (to final volume)`],steps:[`Dissolve {i0w} light malt extract into about half of your water while gently heating and stirring until fully dissolved.`,`Top up with the remaining water to reach a total of {V}.`,`Distribute into jars, filling each to about 70–80% capacity. Fit lids with self-healing injection ports and micron filter for gas exchange.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes. Let cool fully to room temperature before handling.`,`In a still-air box or flow hood, inject spore solution or liquid culture (1–2 mL per jar) through the injection port with a sterile syringe.`,`Incubate at 21–27°C, swirling gently every day or two. Mycelium growth appears as fluffy white clouds within 3–10 days.`],hygiene:`Discard any jar that turns cloudy/discolored unevenly, smells sour or rotten, or shows colored (green/black/pink) spots — signs of contamination.`},honey:{name:`Honey Water — 4%`,description:`Simple pantry-ingredient alternative to malt extract, similar nutrient concentration.`,ratingNote:`Very good — easy pantry option with solid growth, though slightly more contamination-prone than LME.`,ingredients:[`Raw honey`,`Distilled/RO water (to final volume)`],steps:[`Warm about half your water and stir in {i0w} raw honey until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until you see fluffy white mycelium growth (3–10 days).`],hygiene:`Honey water can be slightly more contamination-prone than LME — always use raw (not heavily processed) honey and sterilize thoroughly.`},cornsyrup:{name:`Light Corn Syrup — 3%`,description:`Cheap, widely available alternative with a slightly lower nutrient concentration.`,ratingNote:`Very good — cheap, effective, and comparable in performance to honey water.`,ingredients:[`Light corn syrup`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} light corn syrup into warm water until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Discard any jar showing uneven cloudiness, odd colors, or bad smell — signs of bacterial or mold contamination.`},dextrose:{name:`Dextrose Syrup — 4%`,description:`Pure simple-sugar LC using dextrose (glucose) powder — very consistent, no boiling required to dissolve.`,ratingNote:`Very good — highly consistent since it's a pure sugar, though mycelium can grow slightly thinner than on malt-based recipes.`,ingredients:[`Dextrose (glucose) powder`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} dextrose powder into warm water until fully dissolved (dissolves easily, no heavy heating needed).`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Dextrose solution is very clean-tasting to mycelium but also to contaminants — sterilize thoroughly and inoculate with clean technique.`},potatodextrose:{name:`Potato Dextrose Liquid — 20% potato / 2% dextrose`,description:`Closer to PDA nutrient profile; a good option if you already work with potato-based media.`,ratingNote:`Very good — matches PDA's nutrient profile closely, giving vigorous growth, though more prep work than sugar syrups.`,ingredients:[`Peeled potato (diced)`,`Dextrose (glucose)`,`Water (for boiling + topping to volume)`],steps:[`Peel and dice {i0w} potato, then boil in most of the water for 20–30 minutes until soft.`,`Strain out the potato solids, keeping only the infusion liquid. Dissolve in {i1w} dextrose while still warm.`,`Top up with water to reach {V} total volume.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood, then incubate at 21–27°C until fluffy white growth appears (3–10 days).`],hygiene:`Potato-based liquids are nutrient-rich and more contamination-prone — sterilize thoroughly and keep injection technique very clean.`},brownsugar:{name:`Brown Sugar Syrup — 4%`,description:`Budget pantry-ingredient LC using brown sugar — a step down from LME in refinement but very cheap and effective.`,ratingNote:`Good budget option — works reliably, though growth is typically a bit less vigorous than malt-based recipes.`,ingredients:[`Brown sugar`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} brown sugar into warm water until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Brown sugar's molasses content can slightly darken the syrup and make contamination harder to spot early — inspect closely and sterilize thoroughly.`},maple:{name:`Maple Syrup — 4%`,description:`Improvised LC using pure maple syrup — its natural mineral content can give a small vigor boost over plain sugar syrups.`,ratingNote:`Good pantry alternative — trace minerals may help vigor, but pure maple syrup is a pricier option.`,ingredients:[`Pure maple syrup (not pancake syrup)`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} pure maple syrup into warm water until fully dissolved.`,`Top up with remaining water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood.`,`Incubate at 21–27°C, swirling every day or two, until fluffy white mycelium growth appears (3–10 days).`],hygiene:`Use pure maple syrup only — imitation "pancake syrup" is mostly corn syrup with additives that offer no benefit. Sterilize thoroughly as with any sugar-based media.`},wort:{name:`Homemade Malted Barley Wort`,description:`Fully improvised LC made by steeping crushed malted barley grain (like a mini beer mash) instead of using store-bought malt extract.`,ratingNote:`Excellent — essentially homemade malt extract, near-identical performance to LME once you've got the mashing technique down.`,ingredients:[`Crushed malted barley grain`,`Water (for steeping + topping to volume)`],steps:[`Heat most of the water to 65–68°C (use a thermometer — this range converts starch to sugar without denaturing the enzymes).`,`Stir in {i0w} crushed malted barley grain and hold at 65–68°C for 60 minutes, stirring occasionally (this is a mini "mash").`,`Strain out the spent grain husks through a mesh bag or cheesecloth, keeping only the sweet liquid (wort). Top up with water to reach {V} total.`,`Distribute into jars, filling each to 70–80% capacity. Fit lids with self-healing injection ports and micron filter.`,`Pressure sterilize at 15 psi (121°C) for 20–25 minutes, then cool completely.`,`Inject spore solution or liquid culture (1–2 mL per jar) in a still-air box or flow hood, then incubate at 21–27°C until fluffy white growth appears (3–10 days).`],hygiene:`Hold the mash temperature carefully — too hot and you lose the enzyme conversion, too cool and bacteria can gain a foothold before sterilization.`}},agar:{mea:{name:`Malt Extract Agar (MEA)`,description:`The most popular homemade agar for mushroom culture work — gentle nutrient level, easy to pour and read.`,ratingNote:`Excellent — the gold standard for home culture work, reliable and easy to read.`,ingredients:[`Light malt extract (LME)`,`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Combine {i0w} light malt extract and {i1w} agar-agar powder with the water ({V} total) in a heat-safe flask or jar.`,`Stir, then heat/boil for 1–2 minutes while stirring until the agar fully dissolves (liquid turns clear, no gritty powder left).`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid) — do not let it fully set in the container.`,`In a still-air box or flow hood, pour a thin layer (about 20–25 mL per standard 90 mm dish) into sterile petri dishes, swirling gently to cover the base.`,`Leave lids slightly ajar until the agar sets and cools, then close and store upside-down in the fridge until use.`],hygiene:`Wipe down your work surface with isopropyl alcohol before pouring, and pour quickly once dishes are opened to minimize airborne contamination exposure.`},pda:{name:`Potato Dextrose Agar (PDA)`,description:`Classic mycology standard, made from a real potato infusion — great for observing mycelium characteristics.`,ratingNote:`Excellent — the mycology-standard formula, great vigor and ideal for observing growth characteristics.`,ingredients:[`Peeled potato (diced)`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for boiling + topping to volume)`],steps:[`Peel and dice {i0w} potato, then boil in most of the water for 20–30 minutes until soft.`,`Strain out the solids, keeping only the potato infusion liquid. Top up with water back to {V} total.`,`While still hot, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`PDA is nutrient-rich, making it more prone to bacterial contamination — sterilize thoroughly and pour with very clean technique.`},mya:{name:`Malt Yeast Agar (MYA)`,description:`MEA boosted with a small amount of nutritional/brewer's yeast for slightly faster, more vigorous mycelium growth.`,ratingNote:`Excellent — the added yeast gives noticeably faster, more vigorous growth than plain MEA.`,ingredients:[`Light malt extract (LME)`,`Nutritional/brewer's yeast`,`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Combine {i0w} light malt extract, {i1w} nutritional yeast, and {i2w} agar-agar powder with the water ({V} total).`,`Stir, then heat/boil for 1–2 minutes while stirring until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`The added yeast makes this a richer medium — keep pours quick and your work area freshly sanitized to avoid contamination.`},honeyagar:{name:`Honey Agar`,description:`Pantry-ingredient agar using raw honey instead of malt extract — a simple option if LME isn't on hand.`,ratingNote:`Good backup option when LME isn't on hand, though the gel softens faster over storage time.`,ingredients:[`Raw honey`,`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Dissolve {i1w} agar-agar powder into the water ({V} total) and bring to a boil for 1–2 minutes, stirring, until fully dissolved.`,`Remove from heat and stir in {i0w} raw honey until dissolved.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Honey can slightly soften agar over time — use plates within a few weeks and store cold. Sterilize thoroughly as with any sugar-based media.`},ricewater:{name:`Rice Water Agar (RWA)`,description:`Cheap, widely-used improvised agar made from starchy rice cooking water — a common no-malt-extract substitute.`,ratingNote:`Good budget improvised option — solid growth for isolation work, though less vigorous than MEA/PDA.`,ingredients:[`Uncooked white rice`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for boiling + topping to volume)`],steps:[`Simmer {i0w} uncooked rice in most of the water for 15–20 minutes until the water turns cloudy and starchy — do not let the rice fully break apart.`,`Strain out the rice, keeping only the starchy rice water. Top back up with water to reach {V} total.`,`While still hot, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Rice starch supports contaminants as readily as mycelium — sterilize thoroughly and don't skip the pressure-cook step even though the ingredients look "just food".`},coconutwater:{name:`Coconut Water Agar (CWA)`,description:`Improvised agar using unsweetened coconut water as the base liquid — naturally contains sugars and minerals.`,ratingNote:`Good improvised option — naturally near-sterile liquid with decent minerals, but less refined growth than MEA.`,ingredients:[`Unsweetened coconut water`,`Dextrose (glucose)`,`Agar-agar powder`],steps:[`Pour {i0v} unsweetened coconut water (plain, no added sugar/flavoring) into a heat-safe flask or jar.`,`Stir in {i1w} dextrose and {i2w} agar-agar powder, then bring to a gentle boil for 1–2 minutes, stirring, until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Use pure, unsweetened, preferably pasteurized coconut water — flavored or sugar-added versions contaminate more easily and can inhibit mycelium.`},plainwater:{name:`Plain Water Agar (PWA)`,description:`Bare-bones improvised agar with no added nutrients — useful for spore germination checks and isolating clean tissue away from faster-growing contaminants.`,ratingNote:`Fair overall performance — slow, thin growth by design, but valuable specifically for clean isolation and germination work.`,ingredients:[`Agar-agar powder`,`Distilled/RO water (to final volume)`],steps:[`Stir {i0w} agar-agar powder into {V} water in a heat-safe flask or jar.`,`Bring to a gentle boil for 1–2 minutes, stirring constantly, until the agar fully dissolves (liquid turns clear).`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`With no added nutrients, fast-growing contaminants have less of an advantage — handy for isolating clean mycelium, but growth will be slower and thinner than on MEA/PDA.`},banana:{name:`Banana Agar (BA)`,description:`Improvised agar made from blended ripe banana — a popular fruit-based option with good natural sugars.`,ratingNote:`Good improvised option — ripe bananas provide solid sugars, but batches can be a bit cloudier/less clear than MEA.`,ingredients:[`Ripe banana (blended)`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for blending + topping to volume)`],steps:[`Blend {i0w} peeled ripe banana with about a third of the water until smooth.`,`Strain through cheesecloth or a fine mesh bag to remove pulp fibers, keeping the liquid. Top up with remaining water to reach {V} total.`,`Stir in {i1w} dextrose and {i2w} agar-agar powder, then bring to a gentle boil for 1–2 minutes, stirring, until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Use fully ripe (but not moldy) bananas and strain thoroughly — leftover pulp fibers can trap air bubbles and make contamination harder to spot early.`},carrot:{name:`Carrot Agar (CA)`,description:`Improvised agar using a boiled carrot infusion in place of potato — a common beginner substitute for PDA.`,ratingNote:`Good improvised option — mild, beginner-friendly nutrient profile, commonly used for isolation work.`,ingredients:[`Carrot (chopped)`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for boiling + topping to volume)`],steps:[`Chop {i0w} carrot and boil in most of the water for 20–30 minutes until soft.`,`Strain out the solids, keeping only the carrot infusion liquid. Top up with water back to {V} total.`,`While still hot, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Carrot infusions are mild in nutrients — sterilize thoroughly as usual, but expect slightly slower colonization than richer media like PDA.`},beerwort:{name:`Beer Wort Agar (Homemade Malt)`,description:`Fully improvised agar made by steeping crushed malted barley grain into a homemade wort, then gelling with agar — no store-bought malt extract needed.`,ratingNote:`Excellent — essentially homemade MEA once you dial in the mash technique, with very similar performance.`,ingredients:[`Crushed malted barley grain`,`Dextrose (glucose)`,`Agar-agar powder`,`Water (for steeping + topping to volume)`],steps:[`Heat most of the water to 65–68°C, then stir in {i0w} crushed malted barley grain. Hold at 65–68°C for 45–60 minutes, stirring occasionally.`,`Strain out the spent grain husks through a mesh bag or cheesecloth, keeping only the sweet wort liquid. Top up with water to reach {V} total.`,`While still warm, stir in {i1w} dextrose and {i2w} agar-agar powder. Bring to a gentle boil for 1–2 minutes, stirring, until the agar fully dissolves.`,`Pour into heat-tolerant jars or bottles, loosely capped, and pressure sterilize at 15 psi (121°C) for 20–25 minutes.`,`Let cool until just handleable (around 50–60°C, still liquid), then pour into sterile petri dishes in a still-air box or flow hood.`,`Leave lids slightly ajar until set, then close and store upside-down in the fridge until use.`],hygiene:`Hold the mash temperature carefully for proper starch-to-sugar conversion, and sterilize thoroughly afterward — same care as with the liquid culture version of this recipe.`}},grain:{rye:{name:`Rye Berries`,description:`The classic, most widely used spawn grain — small, uniform, and reliable for almost every gourmet species.`,ratingNote:`Excellent — the gold-standard spawn grain: consistent colonization and broad compatibility with almost any species.`,ingredients:[`Dry rye berries`,`Water (for soak + simmer)`,`Gypsum (calcium sulfate)`],steps:[`Measure out {i0v} ({i0w}) of dry rye berries and rinse thoroughly in a colander until the water runs clear.`,`Soak in {i1v} of water for 12–24 hours at room temperature, then simmer gently for 10–15 minutes until the husks just begin to split — avoid a rolling boil, which splits grains open and invites contamination.`,`Drain thoroughly in a colander for 15–20 minutes and let surface moisture evaporate, then mix in {i2w} gypsum to reduce clumping.`,`Load into jars with self-healing injection-port lids, filling each to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, then cool completely before inoculating with spores or liquid culture through the injection port in a still-air box or flow hood.`,`Shake well to distribute the inoculation point through the jar, then incubate in the dark at 21–24°C until fully colonized (roughly 1–3 weeks).`],hygiene:`Rye is nutrient-dense and among the more contamination-prone spawn grains — drain it well (wet jars are the #1 cause of bacterial "sour spawn") and sterilize the full 90 minutes.`},wheatberries:{name:`Wheat Berries`,description:`A close alternative to rye with a similar size and starch content — use whichever is cheaper or easier to source locally.`,ratingNote:`Excellent — performs almost identically to rye, a great substitute when rye isn't available.`,ingredients:[`Dry wheat berries`,`Water (for soak + simmer)`,`Gypsum (calcium sulfate)`],steps:[`Measure out {i0v} ({i0w}) of dry wheat berries and rinse thoroughly until the water runs clear.`,`Soak in {i1v} of water for 12–24 hours, then simmer gently for 10–15 minutes until the husks just begin to split.`,`Drain well for 15–20 minutes and let the surface dry slightly, then mix in {i2w} gypsum to reduce clumping.`,`Load into jars with self-healing injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes and cool completely before inoculating in a still-air box or flow hood.`,`Shake to distribute inoculation, then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Like rye, wheat berries are nutrient-rich and prone to sour spawn if left too wet — drain thoroughly and don't skip any of the sterilization time.`},oats:{name:`Whole Oat Groats`,description:`Softer-husked grain that colonizes a little faster than rye, though the husk is more fragile once fully hydrated.`,ratingNote:`Very good — fast colonization, but handle gently after hydration since the husk breaks down more easily.`,ingredients:[`Whole oat groats`,`Water (for soak + simmer)`,`Gypsum (calcium sulfate)`],steps:[`Measure out {i0v} ({i0w}) of whole oat groats and rinse well until the water runs mostly clear.`,`Soak in {i1v} of water for 8–12 hours (oats hydrate faster than rye), then simmer gently for 5–10 minutes until just tender — watch closely, oats overcook quickly.`,`Drain thoroughly and handle gently — the softened husk tears easily. Mix in {i2w} gypsum once mostly dry-surfaced.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake gently to distribute, then incubate in the dark at 21–24°C until fully colonized — oats often colonize a few days faster than rye.`],hygiene:`Oats hydrate and overcook faster than rye — err on the shorter side of simmer time, since mushy grain drains poorly and contaminates more easily.`},popcorn:{name:`Popcorn (Whole Kernel)`,description:`Cheap, widely available bulk spawn grain — plain unflavored popping corn kernels, not the microwave bag kind.`,ratingNote:`Good — inexpensive and easy to find, though slightly less consistent colonization than rye.`,ingredients:[`Dry popcorn kernels`,`Water (for soak + simmer)`],steps:[`Measure out {i0v} ({i0w}) of dry popcorn kernels (plain, unflavored) and rinse well.`,`Soak in {i1v} of water for 24 hours, then simmer gently for 15–20 minutes until kernels swell and the skin just starts to split — do not let them pop.`,`Drain thoroughly in a colander for 15–20 minutes until no water pools at the bottom.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake to distribute, then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Popcorn's tough outer skin holds up well to handling, but make sure kernels are fully hydrated through to the center before jarring — a hard, dry core will not colonize.`},millet:{name:`Millet`,description:`Small round grain popular for its high spawn-to-substrate surface area — many small grains spread colonization quickly through bulk substrate.`,ratingNote:`Good — excellent surface area for spawning bulk substrate, but easy to overcook into mush if simmered too long.`,ingredients:[`Dry millet`,`Water (for soak + simmer)`],steps:[`Measure out {i0v} ({i0w}) of dry millet and rinse well in a fine sieve.`,`Soak in {i1v} of water for 8–12 hours, then simmer gently for 5–8 minutes only — millet is small and cooks fast, so watch closely to avoid mush.`,`Drain thoroughly and spread briefly to air-dry the surface before jarring.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake well — millet's many small grains spread inoculation points quickly — then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`Millet's small size means it overcooks in minutes, not tens of minutes — mushy, broken grain drains poorly and is much more contamination-prone.`},sorghum:{name:`Sorghum (Milo)`,description:`Cheap bulk grain, often sold as wild bird seed — a solid budget option similar in size to millet.`,ratingNote:`Good — very budget-friendly and widely available, with solid colonization once properly hydrated.`,ingredients:[`Dry sorghum (milo)`,`Water (for soak + simmer)`],steps:[`Measure out {i0v} ({i0w}) of dry sorghum (milo) and rinse well, picking out any chaff or debris if using bulk bird seed.`,`Soak in {i1v} of water for 12–24 hours, then simmer gently for 10–15 minutes until kernels swell and the skin just starts to split.`,`Drain thoroughly in a colander for 15–20 minutes.`,`Load into jars with injection-port lids, filling to about 60–65% capacity ({V} total hydrated grain).`,`Pressure sterilize at 15 psi (121°C) for 90 minutes, cool completely, then inoculate in a still-air box or flow hood.`,`Shake to distribute, then incubate in the dark at 21–24°C until fully colonized.`],hygiene:`If sourcing sorghum as bulk "wild bird seed," check the bag for other grain types mixed in and pick them out — a consistent single grain colonizes more evenly.`}},species:{oyster:{name:`Oyster Mushroom (Pleurotus ostreatus)`,description:`The classic beginner species — fast, forgiving, and productive on almost any low-cost substrate.`,ratingNote:`Excellent — the most forgiving and reliable species for a first grow, tolerant of imperfect conditions.`},pinkOyster:{name:`Pink Oyster (Pleurotus djamor)`,description:`A fast, warmth-loving oyster relative with striking pink color — pins quickly but has a short shelf life once picked.`,ratingNote:`Very good — very fast growth and dramatic color, but fruits degrade within a day or two so plan to eat or process quickly.`},kingOyster:{name:`King Oyster (Pleurotus eryngii)`,description:`Thick, meaty stems and a milder flavor than other oysters — prized for texture but slower and more particular about cool fruiting temperatures.`,ratingNote:`Very good — excellent texture and shelf life, though it needs a cooler fruiting period and lower fresh air exchange than most oysters.`},lionsMane:{name:`Lion's Mane (Hericium erinaceus)`,description:`Distinctive shaggy white fruit with no true cap or gills — popular for its seafood-like texture and culinary/nutraceutical interest.`,ratingNote:`Excellent — reliable and rewarding, though it wants strong fresh air exchange or fruits grow spiny and stunted instead of forming full "teeth".`},shiitake:{name:`Shiitake (Lentinula edodes)`,description:`Slow-colonizing wood-loving species that typically needs a cold-water soak to trigger pinning after the block is fully colonized.`,ratingNote:`Very good — outstanding flavor and shelf life, but the slowest species here to colonize and fruit, needing real patience.`},reishi:{name:`Reishi (Ganoderma lucidum)`,description:`A hardy, warmth-loving polypore grown for its woody, medicinal fruit body rather than eaten fresh — usually dried and extracted.`,ratingNote:`Good — very forgiving and contamination-resistant, but slow, with a single long fruiting cycle rather than quick repeat flushes.`},wineCap:{name:`Wine Cap (Stropharia rugosoannulata)`,description:`A vigorous, cold-tolerant species best known for outdoor beds on straw or wood chips — a good low-tech option once established outdoors.`,ratingNote:`Good — thrives outdoors with little intervention, but indoor/tub cultivation is less predictable than the other species here.`},buttonAgaricus:{name:`Button / Portobello (Agaricus bisporus)`,description:`The supermarket mushroom — needs composted manure substrate topped with a casing layer of soil-like material to pin, unlike the wood-lovers above.`,ratingNote:`Good — very rewarding once you have compost and casing technique down, but the most technically involved species to start from scratch at home.`}}},sk:{ui:{pageTitle:`🍄 Kalkulačky pre pestovanie húb`,pageSubtitle:`Metrické kalkulačky receptov pre domáce pestovanie húb.`,langLabel:`Jazyk`,unitLabel:`Jednotky`,themeLabel:`Vzhľad`,themeAuto:`Automaticky`,themeLight:`Svetlý`,themeDark:`Tmavý`,copyBtn:`Kopírovať ako text`,copiedBtn:`Skopírované!`,tabSubstrate:`Kalkulačka substrátu`,tabLc:`Kalkulačka tekutej kultúry`,tabAgar:`Agarové platne`,substrateLabel:`Cieľový substrát`,spawnLabel:`Množstvo zrnného osiva (ml)`,spawnTip:`Tip: 1 l osídleného zrnného osiva váži približne 700 – 800 g.`,calcBtn:`Vypočítať recept`,subIngredientsHeader:`Ingrediencie`,ingCol:`Ingrediencia`,volCol:`Objem`,wtCol:`Hmotnosť`,subTotalLabel:`Celkový substrát`,substrateFootnote:`Hmotnosti sú orientačné — skutočná hustota závisí od vlhkosti a značky materiálu. Vodu pridávajte postupne a vlhkosť kontrolujte hmatom (skúška stlačením: uvoľní sa pár kvapiek, žiadny súvislý prúd).`,stepsHeader:`Postup prípravy`,lcLabel:`Recept tekutej kultúry`,jarVolLabel:`Tekutina na pohár (ml)`,jarCountLabel:`Počet pohárov`,jarNote:`Poháre naplňte do cca 70 – 80 % objemu tekutinou, aby ostal priestor pre výmenu vzduchu a prístup striekačky.`,lcIngredientsHeader:`Ingrediencie (spolu pre všetky poháre)`,lcTotalLabel:`Celková tekutina`,lcFootnote:`Koncentrácie sú orientačné hodnoty živín % (w/v) bežne používané pre tekutú kultúru húb. Prispôsobte podľa skúseností — príliš koncentrovaný roztok môže spomaliť rast mycélia.`,jarsWord:`nádob`,agarLabel:`Agarový recept`,plateVolLabel:`Médium na platňu (ml)`,plateCountLabel:`Počet platní`,agarNote:`Štandardná Petriho miska s priemerom 90 mm potrebuje približne 20 – 25 ml média. Automaticky je pripočítaných 10 % navyše na straty pri liatí.`,agarIngredientsHeader:`Ingrediencie (spolu, vrát. 10 % straty pri liatí)`,agarTotalLabel:`Celkové médium`,agarFootnote:`Koncentrácia agaru je ~2 % (20 g/l), štandardná tuhosť pre prácu s kultúrami húb. Koncentrácie živín sú orientačné — prispôsobte podľa skúseností.`,platesWord:`platní`,tabGrain:`Zrnné osivo`,grainLabel:`Druh obilia`,grainJarVolLabel:`Hydratované zrno na pohár (ml)`,grainNote:`Poháre naplňte hydratovaným zrnom asi do 60 – 65 % objemu, aby ostal priestor na pretrepanie a výmenu vzduchu.`,grainIngredientsHeader:`Ingrediencie (spolu pre všetky poháre)`,grainTotalLabel:`Celkové hydratované zrno`,grainFootnote:`Hmotnosti sú orientačné — hustota suchého zrna a nasiakavosť sa líšia podľa odrody a šarže. Zrno dôkladne scedťe; príliš mokré poháre sú najčastejšou príčinou kyslej/bakteriálnej kontaminácie.`,tabSpecies:`Sprievodca druhmi`,speciesLabel:`Druh`,colonizeHeader:`Kolonizácia`,fruitingHeader:`Plodenie`,colonizeTempLabel:`Teplota`,fruitTempLabel:`Teplota`,fruitHumidityLabel:`Vlhkosť`,faeLabel:`Výmena vzduchu (FAE)`,lightLabel:`Svetlo`,daysToPinLabel:`Dní do tvorby zárodkov`,flushIntervalLabel:`Dní medzi vlnami úrody`,numFlushesLabel:`Bežný počet vĺn`,recommendedSubstratesLabel:`Vhodné substráty`,recommendedGrainsLabel:`Vhodné zrnné osivo`,faeLow:`Nízka`,faeMedium:`Stredná`,faeHigh:`Vysoká`,lightNone:`Nie je potrebné`,lightLow:`Nízke, nepriame`,lightMedium:`Stredné, nepriame`,daysUnit:`dní`,tabYield:`Odhad výnosu`,yieldSpeciesLabel:`Druh`,yieldSubstrateLabel:`Použitý substrát`,yieldWeightLabel:`Hmotnosť pripraveného (mokrého) substrátu`,yieldResultLabel:`Odhadovaný celkový čerstvý výnos`,yieldPerFlushLabel:`Približne na jednu vlnu`,yieldDisclaimer:`Iba orientačný odhad na plánovanie, založený na typických hodnotách domácich pestovateľov. Skutočný výnos výrazne závisí od genetiky, techniky, kontaminácie a prostredia — berte to ako hrubý odhad, nie sľub.`,tabDrying:`Pomocník so sušením`,dryingSpeciesLabel:`Druh`,dryingThicknessLabel:`Hrúbka plátkov`,dryingThicknessThin:`Tenké (≤ 5 mm)`,dryingThicknessMedium:`Stredné (5 – 10 mm)`,dryingThicknessThick:`Hrubé / celé malé klobúky (> 10 mm)`,dryingTempResultLabel:`Teplota sušičky`,dryingTimeResultLabel:`Typický čas sušenia`,dryingFootnote:`Časy sa výrazne líšia podľa prúdenia vzduchu, vlhkosti a hustoty naukladania klobúkov. Sušte, kým sa kúsky čisto nezlomia namiesto ohnutia — to je dôležitejšie než hodiny na hodinkách.`},substrates:{cvg:{name:`CVG — kokosové vlákno / vermikulit / sadra`,description:`Univerzálny substrát pre gurmánske huby (hliva, ježovec a i.). Pomer ≈ 1 diel osiva : 2 diely substrátu podľa objemu.`,ratingNote:`Vynikajúce — spoľahlivý zlatý štandard: stabilná kolonizácia, silné výnosy, nízke riziko kontaminácie.`,ingredients:[`Kokosový substrát (suchá, lisovaná tehlička)`,`Voda (na hydratáciu kokosového vlákna)`,`Vermikulit`,`Sadra (síran vápenatý)`],steps:[`Rozdrvte suchú tehličku kokosového vlákna ({i0w}) do veľkej nádoby.`,`Zalejte {i1v} takmer vriacej vody, prikryte a nechajte 20 – 30 min., kým sa voda úplne vsiakne a zmes vychladne na izbovú teplotu.`,`Nakyprite hydratované vlákno rukami v rukaviciach, aby ste rozbili hrudky.`,`Pridajte {i2v} vermikulitu a {i3w} sadry. Dôkladne premiešajte.`,`Skontrolujte vlhkosť skúškou stlačením — má sa uvoľniť pár kvapiek, žiadny súvislý prúd. Ak je suchý, pridajte trochu vody.`,`Rozdrvte hubové osivo ({V}) a rovnomerne ho premiešajte so substrátom (pomer približne 1:2 osivo k substrátu podľa objemu).`,`Voľne naplňte do pestovateľského vaku/nádoby s filtračnou záplatou alebo vetracími otvormi a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Zmesi kokosového vlákna a vermikulitu majú nízky obsah živín, takže dobre odolávajú kontaminácii — napriek tomu pracujte s čistými rukami/rukavicami a dezinfikovaným náradím.`},masters:{name:`Master's Mix — sójové šupky + tvrdé drevo (pelety)`,description:`Substrát s vysokým obsahom živín a vysokým výnosom pre gurmánske huby. Pomer ≈ 1 diel osiva : 1 diel substrátu podľa objemu.`,ratingNote:`Vynikajúce — zvyčajne najvyššie výnosy zo všetkých bežných receptov, no vyžaduje plnú sterilizáciu a čistú techniku.`,ingredients:[`Sójové šupkové pelety (suché)`,`Pelety z tvrdého dreva (suché)`,`Voda (na namočenie, prebytok sa odleje)`],steps:[`Zmiešajte {i0w} sójových šupkových peliet a {i1w} peliet z tvrdého dreva vo vedre.`,`Zalejte {i2v} vody a namáčajte 1 – 2 hodiny — pelety napučia a rozpadnú sa na textúru podobnú pilinám.`,`Dôkladne sceďte cez cedník/sieťové vrecko, kým z nich nekvapká voda (poľná kapacita). Toto je váš finálny hydratovaný substrát, cca {V}.`,`Sterilizujte hydratovaný substrát vo vakoch/pohároch pri 15 psi po dobu 90 minút (táto zmes je bohatá na živiny a vyžaduje plnú sterilizáciu, nie len pasterizáciu).`,`Nechajte úplne vychladnúť, potom rozdrvte hubové osivo ({V}) a dôkladne premiešajte v pomere približne 1:1 v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Uzavrite a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Master's Mix je bohatý na živiny, preto je náchylnejší na kontamináciu — dôrazne sa odporúča plná tlaková sterilizácia a technika čistého vzduchu.`},straw:{name:`Pasterizovaná slama`,description:`Klasický lacný substrát, typicky pre hlivu ustricovitú. Pomer ≈ 1 diel osiva : 4 diely slamy podľa objemu.`,ratingNote:`Veľmi dobré — rýchla kolonizácia a nízka cena, no výnosy sú nižšie než pri substrátoch obohatených živinami ako CVG či Master's Mix.`,ingredients:[`Nasekaná pšeničná/jačmenná slama (suchá)`,`Voda (na horúci pasterizačný kúpeľ)`],steps:[`Nasekajte alebo natrhajte slamu na kúsky 5 – 10 cm — cca {i0v} voľne naplnené ({i0w} sucháho materiálu).`,`Ponorte slamu v sieťovom vreci do horúcej vody pri 60 – 70 °C na 60 – 90 minút na pasterizáciu (použite približne {i1v} vody, dostatok na úplné ponorenie).`,`Vyberte a nechajte/vyžmýkajte odtiecť prebytočnú vodu — slama má byť vlhká, nie mokrá.`,`Nechajte vychladnúť na izbovú teplotu, potom rozdrvte hubové osivo ({V}) a preložte ho vrstvami slamy v pestovateľskom vaku (osivo-slama-osivo-slama...).`,`Prepichnite alebo prerežte malé vetracie otvory vo vaku a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Slama potrebuje len pasterizáciu (nie plnú sterilizáciu), keďže ide o substrát s nízkym obsahom živín — postačí horúca voda alebo parná pasterizácia s následnou čistou manipuláciou.`},manure:{name:`Kompostovaný hnoj`,description:`Bohatý substrát pre pečiarky/portobello huby. Pomer ≈ 1 diel osiva : 6 dielov kompostovaného substrátu podľa objemu.`,ratingNote:`Veľmi dobré pre druhy milujúce hnoj (pečiarka, portobello); zlá voľba pre drevomilné druhy ako hliva či shiitake.`,ingredients:[`Kompostovaný konský hnoj (vlhký, pripravený)`,`Sadra`,`Voda (na doladenie vlhkosti)`],steps:[`Začnite s dobre kompostovaným, vyzretým konským hnojom (nie čerstvým/horúcim) — cca {i0v} ({i0w}).`,`Primiešajte {i1w} sadry na zlepšenie štruktúry a zníženie lepkavosti.`,`Upravte vlhkosť pridaním až {i2v} vody, kým kompost pri stlačení nedrží pokope, ale nekvapká.`,`Pasterizujte kompost pri 60 – 65 °C počas 1 – 2 hodín (pasterizácia v podnose alebo parou), aby ste odstránili konkurentov a zachovali prospešné mikroorganizmy.`,`Nechajte vychladnúť na izbovú teplotu, potom rozdrvte hubové osivo ({V}) a dôkladne premiešajte do kompostu v pomere približne 1:6.`,`Naplňte podnosy alebo nádoby, po prerastení prekryte vrstvou zeminy (casing layer) a nechajte plodiť pri 21 – 24 °C v tme.`],hygiene:`Kompostovaný hnoj obsahuje prirodzené mikrobiálne spoločenstvo — pasterizujte (nesterilizujte), aby prospešní konkurenti zostali nažive a zároveň sa potlačili patogény.`},coffee:{name:`Použitá kávová usadenina`,description:`Substrát vhodný pre začiatočníkov z recyklovaného materiálu pre hlivu ustricovitú — proces prípravy kávy usadeninu už pasterizuje. Pomer ≈ 1 diel osiva : 2 diely usadeniny podľa objemu.`,ratingNote:`Dobré, veľmi nenáročná a nízkoriziková voľba pre začiatočníkov, no skromné výnosy — najlepšie použiť čerstvé a zmiešané so slamou alebo kokosovým vláknom pre objem.`,ingredients:[`Použitá (vylúhovaná) kávová usadenina, vychladnutá`],steps:[`Nazbierajte {i0w} čerstvo použitej kávovej usadeniny (ešte teplá z prípravy sa počíta ako pasterizovaná) a nechajte ju vychladnúť na izbovú teplotu v čistej, prikrytej nádobe.`,`Rozbite prípadné hrudky — usadenina má byť drobivá, nie zbitá.`,`V boxe s nehybným vzduchom alebo na čistom mieste rozdrvte hubové osivo ({V}) a dôkladne ho premiešajte do usadeniny v pomere približne 1:2.`,`Voľne naplňte do pestovateľského vaku/nádoby s filtračnou záplatou alebo vetracími otvormi — nezhutňujte, kávová usadenina potrebuje prevzdušnenie.`,`Nechajte prerásť v tme pri 21 – 24 °C. Pre najnižšie riziko kontaminácie použite usadeninu do jedného-dvoch dní od prípravy kávy.`],hygiene:`Teplo z prípravy kávy (takmer 90 °C+) spolu s prirodzenou kyslosťou kávy dávajú tomuto substrátu solídnu prirodzenú odolnosť voči kontaminácii — stačí udržiavať nádoby a ruky čisté a používať čerstvú usadeninu.`},cardboard:{name:`Kartónový substrát`,description:`Lacný, jednoduchý substrát pre začiatočníkov z nastrihaného vlnitého kartónu — vhodný na skúšobné pokusy a menšie projekty s hlivou. Pomer ≈ 1 diel osiva : 3 diely namočeného kartónu podľa objemu.`,ratingNote:`Priemerné — veľmi lacné a ľahko dostupné, no nízka hustota živín znamená menšie a pomalšie úrody než pri dedikovaných substrátoch. Vhodné na učenie, nie na seriózne výnosy.`,ingredients:[`Nastrihaný jednoduchý vlnitý kartón (suchý, bez potlače/lepiacej pásky)`,`Voda (na namočenie/pasterizáciu)`],steps:[`Odstráňte všetku lepiacu pásku, štítky a lesklé potlačené časti, potom natrhajte alebo nastrihajte {i0w} jednoduchého vlnitého kartónu na pásiky.`,`Ponorte do {i1v} horúcej vody (60 – 70 °C) na 60 – 90 minút na pasterizáciu a zmäkčenie.`,`Sceďte a jemne vyžmýkajte prebytočnú vodu, kým nie je vlhký, ale nekvapká.`,`Nechajte vychladnúť na izbovú teplotu, potom rozdrvte hubové osivo ({V}) a preložte ho medzi pásiky kartónu v pestovateľskom vaku.`,`Prepichnite malé vetracie otvory vo vaku a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Používajte len jednoduchý hnedý kartón — tlačová farba a lesklé povrchy môžu brzdiť rast alebo priniesť kontamináciu. Pri tomto substráte s nízkym obsahom živín postačí pasterizácia (nie plná sterilizácia).`},sawdust:{name:`Blok na pilinách (tvrdé drevo + otruby)`,description:`Tradičný substrát pre drevomilné druhy ako shiitake, reishi a ježovec — piliny z tvrdého dreva doplnené pšeničnými otrubami. Pomer ≈ 1 diel osiva : 4 diely substrátu podľa objemu.`,ratingNote:`Vynikajúce pre drevomilné druhy — pomalšia kolonizácia než pri substrátoch priateľských k obilninám, no husté bloky poskytujú dlhú, produktívnu plodnosť.`,ingredients:[`Piliny z tvrdého dreva (suché, nežživičnaté)`,`Pšeničné otruby`,`Voda (na hydratáciu)`],steps:[`Zmiešajte {i0w} pilín z tvrdého dreva (dub, javor, buk — vyhnite sa živičnatým mäkkým drevinám) s {i1w} pšeničných otrúb vo veľkej nádobe.`,`Postupne primiešajte {i2v} vody, kým nedosiahnete poľnú kapacitu (skúška stlačením: uvoľní sa pár kvapiek, žiadny súvislý prúd).`,`Natesno naplňte do teplovzdorných vakov alebo pohárov — bloky z pilín sú husté, preto sterilizujte tlakovo pri 15 psi (121 °C) 2 – 2,5 hodiny (dlhšie než pri voľnejších substrátoch).`,`Nechajte úplne vychladnúť, potom rozdrvte hubové osivo ({V}) a dôkladne premiešajte v pomere približne 1:4 v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Uzavrite a nechajte prerásť v tme pri 21 – 24 °C — tento substrát je hustejší a zvyčajne trvá dlhšie (3 – 5+ týždňov) než substráty na báze obilia.`],hygiene:`Pridanie otrúb robí tento substrát bohatým na živiny a náchylným na kontamináciu — plná tlaková sterilizácia s predĺženým časom je nevyhnutná kvôli hustote napchaných pilín.`}},lc:{lme:{name:`Sirup zo svetlého sladového extraktu (LME) — 4 %`,description:`Najbežnejší recept tekutej kultúry. Jemný, spoľahlivý zdroj živín pre rast mycélia.`,ratingNote:`Vynikajúce — najpoužívanejší a najspoľahlivejší recept tekutej kultúry so stabilným, energickým rastom.`,ingredients:[`Svetlý sladový extrakt (LME)`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Rozpustite {i0w} svetlého sladového extraktu asi v polovici vody za mierneho hriatia a miešania, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na cca 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom na výmenu vzduchu.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút. Nechajte úplne vychladnúť na izbovú teplotu pred manipuláciou.`,`V boxe s nehybným vzduchom alebo laminárnom boxe vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) cez injekčný port sterilnou striekačkou.`,`Nechajte prerásť pri 21 – 27 °C, občas jemne pošúchajte. Rast mycélia sa prejaví ako chumáčovité biele oblaky do 3 – 10 dní.`],hygiene:`Vyhoďte akýkoľvek pohár, ktorý sa nerovnomerne zakalí/sfarbí, kysne alebo hnije, alebo vykazuje farebné (zelené/čierne/ružové) škvrny — príznaky kontaminácie.`},honey:{name:`Medová voda — 4 %`,description:`Jednoduchá alternatíva k sladovému extraktu zo špajze, podobná koncentrácia živín.`,ratingNote:`Veľmi dobré — jednoduchá voľba zo špajze so solídnym rastom, no o niečo náchylnejšia na kontamináciu než LME.`,ingredients:[`Surový med`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Zohrejte asi polovicu vody a vmiešajte {i0w} surového medu, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým neuvidíte chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Medová voda môže byť o niečo náchylnejšia na kontamináciu než LME — vždy použite surový (nie priemyselne spracovaný) med a dôkladne sterilizujte.`},cornsyrup:{name:`Svetlý kukuričný sirup — 3 %`,description:`Lacná, ľahko dostupná alternatíva s o niečo nižšou koncentráciou živín.`,ratingNote:`Veľmi dobré — lacné, účinné a porovnateľné výkonom s medovou vodou.`,ingredients:[`Svetlý kukuričný sirup`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} svetlého
