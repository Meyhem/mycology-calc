VG — kokosové vlákno / vermikulit / sadra`,description:`Univerzálny substrát pre gurmánske huby (hliva, ježovec a i.). Pomer ≈ 1 diel osiva : 2 diely substrátu podľa objemu.`,ratingNote:`Vynikajúce — spoľahlivý zlatý štandard: stabilná kolonizácia, silné výnosy, nízke riziko kontaminácie.`,ingredients:[`Kokosový substrát (suchá, lisovaná tehlička)`,`Voda (na hydratáciu kokosového vlákna)`,`Vermikulit`,`Sadra (síran vápenatý)`],steps:[`Rozdrvte suchú tehličku kokosového vlákna ({i0w}) do veľkej nádoby.`,`Zalejte {i1v} takmer vriacej vody, prikryte a nechajte 20 – 30 min., kým sa voda úplne vsiakne a zmes vychladne na izbovú teplotu.`,`Nakyprite hydratované vlákno rukami v rukaviciach, aby ste rozbili hrudky.`,`Pridajte {i2v} vermikulitu a {i3w} sadry. Dôkladne premiešajte.`,`Skontrolujte vlhkosť skúškou stlačením — má sa uvoľniť pár kvapiek, žiadny súvislý prúd. Ak je suchý, pridajte trochu vody.`,`Rozdrvte hubové osivo ({V}) a rovnomerne ho premiešajte so substrátom (pomer približne 1:2 osivo k substrátu podľa objemu).`,`Voľne naplňte do pestovateľského vaku/nádoby s filtračnou záplatou alebo vetracími otvormi a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Zmesi kokosového vlákna a vermikulitu majú nízky obsah živín, takže dobre odolávajú kontaminácii — napriek tomu pracujte s čistými rukami/rukavicami a dezinfikovaným náradím.`},masters:{name:`Master's Mix — sójové šupky + tvrdé drevo (pelety)`,description:`Substrát s vysokým obsahom živín a vysokým výnosom pre gurmánske huby. Pomer ≈ 1 diel osiva : 1 diel substrátu podľa objemu.`,ratingNote:`Vynikajúce — zvyčajne najvyššie výnosy zo všetkých bežných receptov, no vyžaduje plnú sterilizáciu a čistú techniku.`,ingredients:[`Sójové šupkové pelety (suché)`,`Pelety z tvrdého dreva (suché)`,`Voda (na namočenie, prebytok sa odleje)`],steps:[`Zmiešajte {i0w} sójových šupkových peliet a {i1w} peliet z tvrdého dreva vo vedre.`,`Zalejte {i2v} vody a namáčajte 1 – 2 hodiny — pelety napučia a rozpadnú sa na textúru podobnú pilinám.`,`Dôkladne sceďte cez cedník/sieťové vrecko, kým z nich nekvapká voda (poľná kapacita). Toto je váš finálny hydratovaný substrát, cca {V}.`,`Sterilizujte hydratovaný substrát vo vakoch/pohároch pri 15 psi po dobu 90 minút (táto zmes je bohatá na živiny a vyžaduje plnú sterilizáciu, nie len pasterizáciu).`,`Nechajte úplne vychladnúť, potom rozdrvte hubové osivo ({V}) a dôkladne premiešajte v pomere približne 1:1 v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Uzavrite a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Master's Mix je bohatý na živiny, preto je náchylnejší na kontamináciu — dôrazne sa odporúča plná tlaková sterilizácia a technika čistého vzduchu.`},straw:{name:`Pasterizovaná slama`,description:`Klasický lacný substrát, typicky pre hlivu ustricovitú. Pomer ≈ 1 diel osiva : 4 diely slamy podľa objemu.`,ratingNote:`Veľmi dobré — rýchla kolonizácia a nízka cena, no výnosy sú nižšie než pri substrátoch obohatených živinami ako CVG či Master's Mix.`,ingredients:[`Nasekaná pšeničná/jačmenná slama (suchá)`,`Voda (na horúci pasterizačný kúpeľ)`],steps:[`Nasekajte alebo natrhajte slamu na kúsky 5 – 10 cm — cca {i0v} voľne naplnené ({i0w} sucháho materiálu).`,`Ponorte slamu v sieťovom vreci do horúcej vody pri 60 – 70 °C na 60 – 90 minút na pasterizáciu (použite približne {i1v} vody, dostatok na úplné ponorenie).`,`Vyberte a nechajte/vyžmýkajte odtiecť prebytočnú vodu — slama má byť vlhká, nie mokrá.`,`Nechajte vychladnúť na izbovú teplotu, potom rozdrvte hubové osivo ({V}) a preložte ho vrstvami slamy v pestovateľskom vaku (osivo-slama-osivo-slama...).`,`Prepichnite alebo prerežte malé vetracie otvory vo vaku a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Slama potrebuje len pasterizáciu (nie plnú sterilizáciu), keďže ide o substrát s nízkym obsahom živín — postačí horúca voda alebo parná pasterizácia s následnou čistou manipuláciou.`},manure:{name:`Kompostovaný hnoj`,description:`Bohatý substrát pre pečiarky/portobello huby. Pomer ≈ 1 diel osiva : 6 dielov kompostovaného substrátu podľa objemu.`,ratingNote:`Veľmi dobré pre druhy milujúce hnoj (pečiarka, portobello); zlá voľba pre drevomilné druhy ako hliva či shiitake.`,ingredients:[`Kompostovaný konský hnoj (vlhký, pripravený)`,`Sadra`,`Voda (na doladenie vlhkosti)`],steps:[`Začnite s dobre kompostovaným, vyzretým konským hnojom (nie čerstvým/horúcim) — cca {i0v} ({i0w}).`,`Primiešajte {i1w} sadry na zlepšenie štruktúry a zníženie lepkavosti.`,`Upravte vlhkosť pridaním až {i2v} vody, kým kompost pri stlačení nedrží pokope, ale nekvapká.`,`Pasterizujte kompost pri 60 – 65 °C počas 1 – 2 hodín (pasterizácia v podnose alebo parou), aby ste odstránili konkurentov a zachovali prospešné mikroorganizmy.`,`Nechajte vychladnúť na izbovú teplotu, potom rozdrvte hubové osivo ({V}) a dôkladne premiešajte do kompostu v pomere približne 1:6.`,`Naplňte podnosy alebo nádoby, po prerastení prekryte vrstvou zeminy (casing layer) a nechajte plodiť pri 21 – 24 °C v tme.`],hygiene:`Kompostovaný hnoj obsahuje prirodzené mikrobiálne spoločenstvo — pasterizujte (nesterilizujte), aby prospešní konkurenti zostali nažive a zároveň sa potlačili patogény.`},coffee:{name:`Použitá kávová usadenina`,description:`Substrát vhodný pre začiatočníkov z recyklovaného materiálu pre hlivu ustricovitú — proces prípravy kávy usadeninu už pasterizuje. Pomer ≈ 1 diel osiva : 2 diely usadeniny podľa objemu.`,ratingNote:`Dobré, veľmi nenáročná a nízkoriziková voľba pre začiatočníkov, no skromné výnosy — najlepšie použiť čerstvé a zmiešané so slamou alebo kokosovým vláknom pre objem.`,ingredients:[`Použitá (vylúhovaná) kávová usadenina, vychladnutá`],steps:[`Nazbierajte {i0w} čerstvo použitej kávovej usadeniny (ešte teplá z prípravy sa počíta ako pasterizovaná) a nechajte ju vychladnúť na izbovú teplotu v čistej, prikrytej nádobe.`,`Rozbite prípadné hrudky — usadenina má byť drobivá, nie zbitá.`,`V boxe s nehybným vzduchom alebo na čistom mieste rozdrvte hubové osivo ({V}) a dôkladne ho premiešajte do usadeniny v pomere približne 1:2.`,`Voľne naplňte do pestovateľského vaku/nádoby s filtračnou záplatou alebo vetracími otvormi — nezhutňujte, kávová usadenina potrebuje prevzdušnenie.`,`Nechajte prerásť v tme pri 21 – 24 °C. Pre najnižšie riziko kontaminácie použite usadeninu do jedného-dvoch dní od prípravy kávy.`],hygiene:`Teplo z prípravy kávy (takmer 90 °C+) spolu s prirodzenou kyslosťou kávy dávajú tomuto substrátu solídnu prirodzenú odolnosť voči kontaminácii — stačí udržiavať nádoby a ruky čisté a používať čerstvú usadeninu.`},cardboard:{name:`Kartónový substrát`,description:`Lacný, jednoduchý substrát pre začiatočníkov z nastrihaného vlnitého kartónu — vhodný na skúšobné pokusy a menšie projekty s hlivou. Pomer ≈ 1 diel osiva : 3 diely namočeného kartónu podľa objemu.`,ratingNote:`Priemerné — veľmi lacné a ľahko dostupné, no nízka hustota živín znamená menšie a pomalšie úrody než pri dedikovaných substrátoch. Vhodné na učenie, nie na seriózne výnosy.`,ingredients:[`Nastrihaný jednoduchý vlnitý kartón (suchý, bez potlače/lepiacej pásky)`,`Voda (na namočenie/pasterizáciu)`],steps:[`Odstráňte všetku lepiacu pásku, štítky a lesklé potlačené časti, potom natrhajte alebo nastrihajte {i0w} jednoduchého vlnitého kartónu na pásiky.`,`Ponorte do {i1v} horúcej vody (60 – 70 °C) na 60 – 90 minút na pasterizáciu a zmäkčenie.`,`Sceďte a jemne vyžmýkajte prebytočnú vodu, kým nie je vlhký, ale nekvapká.`,`Nechajte vychladnúť na izbovú teplotu, potom rozdrvte hubové osivo ({V}) a preložte ho medzi pásiky kartónu v pestovateľskom vaku.`,`Prepichnite malé vetracie otvory vo vaku a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Používajte len jednoduchý hnedý kartón — tlačová farba a lesklé povrchy môžu brzdiť rast alebo priniesť kontamináciu. Pri tomto substráte s nízkym obsahom živín postačí pasterizácia (nie plná sterilizácia).`},sawdust:{name:`Blok na pilinách (tvrdé drevo + otruby)`,description:`Tradičný substrát pre drevomilné druhy ako shiitake, reishi a ježovec — piliny z tvrdého dreva doplnené pšeničnými otrubami. Pomer ≈ 1 diel osiva : 4 diely substrátu podľa objemu.`,ratingNote:`Vynikajúce pre drevomilné druhy — pomalšia kolonizácia než pri substrátoch priateľských k obilninám, no husté bloky poskytujú dlhú, produktívnu plodnosť.`,ingredients:[`Piliny z tvrdého dreva (suché, nežživičnaté)`,`Pšeničné otruby`,`Voda (na hydratáciu)`],steps:[`Zmiešajte {i0w} pilín z tvrdého dreva (dub, javor, buk — vyhnite sa živičnatým mäkkým drevinám) s {i1w} pšeničných otrúb vo veľkej nádobe.`,`Postupne primiešajte {i2v} vody, kým nedosiahnete poľnú kapacitu (skúška stlačením: uvoľní sa pár kvapiek, žiadny súvislý prúd).`,`Natesno naplňte do teplovzdorných vakov alebo pohárov — bloky z pilín sú husté, preto sterilizujte tlakovo pri 15 psi (121 °C) 2 – 2,5 hodiny (dlhšie než pri voľnejších substrátoch).`,`Nechajte úplne vychladnúť, potom rozdrvte hubové osivo ({V}) a dôkladne premiešajte v pomere približne 1:4 v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Uzavrite a nechajte prerásť v tme pri 21 – 24 °C — tento substrát je hustejší a zvyčajne trvá dlhšie (3 – 5+ týždňov) než substráty na báze obilia.`],hygiene:`Pridanie otrúb robí tento substrát bohatým na živiny a náchylným na kontamináciu — plná tlaková sterilizácia s predĺženým časom je nevyhnutná kvôli hustote napchaných pilín.`}},lc:{lme:{name:`Sirup zo svetlého sladového extraktu (LME) — 4 %`,description:`Najbežnejší recept tekutej kultúry. Jemný, spoľahlivý zdroj živín pre rast mycélia.`,ratingNote:`Vynikajúce — najpoužívanejší a najspoľahlivejší recept tekutej kultúry so stabilným, energickým rastom.`,ingredients:[`Svetlý sladový extrakt (LME)`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Rozpustite {i0w} svetlého sladového extraktu asi v polovici vody za mierneho hriatia a miešania, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na cca 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom na výmenu vzduchu.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút. Nechajte úplne vychladnúť na izbovú teplotu pred manipuláciou.`,`V boxe s nehybným vzduchom alebo laminárnom boxe vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) cez injekčný port sterilnou striekačkou.`,`Nechajte prerásť pri 21 – 27 °C, občas jemne pošúchajte. Rast mycélia sa prejaví ako chumáčovité biele oblaky do 3 – 10 dní.`],hygiene:`Vyhoďte akýkoľvek pohár, ktorý sa nerovnomerne zakalí/sfarbí, kysne alebo hnije, alebo vykazuje farebné (zelené/čierne/ružové) škvrny — príznaky kontaminácie.`},honey:{name:`Medová voda — 4 %`,description:`Jednoduchá alternatíva k sladovému extraktu zo špajze, podobná koncentrácia živín.`,ratingNote:`Veľmi dobré — jednoduchá voľba zo špajze so solídnym rastom, no o niečo náchylnejšia na kontamináciu než LME.`,ingredients:[`Surový med`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Zohrejte asi polovicu vody a vmiešajte {i0w} surového medu, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým neuvidíte chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Medová voda môže byť o niečo náchylnejšia na kontamináciu než LME — vždy použite surový (nie priemyselne spracovaný) med a dôkladne sterilizujte.`},cornsyrup:{name:`Svetlý kukuričný sirup — 3 %`,description:`Lacná, ľahko dostupná alternatíva s o niečo nižšou koncentráciou živín.`,ratingNote:`Veľmi dobré — lacné, účinné a porovnateľné výkonom s medovou vodou.`,ingredients:[`Svetlý kukuričný sirup`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} svetlého kukuričného sirupu do teplej vody, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým sa neobjaví chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Vyhoďte akýkoľvek pohár s nerovnomerným zakalením, čudnými farbami alebo zlým zápachom — príznaky bakteriálnej alebo plesňovej kontaminácie.`},dextrose:{name:`Dextrózový sirup — 4 %`,description:`Čistá jednoduchá cukrová tekutá kultúra z dextrózového (glukózového) prášku — veľmi konzistentná, na rozpustenie netreba variť.`,ratingNote:`Veľmi dobré — veľmi konzistentné, keďže ide o čistý cukor, no mycélium môže rásť o niečo tenšie než pri sladových receptoch.`,ingredients:[`Dextrózový (glukózový) prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} dextrózového prášku do teplej vody, kým sa úplne nerozpustí (rozpúšťa sa ľahko, netreba silno zahrievať).`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým sa neobjaví chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Dextrózový roztok je čistý nielen pre mycélium, ale aj pre kontaminanty — dôkladne sterilizujte a inokulujte čistou technikou.`},potatodextrose:{name:`Zemiakovo-dextrózová tekutina — 20 % zemiak / 2 % dextróza`,description:`Bližšie k nutričnému profilu PDA; dobrá voľba, ak už pracujete so zemiakovými médiami.`,ratingNote:`Veľmi dobré — blízko kopíruje nutričný profil PDA a dáva energický rast, no vyžaduje viac prípravy než cukrové sirupy.`,ingredients:[`Ošúpaný zemiak (nakrájaný)`,`Dextróza (glukóza)`,`Voda (na varenie + doplnenie objemu)`],steps:[`Ošúpte a nakrájajte {i0w} zemiakov, potom varte vo väčšine vody 20 – 30 minút, kým nezmäknú.`,`Sceďte zemiakové kúsky, ponechajte len výluh. Rozpustite v ňom {i1w} dextrózy, kým je ešte teplý.`,`Doplňte vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe a nechajte prerásť pri 21 – 27 °C, kým sa neobjaví chumáčovitý biely rast (3 – 10 dní).`],hygiene:`Zemiakové tekutiny sú bohaté na živiny a náchylnejšie na kontamináciu — dôkladne sterilizujte a udržujte veľmi čistú techniku pri injektovaní.`},brownsugar:{name:`Sirup z hnedého cukru — 4 %`,description:`Rozpočtová tekutá kultúra zo špajze s hnedým cukrom — o stupeň jednoduchšia než LME, ale veľmi lacná a účinná.`,ratingNote:`Dobrá rozpočtová voľba — funguje spoľahlivo, hoci rast je zvyčajne o niečo menej energický než pri sladových receptoch.`,ingredients:[`Hnedý cukor`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} hnedého cukru do teplej vody, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým sa neobjaví chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Obsah melasy v hnedom cukre môže sirup mierne stmaviť a sťažiť včasné rozpoznanie kontaminácie — dôkladne kontrolujte a sterilizujte.`},maple:{name:`Javorový sirup — 4 %`,description:`Improvizovaná tekutá kultúra s čistým javorovým sirupom — jeho prirodzený obsah minerálov môže mierne zvýšiť vitalitu oproti obyčajným cukrovým sirupom.`,ratingNote:`Dobrá alternatíva zo špajze — stopové minerály môžu pomôcť vitalite, no čistý javorový sirup je drahšia voľba.`,ingredients:[`Čistý javorový sirup (nie palacinkový sirup)`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} čistého javorového sirupu do teplej vody, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým sa neobjaví chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Používajte len čistý javorový sirup — napodobenina "palacinkového sirupu" je väčšinou kukuričný sirup s prísadami bez prínosu. Sterilizujte dôkladne ako pri každom cukrovom médiu.`},wort:{name:`Domáci sladový mladinkový výluh (jačmeň)`,description:`Plne improvizovaná tekutá kultúra pripravená lúhovaním drveného sladovaného jačmeňa (ako mini pivovarská vystieranka) namiesto kupovaného sladového extraktu.`,ratingNote:`Vynikajúce — v podstate domáci sladový extrakt, výkon takmer identický s LME, keď zvládnete techniku vystierania.`,ingredients:[`Drvený sladovaný jačmeň`,`Voda (na lúhovanie + doplnenie objemu)`],steps:[`Zohrejte väčšinu vody na 65 – 68 °C (použite teplomer — tento rozsah premieňa škrob na cukor bez zničenia enzýmov).`,`Vmiešajte {i0w} drveného sladovaného jačmeňa a držte pri 65 – 68 °C 60 minút, občas premiešajte (toto je mini "vystierka").`,`Precedite cez sieťové vrecko alebo gázu, ponechajte len sladkú tekutinu (mladinu). Doplňte vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe a nechajte prerásť pri 21 – 27 °C, kým sa neobjaví chumáčovitý biely rast (3 – 10 dní).`],hygiene:`Teplotu vystierania starostlivo dodržujte — príliš horúca zničí enzymatickú konverziu, príliš studená dá priestor baktériám pred sterilizáciou.`}},agar:{mea:{name:`Sladový agar (MEA)`,description:`Najobľúbenejší domáci agar pre prácu s kultúrami húb — jemná úroveň živín, ľahko sa leje a číta.`,ratingNote:`Vynikajúce — zlatý štandard pre domácu prácu s kultúrami, spoľahlivý a ľahko čitateľný.`,ingredients:[`Svetlý sladový extrakt (LME)`,`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Skombinujte {i0w} svetlého sladového extraktu a {i1w} agar-agar prášku s vodou (celkovo {V}) v teplovzdornej banke alebo pohári.`,`Premiešajte, potom zohrejte/varte 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí (tekutina zosvetlie, žiadny zrnitý prášok).`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté) — nenechajte úplne stuhnúť v nádobe.`,`V boxe s nehybným vzduchom alebo laminárnom boxe nalejte tenkú vrstvu (cca 20 – 25 ml na štandardnú 90 mm misku) do sterilných Petriho misiek, jemne pokrúťte na pokrytie dna.`,`Nechajte viečka pootvorené, kým agar stuhne a vychladne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Pred liatím utrite pracovnú plochu izopropylalkoholom a lejte rýchlo po otvorení misiek, aby ste minimalizovali vystavenie vzdušnej kontaminácii.`},pda:{name:`Zemiakovo-dextrózový agar (PDA)`,description:`Klasický mykologický štandard z pravého zemiakového výluhu — skvelý na pozorovanie charakteristík mycélia.`,ratingNote:`Vynikajúce — mykologicky štandardná receptúra, skvelá vitalita a ideálna na pozorovanie rastových charakteristík.`,ingredients:[`Ošúpaný zemiak (nakrájaný)`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na varenie + doplnenie objemu)`],steps:[`Ošúpte a nakrájajte {i0w} zemiakov, potom varte vo väčšine vody 20 – 30 minút, kým nezmäknú.`,`Sceďte kúsky, ponechajte len výluh. Doplňte vodou späť na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`PDA je bohatý na živiny, preto je náchylnejší na bakteriálnu kontamináciu — dôkladne sterilizujte a lejte veľmi čistou technikou.`},mya:{name:`Sladovo-kvasnicový agar (MYA)`,description:`MEA vylepšený o malé množstvo nutričných/pivovarníckych kvasníc pre o niečo rýchlejší a energickejší rast mycélia.`,ratingNote:`Vynikajúce — pridané kvasnice zjavne urýchľujú a posilňujú rast oproti obyčajnému MEA.`,ingredients:[`Svetlý sladový extrakt (LME)`,`Nutričné/pivovarnícke kvasnice`,`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Skombinujte {i0w} svetlého sladového extraktu, {i1w} nutričných kvasníc a {i2w} agar-agar prášku s vodou (celkovo {V}).`,`Premiešajte, potom zohrejte/varte 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Pridané kvasnice robia toto médium bohatším — lejte rýchlo a udržujte pracovnú plochu čerstvo dezinfikovanú, aby ste predišli kontaminácii.`},honeyagar:{name:`Medový agar`,description:`Agar zo špajze so surovým medom namiesto sladového extraktu — jednoduchá voľba, ak nemáte poruke LME.`,ratingNote:`Dobrá záložná voľba, keď nie je LME poruke, hoci gél časom rýchlejšie mäkne.`,ingredients:[`Surový med`,`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Rozpustite {i1w} agar-agar prášku vo vode (celkovo {V}) a priveďte k varu na 1 – 2 minúty za miešania, kým sa úplne nerozpustí.`,`Odstavte z ohňa a vmiešajte {i0w} surového medu, kým sa nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Med môže časom agar mierne zmäkčiť — misky použite do pár týždňov a skladujte v chlade. Sterilizujte dôkladne ako pri každom cukrovom médiu.`},ricewater:{name:`Ryžový agar (RWA)`,description:`Lacný, hojne používaný improvizovaný agar zo škrobovej ryžovej vody — bežná náhrada bez sladového extraktu.`,ratingNote:`Dobrá rozpočtová improvizovaná voľba — solídny rast na izolačnú prácu, no menej energický než MEA/PDA.`,ingredients:[`Nevarená biela ryža`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na varenie + doplnenie objemu)`],steps:[`Povarte {i0w} nevarenej ryže vo väčšine vody 15 – 20 minút, kým voda nezhustne a nezakalí sa škrobom — ryža nesmie úplne rozpadnúť.`,`Sceďte ryžu, ponechajte len škrobovú vodu. Doplňte vodou späť na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Ryžový škrob podporuje kontaminanty rovnako ochotne ako mycélium — dôkladne sterilizujte a nevynechajte tlakovú sterilizáciu, aj keď ingrediencie vyzerajú "ako obyčajné jedlo".`},coconutwater:{name:`Kokosovo-vodný agar (CWA)`,description:`Improvizovaný agar s nesladenou kokosovou vodou ako základnou tekutinou — prirodzene obsahuje cukry a minerály.`,ratingNote:`Dobrá improvizovaná voľba — prirodzene takmer sterilná tekutina so slušným obsahom minerálov, no menej rafinovaný rast než pri MEA.`,ingredients:[`Nesladená kokosová voda`,`Dextróza (glukóza)`,`Agar-agar prášok`],steps:[`Nalejte {i0v} nesladenej kokosovej vody (čistej, bez pridaného cukru/príchute) do teplovzdornej banky alebo pohára.`,`Vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku, potom priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Používajte čistú, nesladenú, najlepšie pasterizovanú kokosovú vodu — ochutené alebo sladené verzie sa ľahšie kontaminujú a môžu brzdiť mycélium.`},plainwater:{name:`Vodný agar (PWA)`,description:`Holý improvizovaný agar bez pridaných živín — užitočný na kontrolu klíčenia spór a izoláciu čistého tkaniva od rýchlejšie rastúcich kontaminantov.`,ratingNote:`Priemerný celkový výkon — zámerne pomalý, tenký rast, ale cenný špecificky pre čistú izoláciu a klíčenie.`,ingredients:[`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} agar-agar prášku do {V} vody v teplovzdornej banke alebo pohári.`,`Priveďte k miernemu varu na 1 – 2 minúty za stáleho miešania, kým sa agar úplne nerozpustí (tekutina zosvetlie).`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Bez pridaných živín majú rýchlo rastúce kontaminanty menšiu výhodu — vhodné na izoláciu čistého mycélia, no rast bude pomalší a tenší než na MEA/PDA.`},banana:{name:`Banánový agar (BA)`,description:`Improvizovaný agar z rozmixovaného zrelého banánu — obľúbená ovocná voľba s dobrým obsahom prirodzených cukrov.`,ratingNote:`Dobrá improvizovaná voľba — zrelé banány poskytujú solídne cukry, no dávky môžu byť o niečo zakalenejšie/menej čisté než MEA.`,ingredients:[`Zrelý banán (rozmixovaný)`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na mixovanie + doplnenie objemu)`],steps:[`Rozmixujte {i0w} ošúpaného zrelého banánu s asi tretinou vody dohladka.`,`Precedite cez gázu alebo jemné sitko na odstránenie dužinových vlákien, ponechajte tekutinu. Doplňte zvyšnou vodou na celkový objem {V}.`,`Vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku, potom priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Používajte úplne zrelé (ale nie plesnivé) banány a dôkladne precedite — zvyšné dužinové vlákna môžu zachytávať vzduchové bubliny a sťažiť včasné rozpoznanie kontaminácie.`},carrot:{name:`Mrkvový agar (CA)`,description:`Improvizovaný agar s vyvareným mrkvovým výluhom namiesto zemiaka — bežná začiatočnícka náhrada za PDA.`,ratingNote:`Dobrá improvizovaná voľba — mierny, pre začiatočníkov príjemný nutričný profil, bežne používaný na izolačnú prácu.`,ingredients:[`Mrkva (nakrájaná)`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na varenie + doplnenie objemu)`],steps:[`Nakrájajte {i0w} mrkvy a varte vo väčšine vody 20 – 30 minút, kým nezmäkne.`,`Sceďte kúsky, ponechajte len mrkvový výluh. Doplňte vodou späť na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Mrkvové výluhy majú mierny obsah živín — sterilizujte štandardne dôkladne, no počítajte s o niečo pomalšou kolonizáciou než pri bohatších médiách ako PDA.`},beerwort:{name:`Pivný mladinkový agar (domáci slad)`,description:`Plne improvizovaný agar pripravený lúhovaním drveného sladovaného jačmeňa do domácej mladiny, následne stuženej agarom — bez potreby kupovaného sladového extraktu.`,ratingNote:`Vynikajúce — v podstate domáci MEA, keď zvládnete techniku vystierania, s veľmi podobným výkonom.`,ingredients:[`Drvený sladovaný jačmeň`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na lúhovanie + doplnenie objemu)`],steps:[`Zohrejte väčšinu vody na 65 – 68 °C, potom vmiešajte {i0w} drveného sladovaného jačmeňa. Držte pri 65 – 68 °C 45 – 60 minút, občas premiešajte.`,`Precedite cez sieťové vrecko alebo gázu, ponechajte len sladkú mladinu. Doplňte vodou na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Starostlivo dodržujte teplotu vystierania pre správnu premenu škrobu na cukor a následne dôkladne sterilizujte — rovnaká starostlivosť ako pri tekutej verzii tohto receptu.`}},grain:{rye:{name:`Raž (zrno)`,description:`Klasické a najpoužívanejšie osivové zrno — malé, rovnomerné a spoľahlivé pre takmer každý gurmánsky druh.`,ratingNote:`Vynikajúce — zlatý štandard osivového zrna: stabilná kolonizácia a široká kompatibilita takmer s každým druhom.`,ingredients:[`Suché ražné zrno`,`Voda (na namáčanie a varenie)`,`Sadra (síran vápenatý)`],steps:[`Odmerajte {i0v} ({i0w}) suchého ražného zrna a dôkladne prepláchnite v cedníku, kým voda nebude čistá.`,`Namáčajte v {i1v} vody 12 – 24 hodín pri izbovej teplote, potom jemne varte 10 – 15 minút, kým sa šupky mierne nepopraskajú — vyhnite sa prudkému varu, ktorý zrná roztrhne a zvyšuje riziko kontaminácie.`,`Dôkladne sceďte v cedníku 15 – 20 minút a nechajte povrch mierne oschnúť, potom primiešajte {i2w} sadry na obmedzenie zlepovania.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte v tlakovom hrnci pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte cez injekčný port v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte, aby sa očkovací bod rozšíril po celom pohári, a nechajte prerásť v tme pri 21 – 24 °C (zvyčajne 1 – 3 týždne).`],hygiene:`Raž má vysoký obsah živín a patrí medzi náchylnejšie osivá na kontamináciu — dôkladne ju sceďte (mokré poháre sú najčastejšou príčinou „kyslého" osiva) a nekráťte čas sterilizácie.`},wheatberries:{name:`Pšenica (zrno)`,description:`Blízka alternatíva k raži s podobnou veľkosťou a obsahom škrobu — použite to, čo je lacnejšie alebo dostupnejšie.`,ratingNote:`Vynikajúce — funguje takmer identicky ako raž, skvelá náhrada, keď raž nie je dostupná.`,ingredients:[`Suché pšeničné zrno`,`Voda (na namáčanie a varenie)`,`Sadra (síran vápenatý)`],steps:[`Odmerajte {i0v} ({i0w}) suchého pšeničného zrna a dôkladne prepláchnite, kým voda nebude čistá.`,`Namáčajte v {i1v} vody 12 – 24 hodín, potom jemne varte 10 – 15 minút, kým sa šupky mierne nepopraskajú.`,`Dôkladne sceďte 15 – 20 minút a nechajte povrch mierne oschnúť, potom primiešajte {i2w} sadry.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút a po úplnom vychladnutí naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte na rozšírenie očkovania a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Podobne ako raž, aj pšenica je bohatá na živiny a náchylná na „kyslé" osivo, ak zostane príliš mokrá — dôkladne sceďte a dodržte celý čas sterilizácie.`},oats:{name:`Ovos (celé zrno)`,description:`Zrno s mäkšou šupkou, ktoré kolonizuje o niečo rýchlejšie ako raž, hoci po hydratácii je šupka krehkejšia.`,ratingNote:`Veľmi dobré — rýchla kolonizácia, ale po hydratácii zaobchádzajte opatrne, šupka sa ľahšie rozpadáva.`,ingredients:[`Celé ovsené zrno`,`Voda (na namáčanie a varenie)`,`Sadra (síran vápenatý)`],steps:[`Odmerajte {i0v} ({i0w}) celého ovsa a dôkladne prepláchnite, kým voda nebude väčšinou čistá.`,`Namáčajte v {i1v} vody 8 – 12 hodín (ovos hydratuje rýchlejšie ako raž), potom jemne varte 5 – 10 minút, kým nebude práve mäkký — sledujte pozorne, ovos sa rýchlo rozvarí.`,`Dôkladne sceďte a zaobchádzajte opatrne — zmäknutá šupka sa ľahko trhá. Keď je povrch väčšinou suchý, primiešajte {i2w} sadry.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Jemne pretrepte a nechajte prerásť v tme pri 21 – 24 °C — ovos zvyčajne prerastie o niekoľko dní rýchlejšie ako raž.`],hygiene:`Ovos hydratuje a rozvarí sa rýchlejšie ako raž — radšej varte kratšie, pretože rozvarené zrno sa horšie sceďuje a ľahšie kontaminuje.`},popcorn:{name:`Pukancová kukurica (celé zrno)`,description:`Lacné a bežne dostupné hromadné osivo — obyčajné neochutené pukancové zrná, nie mikrovlnné vrecko.`,ratingNote:`Dobré — lacné a ľahko dostupné, hoci kolonizácia je o niečo menej konzistentná ako pri raži.`,ingredients:[`Suché pukancové zrná`,`Voda (na namáčanie a varenie)`],steps:[`Odmerajte {i0v} ({i0w}) suchých pukancových zŕn (obyčajných, neochutených) a dôkladne prepláchnite.`,`Namáčajte v {i1v} vody 24 hodín, potom jemne varte 15 – 20 minút, kým zrná nenabobtnajú a šupka sa mierne nepopraská — nedovoľte, aby vypukali.`,`Dôkladne sceďte v cedníku 15 – 20 minút, kým na dne nezostane žiadna voda.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Tvrdá šupka pukancov dobre znáša manipuláciu, ale pred naplnením pohárov sa uistite, že sú zrná hydratované až po stred — tvrdé suché jadro neprerastie.`},millet:{name:`Proso`,description:`Malé okrúhle zrno obľúbené pre veľký povrch osiva — mnoho malých zŕn rýchlo rozšíri kolonizáciu do substrátu.`,ratingNote:`Dobré — vynikajúci povrch pre osivo substrátu, ale ľahko sa rozvarí na kašu, ak sa dlho varí.`,ingredients:[`Suché proso`,`Voda (na namáčanie a varenie)`],steps:[`Odmerajte {i0v} ({i0w}) suchého prosa a dôkladne prepláchnite v jemnom site.`,`Namáčajte v {i1v} vody 8 – 12 hodín, potom jemne varte iba 5 – 8 minút — proso je malé a varí sa rýchlo, sledujte pozorne, aby sa nerozvarilo na kašu.`,`Dôkladne sceďte a nechajte krátko oschnúť na povrchu pred naplnením pohárov.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Dôkladne pretrepte — mnoho malých zŕn prosa rýchlo rozšíri očkovacie body — a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Malá veľkosť prosa znamená, že sa rozvarí za minúty, nie desiatky minút — rozvarené, rozbité zrno sa horšie sceďuje a je oveľa náchylnejšie na kontamináciu.`},sorghum:{name:`Cirok (milo)`,description:`Lacné hromadné zrno, často predávané ako krmivo pre vtáky — solídna rozpočtová voľba podobnej veľkosti ako proso.`,ratingNote:`Dobré — veľmi cenovo dostupné a bežne dostupné, so solídnou kolonizáciou po správnej hydratácii.`,ingredients:[`Suchý cirok (milo)`,`Voda (na namáčanie a varenie)`],steps:[`Odmerajte {i0v} ({i0w}) suchého ciroku (milo) a dôkladne prepláchnite, pri hromadnom krmive pre vtáky vyberte prípadné nečistoty.`,`Namáčajte v {i1v} vody 12 – 24 hodín, potom jemne varte 10 – 15 minút, kým zrná nenabobtnajú a šupka sa mierne nepopraská.`,`Dôkladne sceďte v cedníku 15 – 20 minút.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Ak cirok kupujete ako hromadné „krmivo pre vtáky", skontrolujte vrecko na iné primiešané druhy zŕn a vyberte ich — jednotné zrno kolonizuje rovnomernejšie.`}},species:{oyster:{name:`Hliva ustricovitá (Pleurotus ostreatus)`,description:`Klasický druh pre začiatočníkov — rýchly, odpúšťajúci chyby a produktívny na takmer akomkoľvek lacnom substráte.`,ratingNote:`Vynikajúce — najodpúšťajúcejší a najspoľahlivejší druh na prvé pestovanie, znáša aj nie úplne ideálne podmienky.`},pinkOyster:{name:`Ružová hliva (Pleurotus djamor)`,description:`Rýchlo rastúca, teplomilná príbuzná hlivy s výraznou ružovou farbou — rýchlo tvorí zárodky, ale po zbere má krátku trvanlivosť.`,ratingNote:`Veľmi dobré — veľmi rýchly rast a nápadná farba, no plodnice sa kazia už do jedného-dvoch dní, počítajte s rýchlym spracovaním.`},kingOyster:{name:`Hliva kráľovská (Pleurotus eryngii)`,description:`Hrubé, mäsité stopky a jemnejšia chuť ako pri iných hlivách — cenená pre textúru, no pomalšia a náročnejšia na chladnejšie plodenie.`,ratingNote:`Veľmi dobré — výborná textúra a trvanlivosť, no potrebuje chladnejšie plodenie a nižšiu výmenu vzduchu ako väčšina hlív.`},lionsMane:{name:`Ježovec bahňanský (Hericium erinaceus)`,description:`Výrazná strapatá biela plodnica bez skutočného klobúka a lupeňov — obľúbená pre textúru pripomínajúcu morské plody a kulinárske/nutraceutické využitie.`,ratingNote:`Vynikajúce — spoľahlivý a vďačný druh, no potrebuje silnú výmenu vzduchu, inak rastú tŕnisté a zakrpatené plodnice namiesto plných „zubov".`},shiitake:{name:`Shiitake (Lentinula edodes)`,description:`Pomaly kolonizujúci drevomilný druh, ktorý zvyčajne potrebuje po úplnom prerastení bloku studený namáčací šok na spustenie tvorby zárodkov.`,ratingNote:`Veľmi dobré — vynikajúca chuť a trvanlivosť, ale zo všetkých tu uvedených druhov najpomalšie kolonizuje aj plodí, treba trpezlivosť.`},reishi:{name:`Reishi (Ganoderma lucidum)`,description:`Odolná, teplomilná choroška pestovaná pre drevnatú, liečivú plodnicu, nie na priamu konzumáciu — zvyčajne sa suší a extrahuje.`,ratingNote:`Dobré — veľmi odpúšťajúci a odolný voči kontaminácii druh, ale pomalý, s jedným dlhým cyklom plodenia namiesto rýchlych opakovaných vĺn.`},wineCap:{name:`Stropharia obrovská (Stropharia rugosoannulata)`,description:`Vitálny, chladuvzdorný druh známy najmä z vonkajších záhonov na slame alebo drevnej štiepke — dobrá nenáročná voľba po založení vonku.`,ratingNote:`Dobré — vonku sa mu darí takmer bez zásahov, no pestovanie v boxoch/nádobách je menej predvídateľné ako pri ostatných druhoch tu.`},buttonAgaricus:{name:`Pečiarka dvojvýtrusná / Portobello (Agaricus bisporus)`,description:`Supermarketová huba — na rozdiel od drevomilných druhov vyššie potrebuje kompostovaný hnojový substrát prekrytý krycou vrstvou zeminy, aby vytvorila zárodky.`,ratingNote:`Dobré — veľmi vďačný druh, keď zvládnete kompost a krycí materiál, ale technicky najnáročnejší druh na začatie doma od nuly.`},turkeyTail:{name:`Outkovka pestrá (Trametes versicolor)`,description:`Tenká, farebná drevokazná choroška pestovaná skôr pre liečivý extrakt než ako stolová huba — na vytvorenie pásikavých, vejárovitých klobúkov potrebuje svetlo.`,ratingNote:`Veľmi dobré — odolná voči kontaminácii na tvrdom dreve, ale pomalá a pestuje sa skôr na jednu väčšiu vlnu než na čerstvú konzumáciu.`},chestnut:{name:`Šupinovka gaštanová (Pholiota adiposa)`,description:`Trsnatá, orieškovej chuti drevomilná huba s pevnou textúrou, ktorá dobre znáša tepelnú úpravu — menej bežná ako hliva či shiitake, no pestuje sa podobne priamočiaro.`,ratingNote:`Dobré — spoľahlivé trsnaté vlny na doplnených pilinách, kolonizácia je však o niečo pomalšia ako pri hlivách.`},enoki:{name:`Zimník sametonohý / Enoki (Flammulina velutipes)`,description:`Pestuje sa v chlade, tme a pri obmedzenej výmene vzduchu, aby vznikli dlhé, bledé, tenké stopky známe zo supermarketu — postup výrazne odlišný od väčšiny gurmánskych druhov.`,ratingNote:`Priemerné — biologicky sa ľahko kolonizuje, no na dosiahnutie klasického dlhého tvaru je potrebná chladná plodiaca komora a golier, čo začiatočníkov často zaskočí.`},cordyceps:{name:`Kordyceps vojenský (Cordyceps militaris)`,description:`Oranžový, paličkovitý druh, ktorý plodí priamo z pretraseného pohára zrna alebo ryže bez klasického objemového substrátu — cenený pre doplnkové/nutraceutické využitie.`,ratingNote:`Priemerné — kolonizácia je nenáročná, no na dobrú farbu a hustotu plodníc potrebuje presný svetelný cyklus a chladnejšie plodenie.`},maitake:{name:`Trsnatec lupeňovitý / Maitake (Grifola frondosa)`,description:`Cenená, výrazne chutná choroška, ktorá namiesto samostatných húb tvorí jednu hustú ružicu prekrývajúcich sa klobúkov — povestne náročná na podmienky plodenia.`,ratingNote:`Priemerné — keď sa podarí, je veľmi vďačná, no tvorba zárodkov je nekonzistentná a často pomáha krycia vrstva zeminy, ktorú ostatné druhy tu nepotrebujú.`},morel:{name:`Smrž (Morchella spp.)`,description:`Cenený druh s medovníkovitým klobúkom, ktorý sa bežne pestuje vonku v záhonoch s výživovými vreckami, nie v boxoch vo vnútri — patrí medzi najťažšie huby na spoľahlivé doplodenie doma.`,ratingNote:`Slabé pre začiatočníkov — aj skúsení pestovatelia majú nekonzistentnú, nízku mieru tvorby zárodkov; akúkoľvek úrodu berte ako bonus, nie istotu.`}},culinaryRecipes:{oyster:{sauteed:{name:`Hliva na masle s cesnakom`,description:`Najjednoduchší spôsob, ako vyzdvihnúť chuť hlivy — vysoká teplota, maslo, cesnak.`,ingredients:[`250 g hlivy ustricovitej, natrhanej na prúžky`,`2 PL masla`,`2 strúčiky cesnaku, nasekané`,`Soľ a čierne korenie`,`Čerstvá petržlenová vňať, nasekaná (voliteľné)`],steps:[`Hlivu natrhajte po vláknach na kúsky vhodné na jedno sústo.`,`Na suchej panvici na strednom až vysokom ohni najprv opekajte huby bez masla asi 3–4 minúty, aby sa odparila vlhkosť.`,`Pridajte maslo a cesnak a opekajte ďalších 3–4 minúty dozlata.`,`Osoľte, opepite, posypte petržlenovou vňaťou a ihneď podávajte.`],benefits:[`Nízkokalorické a pred pridaním masla prirodzene nízkotučné`,`Dobrý zdroj vitamínov skupiny B a draslíka`,`Obsahuje vlákninu vrátane beta-glukánov`]},soup:{name:`Krémová polievka z hlivy ustricovitej`,description:`Hustá mixovaná polievka, ktorá premení veľkú úrodu hlivy na zahrievajúce jedlo.`,ingredients:[`400 g hlivy ustricovitej, nahrubo nakrájanej`,`1 cibuľa, nadrobno nakrájaná`,`2 strúčiky cesnaku, nasekané`,`500 ml zeleninového alebo kuracieho vývaru`,`150 ml smotany`,`2 PL masla`,`Soľ a korenie`],steps:[`Na masle opražte cibuľu a cesnak dozmäka, asi 5 minút.`,`Pridajte huby a varte, kým nepustia šťavu a nezačnú sa opekať, 8–10 minút.`,`Zalejte vývarom, priveďte do varu a varte 10 minút.`,`Rozmixujte dohladka (alebo nechajte hrubšie), vmiešajte smotanu a dochuťte.`,`Jemne ohrejte bez varu a podávajte horúce.`],benefits:[`Zahrievajúce, sýte jedlo, ktoré je prirodzene bez cholesterolu`,`Dobrý zdroj vitamínov skupiny B z húb`,`Cibuľa a cesnak prispievajú alicínovými zlúčeninami`]}},pinkOyster:{crispy:{name:`Chrumkavé vyprážané prúžky z ružovej hlivy`,description:`Vysoká teplota vyprá tenké lupienky ružovej hlivy do dymovej, slaninovej chrumkavosti.`,ingredients:[`250 g ružovej hlivy, natrhanej na prúžky`,`1 PL oleja`,`1 ČL údenej papriky`,`1 ČL sójovej omáčky`,`Štipka soli`],steps:[`Huby natrhajte na tenké prúžky pozdĺž prirodzených rebier.`,`Premiešajte s olejom, údenou paprikou a sójovou omáčkou.`,`Vyprážajte na horúcej panvici v jednej vrstve, bez preplnenia, kým nie sú chrumkavé a opečené z oboch strán, spolu 6–8 minút.`,`Nechajte chvíľu odkvapkať na papierovej utierke, mierne osoľte a podávajte teplé.`],benefits:[`Pred vyprážaním prirodzene nízkotučné`,`Dobrý zdroj draslíka a vitamínov skupiny B`,`Rastlinná, menej tučná alternatíva k slanine v jedle`]},tacos:{name:`Tacos s ružovou hlivou`,description:`Ružová farba pri varení vybledne, no mäsitá, ťahaná textúra sa skvele hodí do tacos.`,ingredients:[`300 g ružovej hlivy, ručne natrhanej na vlákna`,`1 PL oleja`,`1 ČL rasce`,`1 ČL čili korenia`,`Šťava z 1 limetky`,`Malé tortilly`,`Toppingy: nadrobno nakrájaná cibuľa, koriander, salsa`],steps:[`Huby natrhajte rukami na hrubšie vlákna pripomínajúce ťahané mäso.`,`Opečte na horúcom oleji dozlatista, asi 8 minút, občas premiešajte.`,`Pridajte rascu a čili korenie, varte ešte 1 minútu, potom premiešajte s limetkovou šťavou.`,`Zohrejte tortilly, naplňte hubovou zmesou a pridajte toppingy.`],benefits:[`Vysoký obsah vlákniny vďaka hubám a toppingom`,`Dobrý rastlinný zdroj bielkovín z húb`,`Limetka dodáva vitamín C`]}},kingOyster:{scallops:{name:`Opekané "hrebenatky" z hlivy kráľovskej`,description:`Hrubé stopky hlivy kráľovskej nakrájané na plátky sa opekajú rovnako ako hrebenatky.`,ingredients:[`2 veľké stopky hlivy kráľovskej`,`1 PL masla`,`1 PL oleja`,`1 strúčik cesnaku`,`Soľ a korenie`,`Klinček citróna`],steps:[`Stopky nakrájajte na 2 cm hrubé kolieska; na každej ploche urobte plytký krížový zárez.`,`Osušte a osoľte, opepite.`,`Opekajte na horúcom oleji 3–4 minúty z každej strany, kým nie sú sýto zlatisté.`,`V poslednej minúte pridajte maslo a cesnak a podlievajte.`,`Dokončite kvapkou citróna a podávajte.`],benefits:[`Pevná textúra zasýti pri relatívne nízkom obsahu kalórií`,`Obsahuje draslík a vitamíny skupiny B`,`Prirodzene nízky obsah cukru`]},skewers:{name:`Grilované špízy z hlivy kráľovskej`,description:`Sójovo-zázvorová glazúra sa na pevných, mäsitých stopkách nad priamym ohňom krásne karamelizuje.`,ingredients:[`3 hlivy kráľovské, nakrájané na hrubšie kúsky`,`2 PL sójovej omáčky`,`1 PL medu`,`1 ČL nastrúhaného zázvoru`,`1 ČL sezamového oleja`,`Špajle`],steps:[`Vyšľahajte sójovú omáčku, med, zázvor a sezamový olej na glazúru.`,`Huby nakrájajte na hrubšie kúsky a premiešajte s polovicou glazúry; nechajte 10 minút odležať.`,`Napichajte na špajle a grilujte alebo opekajte na strednom až vysokom ohni, často obracajte, 8–10 minút.`,`V posledných 2 minútach potrite zvyšnou glazúrou a podávajte.`],benefits:[`Grilovanie namiesto vyprážania udrží pridaný tuk na miernej úrovni`,`Zázvor a cesnak prispievajú antioxidačnými rastlinnými látkami`,`Dobrý zdroj vitamínov skupiny B z húb`]}},lionsMane:{sauteed:{name:`Maslom opekané steaky z ježovca`,description:`Hrubé plátky sa opekajú do textúry pripomínajúcej morské plody — klasické prvé jedlo z ježovca.`,ingredients:[`1 ježovec, nakrájaný na 2 cm hrubé „steaky"`,`2 PL masla`,`1 rozdrvený strúčik cesnaku`,`Soľ a korenie`,`Klinček citróna`],steps:[`Celú plodnicu nakrájajte na hrubé steaky.`,`Pritlačte medzi papierové utierky, aby ste odstránili prebytočnú vlhkosť.`,`Opekajte na masle na strednom až vysokom ohni 3–4 minúty z každej strany, kým nie sú zlaté a chrumkavé po okrajoch.`,`V poslednej minúte pridajte cesnak, dochuťte a dokončite citrónom.`],benefits:[`Nízky obsah sacharidov`,`Obsahuje vitamíny skupiny B a minerály ako draslík`,`Prirodzene bez cholesterolu`]},crabcakes:{name:`Krabie placky z ježovca`,description:`Natrhaný a opekaný ježovec svojou textúrou dobre nahradí krabie mäso v opekanej placke.`,ingredients:[`300 g ježovca, ručne natrhaného`,`1 vajce`,`40 g strúhanky`,`1 PL majonézy`,`1 ČL korenia Old Bay alebo papriky`,`Olej na vyprážanie`],steps:[`Natrhaný ježovec opražte na suchej panvici, kým sa neuvoľní a neodparí vlhkosť, potom nechajte vychladnúť.`,`Zmiešajte s vajcom, strúhankou, majonézou a korením, kým hmota nedrží tvar.`,`Vytvarujte placky a nechajte 15 minút vychladiť v chladničke.`,`Vyprážajte na oleji na strednom ohni 3–4 minúty z každej strany dozlata.`],benefits:[`Dobrý rastlinný zdroj bielkovín vďaka vajcu a hubám`,`Menej nasýteného tuku ako klasické krabie placky`,`Obsahuje vitamíny skupiny B z húb`]}},shiitake:{stirfry:{name:`Shiitake wok s cesnakom a sójou`,description:`Čerstvé klobúčiky shiitake rýchlo opečené na vysokom ohni s jednoduchou cesnakovo-sójovou glazúrou.`,ingredients:[`250 g klobúčikov shiitake, nakrájaných`,`1 PL oleja`,`2 strúčiky cesnaku, nakrájané`,`1 PL sójovej omáčky`,`1 ČL sezamového oleja`,`Jarná cibuľka, nakrájaná`],steps:[`Klobúčiky nakrájajte a opečte na horúcom oleji dozlata, asi 5 minút.`,`Pridajte cesnak a 30 sekúnd opekajte, kým nezavonia.`,`Vmiešajte sójovú omáčku a sezamový olej a premiešajte.`,`Ozdobte jarnou cibuľkou a podávajte.`],benefits:[`Dobrý zdroj vitamínov skupiny B, najmä riboflavínu a niacínu`,`Obsahuje vlákninu a beta-glukány`,`Prirodzene nízky obsah tuku`]},dashi:{name:`Vývar dashi zo shiitake s podusenými klobúčikmi`,description:`Sušená alebo čerstvá shiitake dodá hlboko chutný vývar, dusené klobúčiky sa podávajú k nemu.`,ingredients:[`8 sušených shiitake (alebo 200 g čerstvých), namočených ak sú sušené`,`1 l vody`,`1 kus rias kombu (voliteľné)`,`2 PL sójovej omáčky`,`1 PL mirinu`],steps:[`Sušenú shiitake namočte do vody aspoň na 30 minút (pri čerstvej vynechajte).`,`Huby a kombu jemne duste 20 minút; kombu vyberte skôr, než začne vrieť.`,`Klobúčiky vyberte, nakrájajte a odložte.`,`Vývar dochuťte sójovou omáčkou a mirinom, vráťte nakrájané klobúčiky a duste ešte 5 minút.`],benefits:[`Veľmi nízky obsah tuku a kalórií`,`Bohatý umami vývar potrebuje menej pridanej soli na dochutenie`,`Shiitake prispieva vitamínmi skupiny B a minerálmi`]}},reishi:{tea:{name:`Odvar (čaj) z reishi`,description:`Reishi je príliš drevnatá na jedenie, preto sa dlho a pomaly varí, aby sa z nej uvoľnili horké látky do čaju.`,ingredients:[`5–10 g sušených plátkov reishi`,`500 ml vody`,`Med alebo citrón podľa chuti (voliteľné)`],steps:[`Plátky reishi vložte do vody v menšom hrnci.`,`Priveďte do varu, potom znížte na mierny var pod pokrievkou na 60–90 minút.`,`Precedite (plátky možno ešte raz povariť na slabší druhý nálev).`,`Osláďte podľa chuti a podávajte horúce.`],benefits:[`Prakticky bez kalórií, pokiaľ nie je sladený`,`Horúci nápoj bez kofeínu`,`Tradičný wellness nápoj — nie náhrada lekárskej liečby`]},tincture:{name:`Základná dvojitá extrakcia (tinktúra) z reishi`,description:`Dlhší domáci projekt, ktorý kombinuje namáčanie v alkohole s vodným odvarom, aby sa z drevnatej plodnice vyťažilo viac látok.`,ingredients:[`30 g sušenej reishi, najemno nasekanej`,`200 ml vodky alebo iného neutrálneho destilátu`,`200 ml vody`],steps:[`Reishi a vodku vložte do uzavretej nádoby; skladujte na tmavom mieste, denne pretrepte, na 2–4 týždne.`,`Precedite a alkoholový extrakt odložte; namočené kúsky reishi si ponechajte.`,`Namočené kúsky reishi duste vo vode 60–90 minút, aby vznikol odvar, potom precedite a mierne zredukujte.`,`Spojte alkoholový extrakt a zredukovaný odvar a naplňte do fľaše. Skladujte na chladnom, tmavom mieste.`],benefits:[`Nízky obsah kalórií pri bežnej dávke`,`Tradičná domáca príprava, nie lekárska liečba`,`Najlepšie užívať v malých, odmeraných množstvách`]}},wineCap:{sauteed:{name:`Stropharia na masle s cesnakom`,description:`Jednoduché opekanie, ktoré vyhovuje pevnej, oriešokovej dužine stropharie.`,ingredients:[`250 g stropharie obrovskej, nakrájanej`,`2 PL masla`,`2 strúčiky cesnaku, nasekané`,`Trocha bieleho vína alebo vývaru (voliteľné)`,`Soľ a korenie`],steps:[`Huby nakrájajte a opekajte na masle na strednom až vysokom ohni dozlata, 6–8 minút.`,`Pridajte cesnak a varte ešte 1 minútu.`,`Ak používate, podlejte trochou vína alebo vývaru a nechajte odpariť.`,`Dochuťte a podávajte.`],benefits:[`Pevná textúra pri miernom obsahu kalórií`,`Obsahuje vitamíny skupiny B a draslík`,`Prirodzene nízky obsah cukru`]},risotto:{name:`Rizoto zo stropharie obrovskej`,description:`Pevná textúra stropharie dobre znáša dlhé, pomalé miešanie počas prípravy rizota.`,ingredients:[`250 g stropharie obrovskej, nakrájanej`,`200 g ryže na rizoto`,`1 cibuľa, nadrobno nakrájaná`,`750 ml teplého vývaru`,`100 ml bieleho vína`,`40 g parmezánu`,`2 PL masla`],steps:[`Huby opečte na polovici masla dozlata; odložte.`,`V tom istom hrnci opražte cibuľu na zvyšnom masle domäkka, pridajte ryžu a 1 minútu opražte.`,`Prilejte víno a miešajte, kým sa nevsiakne, potom postupne po naberačkách pridávajte teplý vývar, za stáleho miešania, kým ryža nie je krémová a mierne tvrdá, asi 20 minút.`,`Vmiešajte huby a parmezán a ihneď podávajte.`],benefits:[`Ryža dodáva dlhotrvajúcu energiu zo zložených sacharidov`,`Huby dodávajú jedlu vitamíny skupiny B a vlákninu`,`Sýte bezmäsité hlavné jedlo`]}},buttonAgaricus:{grilled:{name:`Grilované klobúčiky pečiarky plnené cesnakom`,description:`Jednoduchý grilovaný predjedlo, ktoré funguje s klobúčikmi pečiarky aj s väčšími portobello klobúkmi.`,ingredients:[`8 klobúčikov pečiarky, bez stopiek`,`2 PL zmäknutého masla`,`1 strúčik cesnaku, nasekaný`,`Čerstvá petržlenová vňať, nasekaná`,`Soľ a korenie`],steps:[`Zmiešajte zmäknuté maslo s cesnakom a petržlenovou vňaťou.`,`Do každého klobúčika vložte trochu maslovej zmesi.`,`Grilujte alebo pečte pri 200 °C dozmäka, kým sa maslo nerozpustí, asi 12–15 minút.`,`Dochuťte a podávajte teplé.`],benefits:[`Nízky obsah kalórií a sacharidov`,`Obsahuje selén a vitamíny skupiny B`,`Jednoduché predjedlo, ktoré zostane nízkosolné, ak soľ použijete striedmo`]},soup:{name:`Klasická krémová hubová polievka`,description:`Obľúbená polievka pripravená od základu z čerstvej pečiarky.`,ingredients:[`400 g pečiarky, nakrájanej`,`1 cibuľa, nadrobno nakrájaná`,`2 PL masla`,`2 PL hladkej múky`,`600 ml vývaru`,`150 ml smotany`,`Soľ a korenie`],steps:[`Cibuľu opražte na masle domäkka, pridajte huby a opekajte dozlata, 8 minút.`,`Vmiešajte múku a 1 minútu povarte, aby zmizla surová chuť.`,`Postupne vmiešajte vývar, priveďte do varu a varte 10 minút.`,`Vmiešajte smotanu, dochuťte a čiastočne alebo úplne rozmixujte podľa želanej textúry.`],benefits:[`Klasické komfortné jedlo, ktoré zároveň nesie vitamíny skupiny B z húb`,`Dobrý zdroj draslíka`,`Dá sa odľahčiť znížením množstva smotany`]}},turkeyTail:{tea:{name:`Odvar (čaj) z outkovky pestrej`,description:`Outkovka je tenká, ale tuhá a kožovitá, preto sa skôr varí ako pripravuje ako jedlo.`,ingredients:[`5–8 g sušenej outkovky, polámanej na kúsky`,`500 ml vody`,`Med alebo citrón podľa chuti (voliteľné)`],steps:[`Kúsky outkovky vložte do vody v menšom hrnci.`,`Priveďte do varu, potom duste pod pokrievkou 45–60 minút.`,`Precedite, osláďte podľa chuti a podávajte horúce.`],benefits:[`Prakticky bez kalórií, pokiaľ nie je sladený`,`Horúci nápoj bez kofeínu`,`Tradičná príprava, nie lekárska liečba`]},broth:{name:`Hubový vývar z outkovky pestrej`,description:`Dlhé, prevažne bezobslužné dusenie premení outkovku a koreňovú zeleninu na chutný vývar alebo základ na polievku.`,ingredients:[`20 g sušenej outkovky`,`2 l vody`,`1 cibuľa, prekrojená na polovicu`,`2 mrkvy, nakrájané`,`2 strúčiky cesnaku`,`Soľ podľa chuti`],steps:[`Všetky suroviny vložte do veľkého hrnca.`,`Priveďte do varu, potom znížte na mierny var, čiastočne prikryté, na 2,5–3 hodiny.`,`Precedite a pevné časti vyhoďte.`,`Osoľte a použite ako vývar alebo základ na polievku.`],benefits:[`Nízky obsah tuku a kalórií na porciu`,`Zelenina dodáva vlákninu a vitamín A`,`Tradičná, prevažne bezobslužná príprava`]}},chestnut:{sauteed:{name:`Šupinovka gaštanová na masle so sójou`,description:`Pevné, oriešokovej chuti trsy šupinovky si pri rýchlom opekaní dobre zachovajú tvar.`,ingredients:[`250 g šupinovky gaštanovej, orezanej a rozdelenej`,`2 PL masla`,`1 PL sójovej omáčky`,`1 strúčik cesnaku, nasekaný`,`Čierne korenie`],steps:[`Orežte spodnú časť a rozdeľte trs na menšie kúsky.`,`Opekajte na masle na strednom až vysokom ohni dozlata, 6–8 minút.`,`Pridajte cesnak a sójovú omáčku, premiešavajte ešte 1 minútu.`,`Dokončite čiernym korením a podávajte.`],benefits:[`Pevné trsy húb sú pred varením nízkotučné`,`Obsahujú vitamíny skupiny B a draslík`,`Prirodzene nízky obsah cukru`]},noodles:{name:`Rezance so šupinovkou gaštanovou`,description:`Rýchle jedlo na všedný deň postavené na trsnatej textúre huby.`,ingredients:[`250 g šupinovky gaštanovej, rozdelenej`,`200 g uvarených rezancov`,`1 PL oleja`,`2 PL sójovej omáčky`,`1 ČL sezamového oleja`,`Jarná cibuľka a sezamové semienka na ozdobu`],steps:[`Rezance uvarte podľa návodu na obale a odložte.`,`Huby opečte na horúcom oleji dozlata, asi 6 minút.`,`Pridajte uvarené rezance, sójovú omáčku a sezamový olej a premiešajte, kým sa neprehreje.`,`Ozdobte jarnou cibuľkou a sezamovými semienkami.`],benefits:[`Dodáva dlhotrvajúcu energiu zo sacharidov v rezancoch`,`Huby prispievajú vitamínmi skupiny B a vlákninou`,`Rýchle, sýte jedlo z jednej misky`]}},enoki:{soup:{name:`Miso polievka s enoki`,description:`Jemné zväzočky enoki sú prirodzeným, rýchlym doplnkom do ľahkého miso vývaru.`,ingredients:[`150 g enoki, orezaná spodná časť`,`600 ml dashi alebo vývaru`,`2 PL miso pasty`,`1 jarná cibuľka, nakrájaná`,`Kocky tofu (voliteľné)`],steps:[`Orežte drevnatú spodnú časť trsu enoki a rozdeľte na menšie zväzky.`,`Dashi alebo vývar priveďte k miernemu varu.`,`Miso pastu rozpustite v naberačke horúceho vývaru, potom vmiešajte späť do hrnca (po pridaní misa už nevarte).`,`Pridajte enoki a tofu, nechajte 1–2 minúty prehriať a ozdobte jarnou cibuľkou.`],benefits:[`Ľahká, nízkokalorická polievka`,`Miso dodáva fermentovanú sójovú bielkovinu`,`Enoki prispieva vlákninou a vitamínmi skupiny B`]},baconWrap:{name:`Enoki zabalené v slanine`,description:`Obľúbené opekané predjedlo — dlhé vlákna enoki sa v slaninovom obale krásne prepečú.`,ingredients:[`150 g enoki, orezaná spodná časť`,`6 plátkov slaniny`,`2 PL sójovej omáčky`,`1 PL medu`,`1 ČL praženého sezamu`],steps:[`Orežte spodnú časť enoki a rozdeľte na malé zväzky široké asi ako plátok slaniny.`,`Každý zväzok pevne obaľte plátkom slaniny.`,`Opekajte švom nadol na strednom ohni, kým slanina nie je chrumkavá, obracajte, aby sa prepiekli všetky strany, asi 8 minút.`,`V poslednej minúte pridajte na panvicu sójovú omáčku a med, aby vznikla glazúra, a posypte sezamom.`],benefits:[`Bielkovinovo bohaté predjedlo zo slaniny a húb`,`Enoki dodáva vlákninu, ktorá vyváži bohatosť slaniny`,`Najlepšie ako príležitostná pochúťka vzhľadom na obsah slaniny`]}},cordyceps:{tea:{name:`Zázvorový čaj s kordycepsom`,description:`Rýchlo lúhovaný čaj vhodný pre jemné, tenké plodnice kordycepsu.`,ingredients:[`3–5 g sušeného kordycepsu`,`2–3 plátky čerstvého zázvoru`,`400 ml vody`,`Med podľa chuti (voliteľné)`],steps:[`Kordyceps a zázvor vložte do vody v menšom hrnci.`,`Priveďte do varu, potom jemne duste 10–15 minút.`,`Precedite, osláďte podľa chuti a podávajte horúce.`],benefits:[`Prakticky bez kalórií, pokiaľ nie je sladený`,`Zázvor dodáva zahrievajúcu, tráveniu prospešnú chuť`,`Tradičný wellness nápoj, nie lekárska liečba`]},soup:{name:`Hubová polievka s kordycepsom`,description:`Jemná slaná polievka inšpirovaná tradičnými vývarmi s kordycepsom a mäsom alebo zeleninou.`,ingredients:[`10 g sušeného kordycepsu (alebo hrsť čerstvého)`,`1 l kuracieho alebo zeleninového vývaru`,`100 g nakrájaného kuracieho mäsa alebo tofu`,`2 plátky zázvoru`,`Soľ podľa chuti`],steps:[`Sušený kordyceps krátko opláchnite.`,`Vývar priveďte k varu so zázvorom a kordycepsom a varte 15 minút.`,`Pridajte kuracie mäso alebo tofu a duste, kým sa neuvarí, ešte asi 10 minút.`,`Osoľte a podávajte horúce.`],benefits:[`Vysokobielkovinová polievka z kuracieho mäsa alebo tofu`,`Nízky obsah tuku, ak sa pripraví z chudého kuracieho mäsa alebo tofu`,`Zázvor dodáva zahrievajúcu chuť`]}},maitake:{roasted:{name:`Pečené „steaky" z maitake`,description:`Pečenie celých trsov v rúre spraví okraje chrumkavými, no základ zostane šťavnatý.`,ingredients:[`1 trs maitake, ponechaný väčšinou celý alebo natrhaný na väčšie kusy`,`2 PL oleja`,`1 strúčik cesnaku, nasekaný`,`Soľ a korenie`,`Čerstvý tymian (voliteľné)`],steps:[`Rúru predhrejte na 220 °C.`,`Trs natrhajte na niekoľko väčších kusov a premiešajte s olejom, cesnakom, soľou a korením.`,`Pečte na plechu rezom nadol 15–20 minút, kým nie sú okraje chrumkavé.`,`Ak chcete, dokončite čerstvým tymianom a podávajte.`],benefits:[`Nízky obsah kalórií a sacharidov`,`Dobrý zdroj vitamínov skupiny B a draslíka`,`Prirodzene bez cholesterolu`]},tempura:{name:`Tempura z maitake`,description:`Strapaté, vrstvené trsy majú veľký povrch, ktorý sa v cestíčku a pri vyprážaní krásne prepečie.`,ingredients:[`200 g maitake, natrhaného na trsy`,`80 g hladkej múky`,`1 vajce`,`120 ml studenej vody`,`Olej na vyprážanie`,`Soľ alebo dip na podávanie`],steps:[`V hlbšej panvici zohrejte olej na približne 180 °C.`,`Múku, vajce a studenú vodu vyšľahajte na ľahké, mierne hrudkovité cestíčko.`,`Trsy húb namáčajte do cestíčka a vyprážajte po dávkach do svetlozlata, 2–3 minúty.`,`Nechajte odkvapkať na papierovej utierke a ihneď podávajte so soľou alebo dipom.`],benefits:[`Vzácna pochúťka — v cestíčku a vyprážaná, preto tučnejšia ako väčšina hubových jedál tu uvedených`,`Maitake stále prispieva vitamínmi skupiny B a vlákninou`,`Najlepšie príležitostne, nie ako každodenné jedlo`]}},morel:{sauteed:{name:`Klasické smrže opekané na masle`,description:`Jednoduchá príprava, ktorá vyzdvihne medovníkovú textúru smržov — smrže vždy dôkladne prevarte, nikdy ich nejedzte surové alebo nedovarené.`,ingredients:[`200 g čerstvých smržov, pozdĺžne prekrojených a dôkladne umytých`,`2 PL masla`,`1 malá šalotka, nasekaná`,`Soľ a korenie`,`Čerstvá pažítka (voliteľné)`],steps:[`Smrže pozdĺžne prekrojte a dôkladne umyte, aby ste odstránili nečistoty z medovníkového klobúka.`,`Šalotku opražte na masle na strednom ohni domäkka.`,`Pridajte smrže a varte, často premiešavajte, 8–10 minút, kým nie sú úplne mäkké — smrže musia byť prevarené celé, nielen opečené na povrchu.`,`Dochuťte soľou a korením a dokončite paží
