PDA; dobrá voľba, ak už pracujete so zemiakovými médiami.`,ratingNote:`Veľmi dobré — blízko kopíruje nutričný profil PDA a dáva energický rast, no vyžaduje viac prípravy než cukrové sirupy.`,ingredients:[`Ošúpaný zemiak (nakrájaný)`,`Dextróza (glukóza)`,`Voda (na varenie + doplnenie objemu)`],steps:[`Ošúpte a nakrájajte {i0w} zemiakov, potom varte vo väčšine vody 20 – 30 minút, kým nezmäknú.`,`Sceďte zemiakové kúsky, ponechajte len výluh. Rozpustite v ňom {i1w} dextrózy, kým je ešte teplý.`,`Doplňte vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe a nechajte prerásť pri 21 – 27 °C, kým sa neobjaví chumáčovitý biely rast (3 – 10 dní).`],hygiene:`Zemiakové tekutiny sú bohaté na živiny a náchylnejšie na kontamináciu — dôkladne sterilizujte a udržujte veľmi čistú techniku pri injektovaní.`},brownsugar:{name:`Sirup z hnedého cukru — 4 %`,description:`Rozpočtová tekutá kultúra zo špajze s hnedým cukrom — o stupeň jednoduchšia než LME, ale veľmi lacná a účinná.`,ratingNote:`Dobrá rozpočtová voľba — funguje spoľahlivo, hoci rast je zvyčajne o niečo menej energický než pri sladových receptoch.`,ingredients:[`Hnedý cukor`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} hnedého cukru do teplej vody, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým sa neobjaví chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Obsah melasy v hnedom cukre môže sirup mierne stmaviť a sťažiť včasné rozpoznanie kontaminácie — dôkladne kontrolujte a sterilizujte.`},maple:{name:`Javorový sirup — 4 %`,description:`Improvizovaná tekutá kultúra s čistým javorovým sirupom — jeho prirodzený obsah minerálov môže mierne zvýšiť vitalitu oproti obyčajným cukrovým sirupom.`,ratingNote:`Dobrá alternatíva zo špajze — stopové minerály môžu pomôcť vitalite, no čistý javorový sirup je drahšia voľba.`,ingredients:[`Čistý javorový sirup (nie palacinkový sirup)`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} čistého javorového sirupu do teplej vody, kým sa úplne nerozpustí.`,`Doplňte zvyšnou vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte prerásť pri 21 – 27 °C, občas pošúchajte, kým sa neobjaví chumáčovitý biely rast mycélia (3 – 10 dní).`],hygiene:`Používajte len čistý javorový sirup — napodobenina "palacinkového sirupu" je väčšinou kukuričný sirup s prísadami bez prínosu. Sterilizujte dôkladne ako pri každom cukrovom médiu.`},wort:{name:`Domáci sladový mladinkový výluh (jačmeň)`,description:`Plne improvizovaná tekutá kultúra pripravená lúhovaním drveného sladovaného jačmeňa (ako mini pivovarská vystieranka) namiesto kupovaného sladového extraktu.`,ratingNote:`Vynikajúce — v podstate domáci sladový extrakt, výkon takmer identický s LME, keď zvládnete techniku vystierania.`,ingredients:[`Drvený sladovaný jačmeň`,`Voda (na lúhovanie + doplnenie objemu)`],steps:[`Zohrejte väčšinu vody na 65 – 68 °C (použite teplomer — tento rozsah premieňa škrob na cukor bez zničenia enzýmov).`,`Vmiešajte {i0w} drveného sladovaného jačmeňa a držte pri 65 – 68 °C 60 minút, občas premiešajte (toto je mini "vystierka").`,`Precedite cez sieťové vrecko alebo gázu, ponechajte len sladkú tekutinu (mladinu). Doplňte vodou na celkový objem {V}.`,`Rozdeľte do pohárov, naplňte na 70 – 80 % objemu. Použite viečka so samozatváracím injekčným portom a mikrónovým filtrom.`,`Tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút, potom nechajte úplne vychladnúť.`,`Vstreknite roztok spór alebo tekutú kultúru (1 – 2 ml na pohár) v boxe s nehybným vzduchom alebo laminárnom boxe a nechajte prerásť pri 21 – 27 °C, kým sa neobjaví chumáčovitý biely rast (3 – 10 dní).`],hygiene:`Teplotu vystierania starostlivo dodržujte — príliš horúca zničí enzymatickú konverziu, príliš studená dá priestor baktériám pred sterilizáciou.`}},agar:{mea:{name:`Sladový agar (MEA)`,description:`Najobľúbenejší domáci agar pre prácu s kultúrami húb — jemná úroveň živín, ľahko sa leje a číta.`,ratingNote:`Vynikajúce — zlatý štandard pre domácu prácu s kultúrami, spoľahlivý a ľahko čitateľný.`,ingredients:[`Svetlý sladový extrakt (LME)`,`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Skombinujte {i0w} svetlého sladového extraktu a {i1w} agar-agar prášku s vodou (celkovo {V}) v teplovzdornej banke alebo pohári.`,`Premiešajte, potom zohrejte/varte 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí (tekutina zosvetlie, žiadny zrnitý prášok).`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté) — nenechajte úplne stuhnúť v nádobe.`,`V boxe s nehybným vzduchom alebo laminárnom boxe nalejte tenkú vrstvu (cca 20 – 25 ml na štandardnú 90 mm misku) do sterilných Petriho misiek, jemne pokrúťte na pokrytie dna.`,`Nechajte viečka pootvorené, kým agar stuhne a vychladne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Pred liatím utrite pracovnú plochu izopropylalkoholom a lejte rýchlo po otvorení misiek, aby ste minimalizovali vystavenie vzdušnej kontaminácii.`},pda:{name:`Zemiakovo-dextrózový agar (PDA)`,description:`Klasický mykologický štandard z pravého zemiakového výluhu — skvelý na pozorovanie charakteristík mycélia.`,ratingNote:`Vynikajúce — mykologicky štandardná receptúra, skvelá vitalita a ideálna na pozorovanie rastových charakteristík.`,ingredients:[`Ošúpaný zemiak (nakrájaný)`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na varenie + doplnenie objemu)`],steps:[`Ošúpte a nakrájajte {i0w} zemiakov, potom varte vo väčšine vody 20 – 30 minút, kým nezmäknú.`,`Sceďte kúsky, ponechajte len výluh. Doplňte vodou späť na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`PDA je bohatý na živiny, preto je náchylnejší na bakteriálnu kontamináciu — dôkladne sterilizujte a lejte veľmi čistou technikou.`},mya:{name:`Sladovo-kvasnicový agar (MYA)`,description:`MEA vylepšený o malé množstvo nutričných/pivovarníckych kvasníc pre o niečo rýchlejší a energickejší rast mycélia.`,ratingNote:`Vynikajúce — pridané kvasnice zjavne urýchľujú a posilňujú rast oproti obyčajnému MEA.`,ingredients:[`Svetlý sladový extrakt (LME)`,`Nutričné/pivovarnícke kvasnice`,`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Skombinujte {i0w} svetlého sladového extraktu, {i1w} nutričných kvasníc a {i2w} agar-agar prášku s vodou (celkovo {V}).`,`Premiešajte, potom zohrejte/varte 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Pridané kvasnice robia toto médium bohatším — lejte rýchlo a udržujte pracovnú plochu čerstvo dezinfikovanú, aby ste predišli kontaminácii.`},honeyagar:{name:`Medový agar`,description:`Agar zo špajze so surovým medom namiesto sladového extraktu — jednoduchá voľba, ak nemáte poruke LME.`,ratingNote:`Dobrá záložná voľba, keď nie je LME poruke, hoci gél časom rýchlejšie mäkne.`,ingredients:[`Surový med`,`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Rozpustite {i1w} agar-agar prášku vo vode (celkovo {V}) a priveďte k varu na 1 – 2 minúty za miešania, kým sa úplne nerozpustí.`,`Odstavte z ohňa a vmiešajte {i0w} surového medu, kým sa nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Med môže časom agar mierne zmäkčiť — misky použite do pár týždňov a skladujte v chlade. Sterilizujte dôkladne ako pri každom cukrovom médiu.`},ricewater:{name:`Ryžový agar (RWA)`,description:`Lacný, hojne používaný improvizovaný agar zo škrobovej ryžovej vody — bežná náhrada bez sladového extraktu.`,ratingNote:`Dobrá rozpočtová improvizovaná voľba — solídny rast na izolačnú prácu, no menej energický než MEA/PDA.`,ingredients:[`Nevarená biela ryža`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na varenie + doplnenie objemu)`],steps:[`Povarte {i0w} nevarenej ryže vo väčšine vody 15 – 20 minút, kým voda nezhustne a nezakalí sa škrobom — ryža nesmie úplne rozpadnúť.`,`Sceďte ryžu, ponechajte len škrobovú vodu. Doplňte vodou späť na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Ryžový škrob podporuje kontaminanty rovnako ochotne ako mycélium — dôkladne sterilizujte a nevynechajte tlakovú sterilizáciu, aj keď ingrediencie vyzerajú "ako obyčajné jedlo".`},coconutwater:{name:`Kokosovo-vodný agar (CWA)`,description:`Improvizovaný agar s nesladenou kokosovou vodou ako základnou tekutinou — prirodzene obsahuje cukry a minerály.`,ratingNote:`Dobrá improvizovaná voľba — prirodzene takmer sterilná tekutina so slušným obsahom minerálov, no menej rafinovaný rast než pri MEA.`,ingredients:[`Nesladená kokosová voda`,`Dextróza (glukóza)`,`Agar-agar prášok`],steps:[`Nalejte {i0v} nesladenej kokosovej vody (čistej, bez pridaného cukru/príchute) do teplovzdornej banky alebo pohára.`,`Vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku, potom priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Používajte čistú, nesladenú, najlepšie pasterizovanú kokosovú vodu — ochutené alebo sladené verzie sa ľahšie kontaminujú a môžu brzdiť mycélium.`},plainwater:{name:`Vodný agar (PWA)`,description:`Holý improvizovaný agar bez pridaných živín — užitočný na kontrolu klíčenia spór a izoláciu čistého tkaniva od rýchlejšie rastúcich kontaminantov.`,ratingNote:`Priemerný celkový výkon — zámerne pomalý, tenký rast, ale cenný špecificky pre čistú izoláciu a klíčenie.`,ingredients:[`Agar-agar prášok`,`Destilovaná/RO voda (do finálneho objemu)`],steps:[`Vmiešajte {i0w} agar-agar prášku do {V} vody v teplovzdornej banke alebo pohári.`,`Priveďte k miernemu varu na 1 – 2 minúty za stáleho miešania, kým sa agar úplne nerozpustí (tekutina zosvetlie).`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Bez pridaných živín majú rýchlo rastúce kontaminanty menšiu výhodu — vhodné na izoláciu čistého mycélia, no rast bude pomalší a tenší než na MEA/PDA.`},banana:{name:`Banánový agar (BA)`,description:`Improvizovaný agar z rozmixovaného zrelého banánu — obľúbená ovocná voľba s dobrým obsahom prirodzených cukrov.`,ratingNote:`Dobrá improvizovaná voľba — zrelé banány poskytujú solídne cukry, no dávky môžu byť o niečo zakalenejšie/menej čisté než MEA.`,ingredients:[`Zrelý banán (rozmixovaný)`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na mixovanie + doplnenie objemu)`],steps:[`Rozmixujte {i0w} ošúpaného zrelého banánu s asi tretinou vody dohladka.`,`Precedite cez gázu alebo jemné sitko na odstránenie dužinových vlákien, ponechajte tekutinu. Doplňte zvyšnou vodou na celkový objem {V}.`,`Vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku, potom priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Používajte úplne zrelé (ale nie plesnivé) banány a dôkladne precedite — zvyšné dužinové vlákna môžu zachytávať vzduchové bubliny a sťažiť včasné rozpoznanie kontaminácie.`},carrot:{name:`Mrkvový agar (CA)`,description:`Improvizovaný agar s vyvareným mrkvovým výluhom namiesto zemiaka — bežná začiatočnícka náhrada za PDA.`,ratingNote:`Dobrá improvizovaná voľba — mierny, pre začiatočníkov príjemný nutričný profil, bežne používaný na izolačnú prácu.`,ingredients:[`Mrkva (nakrájaná)`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na varenie + doplnenie objemu)`],steps:[`Nakrájajte {i0w} mrkvy a varte vo väčšine vody 20 – 30 minút, kým nezmäkne.`,`Sceďte kúsky, ponechajte len mrkvový výluh. Doplňte vodou späť na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Mrkvové výluhy majú mierny obsah živín — sterilizujte štandardne dôkladne, no počítajte s o niečo pomalšou kolonizáciou než pri bohatších médiách ako PDA.`},beerwort:{name:`Pivný mladinkový agar (domáci slad)`,description:`Plne improvizovaný agar pripravený lúhovaním drveného sladovaného jačmeňa do domácej mladiny, následne stuženej agarom — bez potreby kupovaného sladového extraktu.`,ratingNote:`Vynikajúce — v podstate domáci MEA, keď zvládnete techniku vystierania, s veľmi podobným výkonom.`,ingredients:[`Drvený sladovaný jačmeň`,`Dextróza (glukóza)`,`Agar-agar prášok`,`Voda (na lúhovanie + doplnenie objemu)`],steps:[`Zohrejte väčšinu vody na 65 – 68 °C, potom vmiešajte {i0w} drveného sladovaného jačmeňa. Držte pri 65 – 68 °C 45 – 60 minút, občas premiešajte.`,`Precedite cez sieťové vrecko alebo gázu, ponechajte len sladkú mladinu. Doplňte vodou na celkový objem {V}.`,`Za tepla vmiešajte {i1w} dextrózy a {i2w} agar-agar prášku. Priveďte k miernemu varu na 1 – 2 minúty za miešania, kým sa agar úplne nerozpustí.`,`Nalejte do teplovzdorných pohárov alebo fliaš, voľne uzavrite a tlakovo sterilizujte pri 15 psi (121 °C) 20 – 25 minút.`,`Nechajte vychladnúť, kým sa dá bezpečne uchopiť (cca 50 – 60 °C, ešte tekuté), potom nalejte do sterilných Petriho misiek v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Nechajte viečka pootvorené, kým stuhne, potom zatvorte a skladujte hore dnom v chladničke do použitia.`],hygiene:`Starostlivo dodržujte teplotu vystierania pre správnu premenu škrobu na cukor a následne dôkladne sterilizujte — rovnaká starostlivosť ako pri tekutej verzii tohto receptu.`}},grain:{rye:{name:`Raž (zrno)`,description:`Klasické a najpoužívanejšie osivové zrno — malé, rovnomerné a spoľahlivé pre takmer každý gurmánsky druh.`,ratingNote:`Vynikajúce — zlatý štandard osivového zrna: stabilná kolonizácia a široká kompatibilita takmer s každým druhom.`,ingredients:[`Suché ražné zrno`,`Voda (na namáčanie a varenie)`,`Sadra (síran vápenatý)`],steps:[`Odmerajte {i0v} ({i0w}) suchého ražného zrna a dôkladne prepláchnite v cedníku, kým voda nebude čistá.`,`Namáčajte v {i1v} vody 12 – 24 hodín pri izbovej teplote, potom jemne varte 10 – 15 minút, kým sa šupky mierne nepopraskajú — vyhnite sa prudkému varu, ktorý zrná roztrhne a zvyšuje riziko kontaminácie.`,`Dôkladne sceďte v cedníku 15 – 20 minút a nechajte povrch mierne oschnúť, potom primiešajte {i2w} sadry na obmedzenie zlepovania.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte v tlakovom hrnci pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte cez injekčný port v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte, aby sa očkovací bod rozšíril po celom pohári, a nechajte prerásť v tme pri 21 – 24 °C (zvyčajne 1 – 3 týždne).`],hygiene:`Raž má vysoký obsah živín a patrí medzi náchylnejšie osivá na kontamináciu — dôkladne ju sceďte (mokré poháre sú najčastejšou príčinou „kyslého" osiva) a nekráťte čas sterilizácie.`},wheatberries:{name:`Pšenica (zrno)`,description:`Blízka alternatíva k raži s podobnou veľkosťou a obsahom škrobu — použite to, čo je lacnejšie alebo dostupnejšie.`,ratingNote:`Vynikajúce — funguje takmer identicky ako raž, skvelá náhrada, keď raž nie je dostupná.`,ingredients:[`Suché pšeničné zrno`,`Voda (na namáčanie a varenie)`,`Sadra (síran vápenatý)`],steps:[`Odmerajte {i0v} ({i0w}) suchého pšeničného zrna a dôkladne prepláchnite, kým voda nebude čistá.`,`Namáčajte v {i1v} vody 12 – 24 hodín, potom jemne varte 10 – 15 minút, kým sa šupky mierne nepopraskajú.`,`Dôkladne sceďte 15 – 20 minút a nechajte povrch mierne oschnúť, potom primiešajte {i2w} sadry.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút a po úplnom vychladnutí naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte na rozšírenie očkovania a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Podobne ako raž, aj pšenica je bohatá na živiny a náchylná na „kyslé" osivo, ak zostane príliš mokrá — dôkladne sceďte a dodržte celý čas sterilizácie.`},oats:{name:`Ovos (celé zrno)`,description:`Zrno s mäkšou šupkou, ktoré kolonizuje o niečo rýchlejšie ako raž, hoci po hydratácii je šupka krehkejšia.`,ratingNote:`Veľmi dobré — rýchla kolonizácia, ale po hydratácii zaobchádzajte opatrne, šupka sa ľahšie rozpadáva.`,ingredients:[`Celé ovsené zrno`,`Voda (na namáčanie a varenie)`,`Sadra (síran vápenatý)`],steps:[`Odmerajte {i0v} ({i0w}) celého ovsa a dôkladne prepláchnite, kým voda nebude väčšinou čistá.`,`Namáčajte v {i1v} vody 8 – 12 hodín (ovos hydratuje rýchlejšie ako raž), potom jemne varte 5 – 10 minút, kým nebude práve mäkký — sledujte pozorne, ovos sa rýchlo rozvarí.`,`Dôkladne sceďte a zaobchádzajte opatrne — zmäknutá šupka sa ľahko trhá. Keď je povrch väčšinou suchý, primiešajte {i2w} sadry.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Jemne pretrepte a nechajte prerásť v tme pri 21 – 24 °C — ovos zvyčajne prerastie o niekoľko dní rýchlejšie ako raž.`],hygiene:`Ovos hydratuje a rozvarí sa rýchlejšie ako raž — radšej varte kratšie, pretože rozvarené zrno sa horšie sceďuje a ľahšie kontaminuje.`},popcorn:{name:`Pukancová kukurica (celé zrno)`,description:`Lacné a bežne dostupné hromadné osivo — obyčajné neochutené pukancové zrná, nie mikrovlnné vrecko.`,ratingNote:`Dobré — lacné a ľahko dostupné, hoci kolonizácia je o niečo menej konzistentná ako pri raži.`,ingredients:[`Suché pukancové zrná`,`Voda (na namáčanie a varenie)`],steps:[`Odmerajte {i0v} ({i0w}) suchých pukancových zŕn (obyčajných, neochutených) a dôkladne prepláchnite.`,`Namáčajte v {i1v} vody 24 hodín, potom jemne varte 15 – 20 minút, kým zrná nenabobtnajú a šupka sa mierne nepopraská — nedovoľte, aby vypukali.`,`Dôkladne sceďte v cedníku 15 – 20 minút, kým na dne nezostane žiadna voda.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Tvrdá šupka pukancov dobre znáša manipuláciu, ale pred naplnením pohárov sa uistite, že sú zrná hydratované až po stred — tvrdé suché jadro neprerastie.`},millet:{name:`Proso`,description:`Malé okrúhle zrno obľúbené pre veľký povrch osiva — mnoho malých zŕn rýchlo rozšíri kolonizáciu do substrátu.`,ratingNote:`Dobré — vynikajúci povrch pre osivo substrátu, ale ľahko sa rozvarí na kašu, ak sa dlho varí.`,ingredients:[`Suché proso`,`Voda (na namáčanie a varenie)`],steps:[`Odmerajte {i0v} ({i0w}) suchého prosa a dôkladne prepláchnite v jemnom site.`,`Namáčajte v {i1v} vody 8 – 12 hodín, potom jemne varte iba 5 – 8 minút — proso je malé a varí sa rýchlo, sledujte pozorne, aby sa nerozvarilo na kašu.`,`Dôkladne sceďte a nechajte krátko oschnúť na povrchu pred naplnením pohárov.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Dôkladne pretrepte — mnoho malých zŕn prosa rýchlo rozšíri očkovacie body — a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Malá veľkosť prosa znamená, že sa rozvarí za minúty, nie desiatky minút — rozvarené, rozbité zrno sa horšie sceďuje a je oveľa náchylnejšie na kontamináciu.`},sorghum:{name:`Cirok (milo)`,description:`Lacné hromadné zrno, často predávané ako krmivo pre vtáky — solídna rozpočtová voľba podobnej veľkosti ako proso.`,ratingNote:`Dobré — veľmi cenovo dostupné a bežne dostupné, so solídnou kolonizáciou po správnej hydratácii.`,ingredients:[`Suchý cirok (milo)`,`Voda (na namáčanie a varenie)`],steps:[`Odmerajte {i0v} ({i0w}) suchého ciroku (milo) a dôkladne prepláchnite, pri hromadnom krmive pre vtáky vyberte prípadné nečistoty.`,`Namáčajte v {i1v} vody 12 – 24 hodín, potom jemne varte 10 – 15 minút, kým zrná nenabobtnajú a šupka sa mierne nepopraská.`,`Dôkladne sceďte v cedníku 15 – 20 minút.`,`Naplňte poháre s viečkami s injekčným portom do cca 60 – 65 % objemu ({V} celkového hydratovaného zrna).`,`Sterilizujte pri 15 psi (121 °C) 90 minút, nechajte úplne vychladnúť a naočkujte v boxe s nehybným vzduchom alebo laminárnom boxe.`,`Pretrepte a nechajte prerásť v tme pri 21 – 24 °C.`],hygiene:`Ak cirok kupujete ako hromadné „krmivo pre vtáky", skontrolujte vrecko na iné primiešané druhy zŕn a vyberte ich — jednotné zrno kolonizuje rovnomernejšie.`}},species:{oyster:{name:`Hliva ustricovitá (Pleurotus ostreatus)`,description:`Klasický druh pre začiatočníkov — rýchly, odpúšťajúci chyby a produktívny na takmer akomkoľvek lacnom substráte.`,ratingNote:`Vynikajúce — najodpúšťajúcejší a najspoľahlivejší druh na prvé pestovanie, znáša aj nie úplne ideálne podmienky.`},pinkOyster:{name:`Ružová hliva (Pleurotus djamor)`,description:`Rýchlo rastúca, teplomilná príbuzná hlivy s výraznou ružovou farbou — rýchlo tvorí zárodky, ale po zbere má krátku trvanlivosť.`,ratingNote:`Veľmi dobré — veľmi rýchly rast a nápadná farba, no plodnice sa kazia už do jedného-dvoch dní, počítajte s rýchlym spracovaním.`},kingOyster:{name:`Hliva kráľovská (Pleurotus eryngii)`,description:`Hrubé, mäsité stopky a jemnejšia chuť ako pri iných hlivách — cenená pre textúru, no pomalšia a náročnejšia na chladnejšie plodenie.`,ratingNote:`Veľmi dobré — výborná textúra a trvanlivosť, no potrebuje chladnejšie plodenie a nižšiu výmenu vzduchu ako väčšina hlív.`},lionsMane:{name:`Ježovec bahňanský (Hericium erinaceus)`,description:`Výrazná strapatá biela plodnica bez skutočného klobúka a lupeňov — obľúbená pre textúru pripomínajúcu morské plody a kulinárske/nutraceutické využitie.`,ratingNote:`Vynikajúce — spoľahlivý a vďačný druh, no potrebuje silnú vým
